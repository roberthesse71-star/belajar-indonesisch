<script>
"use strict";
/* =====================================================================
   Belajar v2 – Indonesisch bis B1
   ===================================================================== */

/* ---------- Aussprachehilfe (regelbasiert) ---------- */
const PH_MAP={c:"tsch",j:"dsch",y:"j",ny:"nj",sy:"sch",kh:"ch",gh:"g",q:"k",v:"f",z:"s",x:"ks","é":"e"};
function phonWord(w){
  w=w.toLowerCase().replace(/[^a-zé]/g,"");
  if(!w)return "";
  const toks=[];let i=0;const VOW="aeioué";
  while(i<w.length){
    const c=w[i],d=w.substr(i,2);
    if(VOW.includes(c)){toks.push({v:1,s:c});i++;continue;}
    if(d==="ng"||d==="ny"||d==="sy"||d==="kh"||d==="gh"){toks.push({v:0,s:d});i+=2;continue;}
    toks.push({v:0,s:c});i++;
  }
  let nuc=[];toks.forEach((t,k)=>{if(t.v)nuc.push(k);});
  if(!nuc.length)return w;
  const n0=nuc.length;
  if(n0>=2&&nuc[n0-1]===toks.length-1&&nuc[n0-2]===nuc[n0-1]-1&&["ai","au","oi"].includes(toks[nuc[n0-2]].s+toks[nuc[n0-1]].s)){
    toks[nuc[n0-2]].s+=toks[nuc[n0-1]].s;toks.pop();nuc.pop();
  }
  const starts=[0];
  for(let j=0;j<nuc.length-1;j++){
    const m=nuc[j+1]-nuc[j]-1;
    starts.push(m===0?nuc[j]+1:m===1?nuc[j]+1:nuc[j]+2);
  }
  starts.push(toks.length);
  const syl=[];
  for(let j=0;j<nuc.length;j++){
    const part=toks.slice(starts[j],starts[j+1]);
    syl.push({txt:part.map(t=>PH_MAP[t.s]||t.s).join(""),vow:toks[nuc[j]].s,len:part.length});
  }
  const n=syl.length;let st=-1;
  if(n>1){
    st=n-2;
    if(n===2&&syl[0].vow==="e"&&syl[0].len<=2&&syl[1].vow!=="e")st=1;
  }
  return syl.map((s,k)=>k===st?s.txt.toUpperCase():s.txt).join("-");
}
function phon(text){
  return text.split(/\s+/).map(p=>p.split("-").map(phonWord).filter(Boolean).join(" ")).filter(Boolean).join(" ");
}

/* ---------- Daten aufbauen ---------- */
const UNITS=[];
function U(o){UNITS.push(o);}
function ADD(id,list){const u=UNITS.find(x=>x.id===id);if(!u){console.warn("ADD: "+id);return;}const have=new Set(u.vocab.map(v=>v[0]));list.forEach(v=>{if(!have.has(v[0]))u.vocab.push(v);});}

/* ===== Stufe A1 ===== */
U({id:"a1-01",lvl:"A1",e:"👋",t:"Begrüßung & Höflichkeit",
 intro:"Die ersten Sätze, die du in Indonesien wirklich brauchst: Grüßen, Danken, Entschuldigen. Wer diese Formeln locker beherrscht, macht sofort einen guten Eindruck.",
 grammar:{t:"Keine Artikel, keine Beugung – und Grüße nach Tageszeit",html:`
<p>Indonesisch ist für Deutschsprachige angenehm einfach: Es gibt <b>keine Artikel</b> (der/die/das), <b>keine Verbkonjugation</b> (<i>saya makan, dia makan</i>) und <b>keine Verbzeiten</b>. Die Zeit zeigt man mit Hilfswörtern wie <i>sudah</i> (schon), <i>sedang</i> (gerade) oder <i>akan</i> (werden).</p>
<p>Gegrüßt wird je nach Tageszeit mit <i>Selamat …</i>:</p>
<table class="g"><tr><th>Grußformel</th><th>Zeitraum (ca.)</th></tr>
<tr><td><i>Selamat pagi</i></td><td>Morgen, bis ca. 11 Uhr</td></tr>
<tr><td><i>Selamat siang</i></td><td>Mittag, ca. 11–15 Uhr</td></tr>
<tr><td><i>Selamat sore</i></td><td>Nachmittag, ca. 15–18 Uhr</td></tr>
<tr><td><i>Selamat malam</i></td><td>Abend/Nacht, ab ca. 18 Uhr</td></tr></table>
<p><b>Höflichkeit:</b> Ältere oder Fremde sprichst du mit <i>Bapak</i> / <i>Pak</i> (Herr) und <i>Ibu</i> / <i>Bu</i> (Frau) an: <i>Selamat pagi, Bu.</i> Das wirkt respektvoll und freundlich.</p>`},
 vocab:[["Halo","Hallo"],["Selamat pagi","Guten Morgen"],["Selamat siang","Guten Tag (mittags)"],["Selamat sore","Guten Nachmittag"],["Selamat malam","Guten Abend / Gute Nacht"],["Selamat datang","Willkommen"],["Selamat makan","Guten Appetit"],["Selamat jalan","Gute Reise (zu jemandem, der geht)"],["Selamat tidur","Schlaf gut"],["Selamat ulang tahun","Alles Gute zum Geburtstag"],["Apa kabar?","Wie geht's?"],["Baik","gut"],["Kabar baik","mir geht es gut"],["Terima kasih","Danke"],["Terima kasih banyak","Vielen Dank"],["Sama-sama","Gern geschehen"],["Maaf","Entschuldigung"],["Permisi","Darf ich mal? / Mit Verlaub"],["Tolong","Bitte (um Hilfe)"],["Silakan","Bitte sehr / Bitte schön"],["Boleh","erlaubt / darf / gern"],["Ya","Ja"],["Tidak","Nein / nicht"],["Hati-hati","Pass auf / Gute Fahrt"],["Sampai jumpa","Auf Wiedersehen"],["Sampai nanti","Bis später"],["Sampai ketemu lagi","Bis zum nächsten Mal"]],
 sent:[["Selamat pagi, Bu. Apa kabar?","Guten Morgen, (Frau). Wie geht es Ihnen?"],["Kabar baik, terima kasih. Dan Anda?","Gut, danke. Und Ihnen?"],["Terima kasih banyak atas bantuannya.","Vielen Dank für Ihre Hilfe."],["Maaf, saya terlambat.","Entschuldigung, ich bin zu spät."],["Permisi, boleh saya lewat?","Entschuldigung, darf ich vorbei?"],["Silakan duduk.","Bitte setzen Sie sich."],["Sampai jumpa besok!","Bis morgen!"],["Selamat makan, semuanya!","Guten Appetit zusammen!"],["Tolong bantu saya.","Bitte helfen Sie mir."],["Hati-hati di jalan!","Pass auf dich auf unterwegs!"]],
 dlg:{t:"Am Morgen im Büro",lines:[["A","Selamat pagi, Pak.","Guten Morgen, Herr ..."],["B","Selamat pagi, Bu. Apa kabar?","Guten Morgen. Wie geht es Ihnen?"],["A","Kabar baik, terima kasih. Dan Bapak?","Gut, danke. Und Ihnen?"],["B","Baik juga. Silakan masuk.","Auch gut. Bitte kommen Sie herein."],["A","Terima kasih.","Danke."],["B","Sama-sama.","Gern geschehen."]]},
 ex:[["___ pagi! (Guten Morgen!)","Selamat",["Selamat","Terima","Maaf","Silakan"],"Selamat + Tageszeit ergibt den Gruß."],["„Terima kasih.“ – „___-sama.“","Sama",["Sama","Baik","Tolong","Boleh"],"Sama-sama = Gern geschehen."],["___, saya terlambat. (Entschuldigung, ich bin zu spät.)","Maaf",["Maaf","Silakan","Selamat","Sama-sama"],""],["Selamat ___. (Guten Abend, ab ca. 18 Uhr)","malam",["pagi","siang","sore","malam"],""],["___ duduk. (Bitte setzen Sie sich.)","Silakan",["Silakan","Tolong","Maaf","Hati-hati"],"Silakan bietet etwas an: Bitte sehr."]]

U({id:"a1-02",lvl:"A1",e:"🙋",t:"Sich vorstellen",
 intro:"Name, Herkunft, Wohnort, Sprache: Mit diesen Sätzen führst du dein erstes echtes Gespräch.",
 grammar:{t:"Pronomen und der Satz ohne „sein“",html:`
<table class="g"><tr><th>Indonesisch</th><th>Deutsch</th></tr>
<tr><td><i>saya</i></td><td>ich (neutral/höflich)</td></tr>
<tr><td><i>aku</i></td><td>ich (vertraut, Freunde)</td></tr>
<tr><td><i>kamu</i></td><td>du</td></tr>
<tr><td><i>Anda</i></td><td>Sie (höflich)</td></tr>
<tr><td><i>dia / ia</i></td><td>er / sie / es</td></tr>
<tr><td><i>kami</i></td><td>wir (ohne den Angesprochenen)</td></tr>
<tr><td><i>kita</i></td><td>wir (inklusive Angesprochene)</td></tr>
<tr><td><i>kalian</i></td><td>ihr</td></tr>
<tr><td><i>mereka</i></td><td>sie (Plural)</td></tr></table>
<p><b>Kein „sein“:</b> <i>Saya guru.</i> = Ich (bin) Lehrer. <i>Dia orang Jerman.</i> = Sie ist Deutsche.</p>
<p><b>Besitz</b> steht <i>hinter</i> dem Nomen: <i>nama saya</i> = mein Name, <i>rumah Anda</i> = Ihr Haus. Das Adjektiv steht ebenfalls <i>hinter</i> dem Nomen: <i>rumah besar</i> = großes Haus.</p>
<p><b>kami vs. kita:</b> Sagst du „wir“ zu jemandem, der mitgemeint ist, nimm <i>kita</i>: <i>Mari kita makan!</i> (Lass uns essen!).</p>`},

U({id:"a1-03",lvl:"A1",e:"🔢",t:"Zahlen & Preise",
 intro:"Zahlen sind die Basis für Preise, Uhrzeiten und Alter. Indonesische Zahlen sind sehr regelmäßig – du lernst nur 13 Wörter und baust den Rest.",
 grammar:{t:"Zahlen bauen",html:`
<p>0 <i>nol</i>, 1 <i>satu</i>, 2 <i>dua</i>, 3 <i>tiga</i>, 4 <i>empat</i>, 5 <i>lima</i>, 6 <i>enam</i>, 7 <i>tujuh</i>, 8 <i>delapan</i>, 9 <i>sembilan</i>, 10 <i>sepuluh</i>.</p>
<table class="g"><tr><th>Zahl</th><th>Indonesisch</th><th>Bauregel</th></tr>
<tr><td>11</td><td><i>sebelas</i></td><td>se- + belas</td></tr>
<tr><td>12–19</td><td><i>dua belas, tiga belas …</i></td><td>Zahl + belas</td></tr>
<tr><td>20</td><td><i>dua puluh</i></td><td>Zahl + puluh</td></tr>
<tr><td>21</td><td><i>dua puluh satu</i></td><td>Zehner + Einer</td></tr>
<tr><td>100</td><td><i>seratus</i></td><td>se- + ratus</td></tr>
<tr><td>250</td><td><i>dua ratus lima puluh</i></td><td></td></tr>
<tr><td>1.000</td><td><i>seribu</i></td><td>se- + ribu</td></tr>
<tr><td>15.000</td><td><i>lima belas ribu</i></td><td></td></tr>
<tr><td>1.000.000</td><td><i>sejuta</i></td><td></td></tr></table>
<p><b>Ordnungszahlen:</b> <i>ke-</i> + Zahl: <i>kedua</i> (zweite), <i>ketiga</i> (dritte); „erste“ ist <i>pertama</i>.</p>
<p><b>Zählwörter:</b> Bei Dingen zählt man mit einem Hilfswort: <i>dua orang</i> (2 Personen), <i>tiga buah apel</i> (3 Äpfel), <i>lima ekor ikan</i> (5 Fische), <i>dua gelas teh</i> (2 Gläser Tee). <i>Buah</i> passt für viele Gegenstände.</p>
<p><b>Preise:</b> Rp 15.000 sagt man <i>lima belas ribu rupiah</i>. Im Alltag lässt man oft „rupiah“ weg.</p>`},

U({id:"a1-04",lvl:"A1",e:"🍜",t:"Essen & Trinken",

 grammar:{t:"Wünsche äußern und höflich bestellen",html:`
<ul><li><b>mau</b> = wollen/möchten: <i>Saya mau nasi goreng.</i></li>
<li><b>ingin</b> = möchten (etwas gehobener): <i>Saya ingin memesan kamar.</i></li>
<li><b>minta</b> = um etwas bitten/bekommen: <i>Minta air putih, ya.</i> / <i>Boleh minta menunya?</i></li>
<li><b>pesan</b> = bestellen: <i>Saya mau pesan satu teh.</i></li></ul>
<p><b>Ya am Satzende</b> macht Bitten weicher: <i>Tidak pedas, ya.</i> (Nicht scharf, ja?)</p>
<p><b>Zählwörter mit se-:</b><i>segelas teh</i> (ein Glas Tee), <i>sepiring nasi</i> (ein Teller Reis), <i>semangkuk soto</i> (eine Schüssel Soto). Das Präfix <i>se-</i> bedeutet „ein“.</p>
<p><b>Verstärken:</b> <i>enak sekali</i> / <i>sangat enak</i> = sehr lecker. <i>sekali</i> steht <i>hinter</i> dem Adjektiv, <i>sangat</i> davor.</p>`},

U({id:"a1-07",lvl:"A1",e:"👨‍👩‍👧",t:"Familie & Menschen",
 intro:"Familie, Freunde, Anrede: Familie ist in Indonesien ein Kernthema jedes Gesprächs.",
 grammar:{t:"Anreden, Besitz und Doppelung",html:`
<table class="g"><tr><th>Anrede</th><th>Für wen?</th></tr>
<tr><td><i>Bapak / Pak</i></td><td>Herr, älterer Mann, Vater</td></tr>
<tr><td><i>Ibu / Bu</i></td><td>Frau, ältere Frau, Mutter</td></tr>
<tr><td><i>Mas</i></td><td>jüngerer Mann / älterer Bruder (Java)</td></tr>
<tr><td><i>Mbak</i></td><td>jüngere Frau / ältere Schwester (Java)</td></tr>
<tr><td><i>kakak</i></td><td>älteres Geschwister</td></tr>
<tr><td><i>adik</i></td><td>jüngeres Geschwister</td></tr></table>
<p><b>Doppelung = Mehrzahl oder Vielfalt:</b> <i>anak</i> (Kind) → <i>anak-anak</i> (Kinder). <i>teman-teman</i> (Freunde). Nach Zahlen braucht man sie nicht: <i>dua anak</i>.</p>
<p><b>Haben:</b> <i>punya</i> (besitzen) oder <i>ada</i> (es gibt/es ist vorhanden): <i>Saya punya dua kakak.</i> / <i>Ada tiga orang di rumah.</i></p>
<p><b>Verkürzter Besitz:</b> <i>-ku</i> (mein), <i>-mu</i> (dein), <i>-nya</i> (sein/ihr): <i>rumahku</i>, <i>rumahmu</i>, <i>rumahnya</i>.</p>`},

U({id:"a1-08",lvl:"A1",e:"🛍️",t:"Einkaufen, Farben & Feilschen",
 intro:"Märkte, Läden, Preise verhandeln. Handeln gehört in Indonesien zum Alltag – freundlich und mit Humor.",
 grammar:{t:"Demonstrativa, Adjektive und Steigerungswörter",html:`
<p><b>ini</b> = dieser/diese/dieses/hier, <b>itu</b> = jener/dort. Sie stehen <i>hinter</i> dem Nomen: <i>tas ini</i> (diese Tasche), <i>baju itu</i> (jenes Hemd).</p>
<p><b>Adjektive</b> stehen hinter dem Nomen: <i>baju merah</i> (rotes Hemd), <i>tas besar</i> (große Tasche).</p>
<p><b>yang</b> verbindet und hebt hervor: <i>yang ini</i> = dieses hier, <i>yang biru</i> = das blaue, <i>yang lebih murah</i> = das günstigere.</p>
<p><b>Verstärker:</b> <i>sangat mahal</i>, <i>mahal sekali</i> (sehr teuer), <i>terlalu mahal</i> (zu teuer), <i>agak mahal</i> (ziemlich/etwas teuer), <i>cukup</i> (genug/ziemlich).</p>
<p><b>Verhandeln:</b> <i>Bisa kurang?</i> (Geht’s günstiger?), <i>Harga pas</i> (Festpreis), <i>Saya ambil</i> (Ich nehme es).</p>`},

U({id:"a1-09",lvl:"A1",e:"🏠",t:"Haus & Alltagsverben",
 intro:"Zimmer, Möbel und die wichtigsten Alltagsverben. Hier lernst du auch, wie Zeit durch Hilfswörter entsteht.",
 grammar:{t:"Zeit ohne Verbformen: sudah, sedang, akan",html:`
<p>Verben ändern sich nie. Die Zeit wird durch Hilfswörter angezeigt:</p>
<table class="g"><tr><th>Wort</th><th>Bedeutung</th><th>Beispiel</th></tr>
<tr><td><i>sudah</i></td><td>schon / bereits (abgeschlossen)</td><td><i>Saya sudah makan.</i></td></tr>

<tr><td><i>akan</i></td><td>werden (Zukunft)</td><td><i>Saya akan makan.</i></td></tr></table>
<p><b>Tipp:</b> Aus dem Kontext (<i>kemarin</i>, <i>besok</i>) ist die Zeit oft klar, dann lässt man das Hilfswort weg: <i>Kemarin saya makan nasi.</i></p>
<p><b>Verben mit me-:</b> Viele Verben haben ein Präfix <i>me-</i> (<i>memasak</i>, <i>membaca</i>). Im Alltag lässt man es oft weg (<i>masak</i>, <i>baca</i>). Das lernst du genau in Stufe B1.</p>`},

U({id:"a1-10",lvl:"A1",e:"🌴",t:"Wetter, Natur & Tiere",
 intro:"Über das Wetter reden ist überall Smalltalk. Und Indonesien hat eine unglaubliche Natur.",
 grammar:{t:"Fragen & Zustandsbeschreibung",html:`
<p>Wetter beschreibt man ohne „es“: <i>Hujan.</i> (Es regnet.) <i>Panas sekali.</i> (Es ist sehr heiß.) <i>Cuacanya cerah.</i> (Das Wetter ist klar.)</p>
<p><b>Fragen mit bagaimana:</b> <i>Bagaimana cuaca hari ini?</i> (Wie ist das Wetter heute?)</p>
<p><b>Das Suffix -nya</b> funktioniert wie ein bestimmter Artikel: <i>cuaca</i> (Wetter) → <i>cuacanya</i> (das Wetter), <i>pintu</i> → <i>pintunya</i> (die Tür).</p>
<p><b>Jahreszeiten:</b> Indonesien kennt nur zwei: <i>musim hujan</i> (Regenzeit, ca. Okt–Apr) und <i>musim kemarau</i> (Trockenzeit, ca. Mai–Sep).</p>`},

U({id:"a2-11",lvl:"A2",e:"⏰",t:"Tagesablauf & Gewohnheiten",
 intro:"Beschreibe deinen Tag: Aufstehen, Arbeit, Freizeit. Dazu lernst du Häufigkeitswörter und das wichtige Präfix ber-.",
 grammar:{t:"Das Präfix ber- und Häufigkeitswörter",html:`
<p><b>ber-</b> bildet Verben aus Nomen oder Wurzeln, die oft „haben / tun / sich verhalten“ bedeuten:</p>
<table class="g"><tr><th>Wurzel</th><th>Verb</th><th>Bedeutung</th></tr>
<tr><td><i>kerja</i></td><td><i>bekerja</i></td><td>arbeiten</td></tr>
<tr><td><i>jalan</i></td><td><i>berjalan</i></td><td>gehen</td></tr>
<tr><td><i>main</i></td><td><i>bermain</i></td><td>spielen</td></tr>
<tr><td><i>belanja</i></td><td><i>berbelanja</i></td><td>einkaufen</td></tr>
<tr><td><i>olahraga</i></td><td><i>berolahraga</i></td><td>Sport treiben</td></tr>
<tr><td><i>sepeda</i></td><td><i>bersepeda</i></td><td>Fahrrad fahren</td></tr>
<tr><td><i>renang</i></td><td><i>berenang</i></td><td>schwimmen</td></tr></table>
<p>Vor <i>r</i> und manchen Wörtern wird ber- zu <i>be-</i> (<i>bekerja</i>, <i>belajar</i> aus <i>ber+ajar</i>, <i>beternak</i>).</p>
<p><b>Häufigkeit</b> (von immer bis nie): <i>selalu</i> › <i>sering</i> › <i>biasanya</i> › <i>kadang-kadang</i> › <i>jarang</i> › <i>tidak pernah</i>. Sie stehen vor dem Verb: <i>Saya sering berenang.</i></p>

U({id:"a2-12",lvl:"A2",e:"❓",t:"Fragen & Verneinung",
 intro:"Fragen stellen und richtig verneinen – zwei Fähigkeiten, ohne die kein Gespräch gelingt. Indonesisch hat vier Verneinungen.",
 grammar:{t:"tidak, bukan, belum, jangan – und alle Fragewörter",html:`
<table class="g"><tr><th>Wort</th><th>Wann?</th><th>Beispiel</th></tr>
<tr><td><b>tidak</b></td><td>Verben & Adjektive</td><td><i>Saya tidak mau.</i> / <i>Tidak pedas.</i></td></tr>
<tr><td><b>bukan</b></td><td>Nomen & Pronomen (= kein, nicht)</td><td><i>Dia bukan guru.</i></td></tr>
<tr><td><b>belum</b></td><td>noch nicht</td><td><i>Saya belum makan.</i></td></tr>
<tr><td><b>jangan</b></td><td>Verbot / „nicht tun!“</td><td><i>Jangan lupa!</i></td></tr>
<tr><td><b>tanpa</b></td><td>ohne</td><td><i>kopi tanpa gula</i></td></tr></table>
<p><b>Fragewörter:</b> <i>apa</i> (was), <i>siapa</i> (wer), <i>kapan</i> (wann), <i>di mana</i> (wo), <i>ke mana</i> (wohin), <i>dari mana</i> (woher), <i>mengapa/kenapa</i> (warum), <i>bagaimana</i> (wie), <i>berapa</i> (wie viel), <i>yang mana</i> (welche/r), <i>berapa lama</i> (wie lange).</p>
<p><b>Ja/Nein-Fragen:</b> Mit <i>apakah</i> am Anfang (formell) oder einfach durch Intonation. <i>Anda mau kopi?</i> (Möchten Sie Kaffee?) Antwort: <i>Mau.</i> / <i>Tidak.</i> – man wiederholt das Verb statt „ja“.</p>

<p><b>Modale Verben:</b> <i>harus</i> (müssen), <i>perlu</i> (brauchen/nötig), <i>boleh</i> (dürfen), <i>bisa</i> (können), <i>mau</i> (wollen). Alle stehen <i>vor</i> dem Verb und ändern sich nie: <i>Saya harus istirahat.</i></p>
<p><b>Gute Besserung:</b> <i>Cepat sembuh!</i> / <i>Semoga lekas sembuh!</i></p>`},

U({id:"b1-19",lvl:"B1",e:"🔧",t:"Aktiv-Verben mit me-",
 intro:"Das Präfix me- (meN-) ist das Herz der formellen Sprache: Bücher, Nachrichten, Reden. Wer die Regeln beherrscht, versteht und spricht auf einem ganz neuen Niveau.",
 grammar:{t:"Die meN-Regeln (Lautanpassung)",html:`
<p>Die Wurzel (<i>baca</i>) wird mit <b>meN-</b> zum aktiven, formellen Verb (<i>membaca</i>). Die Endung des Präfixes passt sich dem ersten Buchstaben der Wurzel an:</p>
<table class="g"><tr><th>Wurzel beginnt mit</th><th>Präfix</th><th>Beispiele</th></tr>
<tr><td>l, m, n, r, w, y</td><td><b>me-</b></td><td><i>lihat → melihat</i>, <i>masak → memasak</i>, <i>nanti → menanti</i></td></tr>
<tr><td>b, f, v</td><td><b>mem-</b></td><td><i>baca → membaca</i>, <i>beli → membeli</i>, <i>bawa → membawa</i></td></tr>
<tr><td>p</td><td><b>mem-</b> (p fällt weg)</td><td><i>pakai → memakai</i>, <i>pilih → memilih</i></td></tr>
<tr><td>d, c, j, z</td><td><b>men-</b></td><td><i>dengar → mendengar</i>, <i>cari → mencari</i>, <i>jual → menjual</i></td></tr>
<tr><td>t</td><td><b>men-</b> (t fällt weg)</td><td><i>tulis → menulis</i>, <i>tutup → menutup</i>, <i>tunggu → menunggu</i></td></tr>
<tr><td>g, h, kh, Vokal</td><td><b>meng-</b></td><td><i>ambil → mengambil</i>, <i>ajar → mengajar</i>, <i>hitung → menghitung</i></td></tr>
<tr><td>k</td><td><b>meng-</b> (k fällt weg)</td><td><i>kirim → mengirim</i>, <i>kerja → mengerjakan</i></td></tr>
<tr><td>s</td><td><b>meny-</b> (s fällt weg)</td><td><i>sapu → menyapu</i>, <i>sewa → menyewa</i></td></tr>
<tr><td>einsilbig</td><td><b>menge-</b></td><td><i>cat → mengecat</i>, <i>bom → mengebom</i></td></tr></table>
<p><b>Wichtig:</b> Im Alltag lässt man me- oft weg: <i>Saya baca buku</i> statt <i>Saya membaca buku</i>. In Texten, Nachrichten und formellen Gesprächen bleibt es.</p>
<p>Verben mit <i>ber-</i> (<i>bekerja</i>, <i>belajar</i>) bekommen kein me-. Verben, die schon ein Objekt brauchen, sind meist me-Verben (<i>membaca buku</i>); intransitive (<i>berjalan</i>, <i>datang</i>, <i>pergi</i>) nicht.</p>`},
 vocab:[["membaca","lesen (baca)"],["menulis","schreiben (tulis)"],["membeli","kaufen (beli)"],["menjual","verkaufen (jual)"],["mengambil","nehmen (ambil)"],["mengirim","senden (kirim)"],["mencari","suchen (cari)"],["melihat","sehen (lihat)"],["mendengar","hören (dengar)"],["meminta","bitten (minta)"],["memakai","benutzen / anziehen (pakai)"],["memilih","wählen (pilih)"],["mengajar","unterrichten (ajar)"],["membantu","helfen (bantu)"],["membawa","tragen / mitbringen (bawa)"],["membuka","öffnen (buka)"],["menutup","schließen (tutup)"],["menunggu","warten (tunggu)"],["menjawab","antworten (jawab)"],["mengingat","sich erinnern (ingat)"],["membuat","machen (buat)"],["memasak","kochen (masak)"],["menyapu","fegen (sapu)"],["menyewa","mieten (sewa)"],["mengubah","verändern (ubah)"],["menggunakan","benutzen (guna)"],["menemukan","finden (temu)"],["menyukai","mögen (suka)"],["mengatakan","sagen (kata)"],["menjelaskan","erklären (jelas)"],["mengerti","verstehen (erti)"],["menyelesaikan","beenden (selesai)"],["mengunjungi","besuchen (kunjung)"]],

U({id:"b1-20",lvl:"B1",e:"🔁",t:"Passiv & ter-/ke-an",
 intro:"Indonesisch liebt das Passiv – besonders in Nachrichten und Schildern. Du lernst di-, das Objektpassiv und ter-/ke-an.",
 grammar:{t:"di-Passiv, Objektpassiv und ter-",html:`
<p><b>1. di-Passiv:</b> di- + Wurzel, Handelnder mit <i>oleh</i> (von): <br><i>Surat itu ditulis oleh Ibu.</i> (Der Brief wurde von Mutter geschrieben.)<br>Aktiv: <i>Ibu menulis surat itu.</i></p>
<p><b>2. Objektpassiv (Pronomen + Wurzel):</b> bei Pronomen als Handelndem steht das Objekt vorne, das Verb ohne Präfix: <br><i>Buku itu saya baca.</i> (Das Buch habe ich gelesen / wurde von mir gelesen.)<br><i>Surat itu kamu tulis.</i> – <i>Rumah itu dia jual.</i></p>
<p><b>3. ter-</b> hat drei Hauptbedeutungen:</p>
<ul><li><b>Zustand/Resultat:</b> <i>terbuka</i> (offen), <i>tertutup</i> (geschlossen), <i>terlambat</i> (verspätet)</li>
<li><b>Unabsichtlich:</b> <i>tertidur</i> (eingeschlafen), <i>terjatuh</i> (hingefallen)</li>
<li><b>Superlativ:</b> <i>terbesar</i> (größte), <i>tertinggi</i> (höchste), <i>termurah</i> (billigste)</li></ul>
<p><b>4. ke-an (Widerfahrnis):</b> <i>kehujanan</i> (vom Regen überrascht), <i>kecurian</i> (bestohlen), <i>kehilangan</i> (etwas verlieren), <i>kebanjiran</i> (überflutet).</p>
<p><b>Schilder:</b> <i>Dilarang merokok</i> (Rauchen verboten), <i>Dijual</i> (zu verkaufen), <i>Dibuka</i> (geöffnet), <i>Ditutup</i> (geschlossen).</p>`},

U({id:"b1-21",lvl:"B1",e:"🧩",t:"Wortbildung: -kan, -i, pe-, -an, ke-an",
 intro:"Aus einer Wurzel entstehen im Indonesischen viele Wörter. Wer die Bausteine kennt, versteht neue Wörter sofort.",
 grammar:{t:"Die wichtigsten Affixe",html:`
<table class="g"><tr><th>Affix</th><th>Funktion</th><th>Beispiel</th></tr>
<tr><td><b>-kan</b></td><td>veranlassen / für jemanden tun</td><td><i>membuka</i> → <i>membukakan</i> (für jmd. öffnen), <i>menyelesaikan</i> (beenden)</td></tr>
<tr><td><b>-i</b></td><td>Ort/Ziel, Wiederholung</td><td><i>mengunjungi</i> (besuchen), <i>menyukai</i> (mögen), <i>memasuki</i> (betreten)</td></tr>
<tr><td><b>pe-</b></td><td>Person / Gerät, die etwas tut</td><td><i>penulis</i> (Autor), <i>pembaca</i> (Leser), <i>pemain</i> (Spieler), <i>penjual</i> (Verkäufer), <i>pembeli</i> (Käufer)</td></tr>
<tr><td><b>pe-…-an</b></td><td>Vorgang / Ergebnis</td><td><i>pendidikan</i> (Bildung), <i>pengalaman</i> (Erfahrung), <i>pembicaraan</i> (Gespräch)</td></tr>
<tr><td><b>per-…-an</b></td><td>Vorgang / Bereich</td><td><i>perjalanan</i> (Reise), <i>pertemuan</i> (Treffen), <i>perusahaan</i> (Firma)</td></tr>
<tr><td><b>ke-…-an</b></td><td>abstrakte Eigenschaft</td><td><i>kesehatan</i> (Gesundheit), <i>kebersihan</i> (Sauberkeit), <i>kebahagiaan</i> (Glück)</td></tr>
<tr><td><b>-an</b></td><td>Ergebnis / Ding</td><td><i>makanan</i> (Essen), <i>minuman</i> (Getränk), <i>tulisan</i> (Text)</td></tr></table>
<p>Dieselben Lautregeln wie bei meN- gelten bei <b>peN-</b>: <i>baca → pembaca</i>, <i>tulis → penulis</i>, <i>kirim → pengirim</i>, <i>jual → penjual</i>, <i>sapu → penyapu</i>.</p>
<p><b>Tipp:</b> Lerne Wörter als Familien: <i>ajar</i> → <i>belajar</i> (lernen), <i>mengajar</i> (unterrichten), <i>pelajar</i> (Schüler), <i>pengajar</i> (Lehrer), <i>pelajaran</i> (Unterricht), <i>pengajaran</i> (Lehre).</p>`},

U({id:"b1-22",lvl:"B1",e:"🔗",t:"Konnektoren & Nebensätze",
 intro:"Jetzt wird aus Einzelsätzen echtes Sprechen: Gründe geben, Gegensätze, Bedingungen, Zeitfolgen. Die Konnektoren sind der Schlüssel zu Flüssigkeit.",
 grammar:{t:"Satzverbindungen",html:`
<table class="g"><tr><th>Funktion</th><th>Wörter</th><th>Beispiel</th></tr>
<tr><td>Grund</td><td><i>karena, sebab</i></td><td><i>Saya pulang karena lelah.</i></td></tr>
<tr><td>Folge</td><td><i>jadi, sehingga, makanya</i></td><td><i>Macet, jadi saya terlambat.</i></td></tr>
<tr><td>Gegensatz</td><td><i>tetapi / tapi, namun, sedangkan</i></td><td><i>Mahal, tetapi bagus.</i></td></tr>
<tr><td>Einräumung</td><td><i>meskipun, walaupun</i></td><td><i>Meskipun hujan, kami pergi.</i></td></tr>
<tr><td>Bedingung</td><td><i>kalau, jika, apabila</i></td><td><i>Kalau cerah, kita berenang.</i></td></tr>
<tr><td>Zeit</td><td><i>ketika, saat, sambil, sebelum, setelah / sesudah, sampai</i></td><td><i>Ketika kecil, saya tinggal di desa.</i></td></tr>
<tr><td>Zweck</td><td><i>supaya, agar, untuk</i></td><td><i>Saya belajar supaya lancar.</i></td></tr>
<tr><td>Inhaltssatz</td><td><i>bahwa</i></td><td><i>Dia berkata bahwa dia sibuk.</i></td></tr>
<tr><td>Relativsatz</td><td><i>yang</i></td><td><i>Orang yang tinggal di sebelah ramah.</i></td></tr></table>
<p><b>yang</b> ist vielseitig: <i>yang</i> + Adjektiv/Verb ersetzt „der/die/das, welche(r)“: <i>buku yang saya baca</i> (das Buch, das ich lese), <i>orang yang datang</i> (der Mensch, der kommt).</p>
<p><b>Wortstellung bleibt SVO</b> und der Nebensatz kann vor oder hinter dem Hauptsatz stehen. Kein Verb wandert ans Satzende – das macht lange Sätze leicht.</p>`},

U({id:"b1-23",lvl:"B1",e:"💬",t:"Meinungen & Diskussion",
 intro:"Zustimmen, widersprechen, abwägen, Vorschläge machen: so diskutierst du auf Indonesisch höflich und überzeugend.",
 grammar:{t:"Meinung, Modalverben und Höflichkeit",html:`
<table class="g"><tr><th>Funktion</th><th>Ausdrücke</th></tr>
<tr><td>Meinung</td><td><i>menurut saya</i> (meiner Meinung nach), <i>saya pikir</i>, <i>saya rasa</i>, <i>pendapat saya</i></td></tr>
<tr><td>Zustimmung</td><td><i>setuju</i>, <i>benar</i>, <i>betul</i>, <i>saya sependapat</i></td></tr>
<tr><td>Widerspruch</td><td><i>tidak setuju</i>, <i>kurang setuju</i> (höflich: „weniger einverstanden“), <i>saya tidak sependapat</i></td></tr>
<tr><td>Vermutung</td><td><i>mungkin</i>, <i>barangkali</i>, <i>sepertinya</i>, <i>pasti</i></td></tr>
<tr><td>Sollen / Müssen</td><td><i>sebaiknya</i> (am besten/sollte), <i>seharusnya</i> (müsste), <i>harus</i>, <i>wajib</i></td></tr>

<p><b>Höflich widersprechen:</b> <i>Saya kurang setuju, karena …</i> oder <i>Memang benar, tetapi …</i> (Das stimmt zwar, aber …). Direktes <i>tidak setuju</i> wirkt hart.</p>
<p><b>Argumente ordnen:</b> <i>Pertama, …</i> <i>Kedua, …</i> <i>Selain itu, …</i> (außerdem) <i>Namun, …</i> (jedoch) <i>Kesimpulannya, …</i> (Fazit)</p>`},

U({id:"b1-24",lvl:"B1",e:"🎎",t:"Kultur, Höflichkeit & Indonesien",
 intro:"Sprache und Kultur gehören zusammen. Wer Gesten, Feiertage und Werte kennt, wirkt in Indonesien sofort sympathisch.",
 grammar:{t:"Kleine Kulturkunde für Gespräche",html:`
<ul>
<li><b>Rechte Hand:</b> Gib und nimm Dinge mit der rechten Hand (oder beiden). Die linke gilt als unrein.</li>
<li><b>Schuhe aus:</b> Vor dem Betreten von Häusern und Moscheen: <i>lepas sepatu</i>.</li>
<li><b>Anrede:</b> Verwende <i>Bapak/Ibu</i> bei Älteren, <i>Mas/Mbak</i> bei Gleichaltrigen. Namen ohne Anrede wirken direkt.</li>
<li><b>Jam karet</b> („Gummizeit“): Pünktlichkeit ist locker. Ein Treffen kann später starten.</li>
<li><b>Basa-basi:</b> Höflicher Smalltalk, bevor man zum Punkt kommt. Fragen wie <i>Mau ke mana?</i> (Wohin des Weges?) sind Gesprächseinstieg, keine Neugier.</li>
<li><b>Nein sagen:</b> Direkt Nein klingt hart. Besser: <i>Nanti saya pikirkan dulu.</i> (Ich überlege es mir.)</li>
<li><b>Gotong royong:</b> gegenseitige Hilfe in der Gemeinschaft – ein Kernwert.</li>
<li><b>Mudik:</b> Die große Heimreise zu Lebaran (Idul Fitri) – Millionen reisen ins <i>kampung halaman</i>.</li></ul>
<p><b>Bahasa Indonesia</b> ist seit 1928 (Sumpah Pemuda) die Sprache der Einheit (<i>bahasa persatuan</i>). Daneben gibt es Hunderte Regionalsprachen (<i>bahasa daerah</i>): Javanisch, Sundanesisch, Balinesisch u. a.</p>`},

U({id:"b1-25",lvl:"B1",e:"😎",t:"Umgangssprache (Bahasa gaul)",
 intro:"Im echten Alltag sprechen Indonesier ganz anders als im Lehrbuch. Hier lernst du die häufigsten Abkürzungen und Partikeln, damit du Freunde und Filme verstehst.",
 grammar:{t:"Umgangssprache entschlüsselt",html:`
<table class="g"><tr><th>Umgangssprache</th><th>Standard</th><th>Bedeutung</th></tr>
<tr><td><i>nggak / gak / enggak</i></td><td><i>tidak</i></td><td>nicht / nein</td></tr>
<tr><td><i>udah</i></td><td><i>sudah</i></td><td>schon</td></tr>
<tr><td><i>banget</i></td><td><i>sekali</i></td><td>sehr</td></tr>
<tr><td><i>aja</i></td><td><i>saja</i></td><td>nur / einfach</td></tr>
<tr><td><i>gimana</i></td><td><i>bagaimana</i></td><td>wie</td></tr>
<tr><td><i>kenapa</i></td><td><i>mengapa</i></td><td>warum</td></tr>
<tr><td><i>bikin</i></td><td><i>membuat</i></td><td>machen</td></tr>
<tr><td><i>ngomong</i>, <i>nanya</i>, <i>ngobrol</i></td><td><i>berbicara, bertanya, bercakap</i></td><td>sprechen, fragen, plaudern</td></tr>
<tr><td><i>lagi + Verb</i></td><td><i>sedang</i></td><td>gerade dabei</td></tr>
<tr><td><i>gue / lo</i></td><td><i>aku / kamu</i></td><td>ich / du (Jakarta-Slang)</td></tr></table>
<p><b>Partikeln</b> geben dem Satz Gefühl:</p>
<ul><li><i>dong</i> – freundliche Bitte / Selbstverständlichkeit: <i>Ayo dong!</i></li>
<li><i>sih</i> – betont Fragen („denn eigentlich“): <i>Kenapa sih?</i></li>
<li><i>deh</i> – „na gut / dann halt“: <i>Ya udah deh.</i></li>
<li><i>kok</i> – Überraschung: <i>Kok bisa?</i> (Wie kann das sein?)</li>
<li><i>lho</i> – „Oh!“/„Mensch!“: <i>Lho, kamu di sini?</i></li>
<li><i>kan</i> – „doch / nicht wahr“: <i>Kamu udah tahu, kan?</i></li></ul>

<p><b>Zitieren</b> mit <i>menurut</i> (laut), <i>kata</i> (sagte), <i>mengatakan bahwa</i> (sagte, dass), <i>menyatakan</i> (erklärte), <i>mengungkapkan</i> (enthüllte).</p>
<p><b>Verkürzte Schlagzeilen:</b> Verben ohne Hilfswort, Artikel fehlen: <i>Harga BBM Naik</i> (Benzinpreis steigt).</p>`},

U({id:"b2-27",lvl:"B2",e:"💼",t:"Beruf, Karriere & formelle E-Mails",
 intro:"Im Berufsleben braucht man Höflichkeit, klare Struktur und die richtigen Floskeln. Hier lernst du Bewerbung, Besprechung und formelle Korrespondenz.",

<p><b>Anrede:</b> <i>Yth. Bapak/Ibu …</i> (Yth. = Yang terhormat, „Sehr geehrte/r“). <b>Schluss:</b> <i>Hormat saya,</i> / <i>Salam hormat,</i> (Mit freundlichen Grüßen).</p>
<table class="g"><tr><th>Floskel</th><th>Bedeutung</th></tr>
<tr><td><i>Dengan hormat,</i></td><td>Sehr geehrte Damen und Herren</td></tr>
<tr><td><i>Bersama ini saya mengajukan lamaran …</i></td><td>Hiermit bewerbe ich mich …</td></tr>
<tr><td><i>Terlampir adalah …</i></td><td>Anbei finden Sie …</td></tr>
<tr><td><i>Atas perhatian Bapak/Ibu, saya ucapkan terima kasih.</i></td><td>Vielen Dank für Ihre Aufmerksamkeit.</td></tr>
<tr><td><i>Mohon konfirmasi.</i></td><td>Bitte bestätigen Sie.</td></tr></table>
<p><b>Mohon</b> + Verb = formelle Bitte: <i>Mohon dikirim sebelum Jumat.</i></p>`},

U({id:"b2-29",lvl:"B2",e:"🧱",t:"Relativsätze mit yang & Nominalisierung",
 intro:"Mit yang baust du lange, elegante Sätze. Mit Nominalisierung (pe-an, ke-an) klingst du schriftsprachlich und präzise.",
 grammar:{t:"yang, dimana-Vermeidung & Nominalisierung",html:`
<p><b>yang</b> = der/die/das (Relativpronomen), für Personen und Dinge:</p>
<ul><li><i>Buku yang saya baca sangat bagus.</i> – Das Buch, das ich lese, ist sehr gut.</li>
<li><i>Orang yang berdiri di sana adalah guru saya.</i></li>
<li><i>Rumah yang besar itu milik kakek saya.</i></li></ul>
<p>Ein Adjektiv mit <i>yang</i> kann allein stehen: <i>Saya mau yang merah.</i> (Ich will den roten.)</p>
<p><b>Nominalisierung:</b> <i>pe-an</i> (Vorgang), <i>ke-an</i> (Zustand): <i>belajar → pembelajaran</i>, <i>bersih → kebersihan</i>, <i>adil → keadilan</i>, <i>putus → keputusan</i>.</p>
<p><b>Vermeide „dimana“ als Relativpronomen</b> (englischer Einfluss): <i>Kota tempat saya lahir …</i> (die Stadt, in der ich geboren wurde) – mit <b>tempat</b>.</p>`},

  quick:`<details class="card tip" open><summary>⚡ Die 10 wichtigsten Regeln auf einen Blick</summary><ol>
   <li><b>Keine Artikel, keine Beugung:</b> <i>Saya makan, dia makan.</i></li>
   <li><b>Satz = Subjekt – Verb – Objekt:</b> <i>Saya membaca buku.</i></li>
   <li><b>Nomen vor Adjektiv, Besitzer hinter dem Nomen:</b> <i>rumah besar saya</i> (mein großes Haus).</li>
   <li><b>Zeit durch Wörter:</b> <i>sudah</i> (schon), <i>belum</i> (noch nicht), <i>sedang</i> (gerade), <i>akan</i> (werden).</li>
   <li><b>Vier Verneinungen:</b> <i>tidak</i> (Verb/Adj.), <i>bukan</i> (Nomen), <i>belum</i> (noch nicht), <i>jangan</i> (Verbot).</li>
   <li><b>Fragewörter bleiben vorn oder hinten:</b> <i>Siapa nama Anda?</i> / <i>Anda dari mana?</i></li>
   <li><b>di / ke / dari:</b> Ort / Richtung / Herkunft.</li>
   <li><b>Mehrzahl durch Doppelung</b> (nur bei Bedarf): <i>anak-anak</i>; nach Zahlen nicht: <i>dua anak</i>.</li>
   <li><b>Zählwörter:</b> <i>dua orang, tiga buah, lima ekor</i>.</li>
   <li><b>Präfixe me-, ber-, di-, ter-, pe-:</b> ändern Rolle und Bedeutung – das Wortbildungssystem ist dein Hebel für großen Wortschatz.</li></ol></details>`,

function buildCards(free){
  const kinds=S.ckinds.split(""),pool=itemsIn(V.scope,kinds),now=Date.now();
  let q=[],isFree=!!free;
  if(!free){
    const rev=pool.filter(x=>S.due[x.id]&&S.due[x.id]<=now);
    const left=Math.max(0,S.newPerDay-D().newc);
    const nw=pool.filter(x=>!S.due[x.id]&&!S.box[x.id]).slice(0,left);
    const uo={};UNITS.forEach((u,i)=>uo[u.id]=i);
    nw.sort((a,b)=>(uo[a.u]-uo[b.u])||((a.k==="v"?0:1)-(b.k==="v"?0:1)));   // Reihenfolge: Lektion → Vokabeln → Sätze

function rateCard(r){
  const c=V.cards,id=c.q[c.i],isNew=!S.box[id];let b=S.box[id]||0;const days=[0,1,2,4,8,16,32];
  if(isNew)D().newc++;
  if(r===0){b=1;S.due[id]=Date.now()+10*60000;if(!c.again[id]){c.again[id]=1;c.q.push(id);}}
  else if(r===1){b=Math.max(1,b);S.due[id]=Date.now()+864e5;}
  else{b=Math.min(6,b+1);S.due[id]=Date.now()+days[b]*864e5;c.right++;}
  S.box[id]=b;D().cards++;S.totalCards=(S.totalCards||0)+1;
  addXp(r===2?3:r===1?2:1);

}

const EXT=[["mix","Gemischt"],["gram","Grammatik: Wörter einsetzen"],["cloze","Lückentext (Grammatik)"],["build","Satzbau"],["trans","Übersetzen"],["hear","Hörverstehen"],["vocab","Vokabel-Quiz"]];

const GCATS=CFG.gcats;
function gramPool(scope){
  const L=[];
  unitsIn(scope).forEach(u=>{
    (u.sent||[]).forEach(v=>L.push(v));
    ((u.dlg&&u.dlg.lines)||[]).forEach(l=>L.push([l[1],l[2]]));
  });
  const out=[];
  L.forEach(v=>{
    const toks=v[0].replace(/[.,!?]/g,"").split(" ");
    GCATS.forEach((c,ci)=>{
      toks.forEach((w,wi)=>{
        const lw=w.toLowerCase();
        const hit=c[1].find(x=>x.toLowerCase()===lw);
        if(hit&&!(c[0]==="Pronomen"&&wi>0&&false))out.push({idn:v[0],de:v[1],ci,wi,ans:hit,w});
      });
    });
  });
  return out;
}
function genEx(scope,type,n){
  const sents=itemsIn(scope,["s"]),words=itemsIn(scope,["v"]);
  const cl=[];unitsIn(scope).forEach(u=>(u.ex||[]).forEach(c=>cl.push(c)));
  const allS=ITEMS.filter(x=>x.k==="s"),allW=ITEMS.filter(x=>x.k==="v");
  const mk={
   cloze(){const c=pick(cl);return {key:"c"+c[0],t:"cloze",p:c[0],a:c[1],o:shuffle(c[2]),n:c[3]};},
   build(){const it=pick(sents);return {key:"b"+it.id,t:"build",it,pool:shuffle(it.idn.split(" ").map((w,i)=>({w,i}))),ans:[]};},
   trans(){const it=pick(sents.concat(words));return {key:"t"+it.id,t:"trans",it};},
   hear(){const it=pick(sents);const o=shuffle([it,...sample(allS.filter(x=>x.de!==it.de),3)]);return {key:"h"+it.id,t:"hear",it,o};},
   vocab(){const it=pick(words);const dir=Math.random()<.5?"id2de":"de2id";const o=shuffle([it,...sample(allW.filter(x=>x.de!==it.de&&x.idn!==it.idn),3)]);return {key:"v"+it.id+dir,t:"vocab",it,dir,o};}
  };
  const gp=gramPool(scope);
  mk.gram=function(){const g=pick(gp);const c=GCATS[g.ci];const toks=g.idn.replace(/[.,!?]/g,"").split(" ");const raw=g.idn.split(" ");
    const q=raw.map((t,i)=>i===g.wi?"_____":t).join(" ");
    const bl=new Set();(CFG.gsyn||[]).forEach(gr=>{if(gr.includes(g.ans))gr.forEach(x=>bl.add(x));});bl.delete(g.ans);
    let cand=c[1].filter(x=>x!==g.ans&&!bl.has(x));if(cand.length<3)cand=c[1].filter(x=>x!==g.ans);
    const o=shuffle([g.ans,...sample(cand,3)]);
    return {key:"g"+g.idn+g.wi+g.ci,t:"gram",p:q,a:g.ans,o,n:c[0]+": "+c[2],de:g.de,idn:g.idn};};
  const cnt={gram:gp.length,cloze:cl.length,build:sents.length,trans:sents.length+words.length,hear:sents.length,vocab:words.length};
  const avail=Object.keys(mk).filter(k=>cnt[k]>0);
  const types=type==="mix"?avail:avail.filter(k=>k===type);
  const qs=[],seen=new Set();
  for(let i=0;i<n&&types.length;i++){
    for(let tries=0;tries<6;tries++){const q=mk[types[i%types.length]]();if(!seen.has(q.key)){seen.add(q.key);qs.push(q);break;}}
  }
  return shuffle(qs);
}

/* ===================== TUTOR = LEHRER (ohne KI, ohne Internet) ===================== */
/* Der Lehrer führt durch eine Lektion: Basics → Wörter → Sätze → Grammatik → Dialog → Abfrage.
   Er erklärt, spricht vor, lässt nachsprechen (Abgleich), fragt ab, wiederholt Schwaches und beantwortet Fragen. */
V.chat={msgs:[],level:(S.level||"A2"),topic:"tutor",busy:false,err:"",auto:true,goal:null};
const stripG=t=>String(t).split(" – ")[0].trim();
function otUnit(){return UNIT(V.unit||nextUnit().id);}
const TCH_PH=["Basics","Wörter","Sätze","Grammatik","Dialog","Abfrage"];
function tchMark(id,ok){
  if(!id)return;const days=[0,1,2,4,8,16,32];let b=S.box[id]||0;
  if(ok){b=Math.min(6,Math.max(1,b+1));S.due[id]=Date.now()+days[b]*864e5;}
  else{b=1;S.due[id]=Date.now()+10*60000;}
  S.box[id]=b;save();
}
function tchDistract(it,n,field){
  const pool=ITEMS.filter(x=>x.k===it.k&&x.id!==it.id&&x[field]!==it[field]);
  const same=pool.filter(x=>x.u===it.u),rest=pool.filter(x=>x.u!==it.u);
  const out=[];const seen=new Set([norm(it[field])]);
  for(const x of shuffle(same).concat(shuffle(rest))){const k=norm(x[field]);if(!k||seen.has(k))continue;seen.add(k);out.push(x[field]);if(out.length>=n)break;}
  return out;
}
function tchBuild(u){
  const vit=ITEMS.filter(x=>x.u===u.id&&x.k==="v").slice(0,12),sit=ITEMS.filter(x=>x.u===u.id&&x.k==="s").slice(0,6);
  const st=[];
  let g=stripHtml(u.grammar.html);if(g.length>650)g=g.slice(0,650).replace(/\s\S*$/,"")+" …";
  st.push({ph:0,t:"info",text:LT.greet().replace(/[!👋\s]+$/,"").trim()+"! "+LT.tp.start+"\n\nHeute lernen wir Lektion "+u.n+": „"+u.t+"“. Ich führe dich Schritt für Schritt: erst die Basics, dann die Wörter, dann Sätze daraus, eine kurze Übung, ein Dialog und zum Schluss eine Abfrage. Du kannst mich jederzeit etwas fragen.\n\n"+u.intro});
  st.push({ph:0,t:"info",text:"Die Grundlagen – "+u.grammar.t+":\n"+g});
  for(let i=0;i<vit.length;i+=3){
    const blk=vit.slice(i,i+3);
    blk.forEach((it,k)=>st.push({ph:1,t:"rep",it,new:true,hdr:(i===0&&k===0?"Jetzt die Wörter. ":"")+"Neues Wort:"}));
    shuffle(blk).forEach(it=>st.push({ph:1,t:"mc",it,dir:"toNative",mark:true}));
    st.push({ph:1,t:"tr",it:pick(blk),mark:true});
  }
  for(let i=0;i<sit.length;i+=3){
    const blk=sit.slice(i,i+3);
    blk.forEach((it,k)=>st.push({ph:2,t:"rep",it,new:true,hdr:(i===0&&k===0?"Jetzt bauen wir Sätze aus den Wörtern von eben. ":"")+"Neuer Satz:"}));
    st.push({ph:2,t:"mc",it:pick(blk),dir:"toNative",mark:true});
    st.push({ph:2,t:"tr",it:pick(blk),mark:true});
  }
  shuffle((u.ex||[]).slice()).slice(0,4).forEach((c,k)=>st.push({ph:3,t:"cl",p:c[0],a:c[1],o:shuffle(c[2].slice()),n:c[3],hdr:k===0?"Jetzt die Regel in der Praxis – wähle das passende Wort.":""}));
  st.push({ph:4,t:"dlg"});
  st.push({ph:5,t:"final"});
  return st;
}
function otStart(){
  const C=V.chat,u=otUnit();
  C.ot={mode:"teach",u:u.id,steps:tchBuild(u),i:0,tries:0,right:0,n:0,fr:0,fn:0,wrong:{},done:false,dlg:null,quiz:null,last:null,ask:false};
  C.msgs=[];C.err="";tchRun();
}
function tchPrompt(q){
  const o=V.chat.ot;
  if(q.t==="info")return {text:q.text,opts:["Verstanden – weiter ▶"]};
  if(q.t==="rep"){
    const t=stripG(q.it.idn);
    return {text:(q.hdr?q.hdr+" ":"")+(q.new?"Hör zu und sprich nach.":"Sprich noch einmal nach.")+" – "+LT.tp.cmd,goal:t,gl:q.it.de,ph:q.it.ph||"",say:t};
  }
  if(q.t==="mc"){
    if(q.opts0===undefined){q.opts0=shuffle([q.it.de].concat(tchDistract(q.it,2,"de")));}
    return {text:"Was bedeutet: „"+stripG(q.it.idn)+"“?",opts:q.opts0,say:stripG(q.it.idn)};
  }
  if(q.t==="tr")return {text:(q.hdr?q.hdr+" ":"")+"Wie sagt man auf "+CFG.lname+": „"+q.it.de+"“? (sprechen oder schreiben)"};
  if(q.t==="cl")return {text:(q.hdr?q.hdr+" ":"")+"Welches Wort passt? "+q.p,opts:q.o};
  return {text:""};
}
function tchRun(){
  const C=V.chat,o=C.ot;
  if(o.i>=o.steps.length){tchFinish();return;}
  const q=o.steps[o.i];o.cur=q;o.tries=0;
  if(q.t==="final"){tchFinal();return;}
  if(q.t==="dlg"){
    const u=otUnit(),d={L:u.dlg.lines,p:0};o.dlg=d;
    C.msgs.push({role:"assistant",text:"Jetzt alles zusammen – ein Dialog: „"+u.dlg.t+"“. Ich spiele die erste Rolle, du bist Person B. Antworte sinngemäß, ich gleiche mit der Vorlage ab."});
    dlgAdvance(C,d,0);return;
  }
  const p=tchPrompt(q);
  C.msgs.push(Object.assign({role:"assistant",ph:q.ph},p,{ph:p.ph||""}));
  if(p.say)o.last={say:p.say,gl:p.gl||""};
  render();
  if(p.say&&C.auto)speak(p.say,.9);
}
function tchNext(){V.chat.ot.i++;tchRun();}
function tchFinal(){
  const C=V.chat,o=C.ot,u=otUnit();
  const weak=Object.keys(o.wrong).map(id=>IDX[id]).filter(Boolean);
  const unitIts=ITEMS.filter(x=>x.u===u.id);
  let pool=weak.slice(0,5);
  shuffle(unitIts.filter(x=>!pool.includes(x))).slice(0,Math.max(0,8-pool.length-2)).forEach(x=>pool.push(x));
  const old=ITEMS.filter(x=>x.u!==u.id&&(S.box[x.id]||0)>0&&(S.box[x.id]||0)<4);
  shuffle(old).slice(0,2).forEach(x=>pool.push(x));
  const qs=shuffle(pool).map((it,k)=>k%2===0?{ph:5,t:"mc",it,dir:"toNative",mark:true,fin:true}:{ph:5,t:"tr",it,mark:true,fin:true});
  o.steps.splice(o.i,1,...qs);
  C.msgs.push({role:"assistant",text:"Zum Schluss die Abfrage: "+qs.length+" Fragen zu dem, was wir gemacht haben – plus ein paar Wörter von früher. Los geht's!"});
  tchRun();
}
function tchFinish(){
  const C=V.chat,o=C.ot,u=otUnit();o.done=true;
  const weak=Object.keys(o.wrong).map(id=>IDX[id]).filter(Boolean);
  const pct=o.fn?Math.round(100*o.fr/o.fn):100;
  C.msgs.push({role:"assistant",text:LT.tp.end+" 🎉 Abfrage: "+o.fr+" / "+o.fn+" richtig ("+pct+" %). "+(weak.length?"Das solltest du noch üben: "+weak.slice(0,8).map(x=>stripG(x.idn)).join(", ")+". Ich kann diese Wörter jetzt noch einmal mit dir wiederholen.":"Alles sitzt – sehr gut!")+" Deine Wörter sind jetzt in den Karten (Wiederholung nach Plan)."});
  addXp(5+(pct>=80?5:0));save();render();
}
function tchDrill(){
  const C=V.chat,o=C.ot;const weak=Object.keys(o.wrong).map(id=>IDX[id]).filter(Boolean);if(!weak.length)return;
  o.wrong={};o.done=false;
  const st=[];weak.forEach(it=>st.push({ph:5,t:"rep",it,hdr:"Wiederholung:"}));weak.forEach(it=>st.push({ph:5,t:"mc",it,dir:"toNative",mark:true}));
  o.steps=o.steps.slice(0,o.i).concat(st);o.i=o.steps.length-st.length;
  C.msgs.push({role:"assistant",text:"Gut, wir wiederholen die schwachen Stellen."});tchRun();
}
function tchWrong(q){const o=V.chat.ot;if(q.it)o.wrong[q.it.id]=1;}
function tchAnswer(txt,spoken){
  const C=V.chat,o=C.ot,q=o.cur;
  const um={role:"user",text:txt,spoken:!!spoken};C.msgs.push(um);
  if(q.t==="info"){tchNext();return;}
  const isCl=q.t==="cl",isMc=q.t==="mc";
  const target=isCl?q.a:stripG(q.it.idn);
  let ok,ev=null;
  if(isCl)ok=norm(txt)===norm(q.a);
  else if(isMc)ok=norm(txt)===norm(q.it.de);
  else{ev=evaluate(target,[txt]);um.cmp={target,score:ev.score,words:ev.words};ok=ev.score>=85;}
  if(q.fin){}
  if(ok){
    o.n++;o.right++;if(q.fin){o.fn++;o.fr++;}addXp(q.t==="rep"?1:2);
    if(q.it&&(q.mark||q.t==="rep")){if(q.t==="rep"&&!q.new&&false){}tchMark(q.it.id,true);}
    C.msgs.push({role:"assistant",text:pick(LT.tp.ok)+" ✅"+(isCl&&q.n?" "+q.n:"")+(isMc?" „"+stripG(q.it.idn)+"“ = „"+q.it.de+"“":"")});
    o.i++;tchRun();return;
  }
  if(!isCl&&!isMc&&o.tries<1){
    o.tries++;const red=(ev.words||[]).filter(w=>w.s<.85).map(w=>w.w).join(", ");
    C.msgs.push({role:"assistant",text:"Fast – achte auf: "+(red||"…")+". Hör dir das Vorbild an und versuche es noch einmal. – "+LT.tp.again,goal:target});
    render();if(C.auto)speak(target,.7);o.last={say:target,gl:q.it?q.it.de:""};return;
  }
  o.n++;if(q.fin){o.fn++;}tchWrong(q);if(q.it)tchMark(q.it.id,false);
  if(isCl)C.msgs.push({role:"assistant",text:"Nicht ganz – richtig ist: „"+q.a+"“. "+(q.n||"")});
  else if(isMc)C.msgs.push({role:"assistant",text:"Nicht ganz – „"+stripG(q.it.idn)+"“ bedeutet „"+q.it.de+"“.",say:stripG(q.it.idn),gl:q.it.de});
  else C.msgs.push({role:"assistant",text:"Kein Problem – so heißt es richtig:",goal:target});
  o.last={say:target,gl:q.it?q.it.de:""};

/* Fragen an den Lehrer mitten in der Lektion */
function tchQuestion(txt,spoken){
  const C=V.chat,o=C.ot;miniBuild();
  const um={role:"user",text:txt,spoken:!!spoken};C.msgs.push(um);
  const ai=miniIntent(txt);let intent=ai.intent;
  if(RX.repeat.test(txt)){intent="repeat";}else if(RX.slow.test(txt)){intent="slow";}
  const resume=()=>{o.ask=false;if(o.done){render();return;}
    if(o.dlg){render();return;}
    const q=o.cur;if(!q)return;const p=tchPrompt(q);
    C.msgs.push(Object.assign({role:"assistant",text:"Zurück zur Aufgabe: "+p.text},p,{text:"Zurück zur Aufgabe: "+p.text,say:undefined}));render();};
  if(intent==="dialog"){o.ask=false;if(o.done||o.dlg){}else{const k=o.steps.findIndex((s,j)=>j>=o.i&&s.t==="dlg");if(k>=0){o.i=k;tchRun();return;}}}
  if(intent==="quiz"){const k=o.steps.findIndex((s,j)=>j>=o.i&&s.t==="final");if(k>=0){o.i=k;o.dlg=null;tchRun();return;}}
  if(intent==="nextlesson"){C.msgs.push({role:"assistant",text:"Gerne – wir können jederzeit zur nächsten Lektion wechseln. Tippe unten auf „Nächste Lektion“."});o.skip=true;render();return;}
  if(intent==="stop"){C.msgs.push({role:"assistant",text:"Kein Problem, wir machen eine Pause. Sag Bescheid oder tippe auf „Weiter“, dann geht es an der gleichen Stelle weiter.",opts:["Weiter ▶"]});o.paused=true;render();return;}
  if(!["target","unknown"].includes(intent)&&(ai.conf>=.3||intent==="repeat"||intent==="slow")){
    const dlgSave=o.dlg;o.dlg=null;
    miniDo(C,intent,txt,miniSlot(txt),um);o.dlg=dlgSave;resume();return;
  }
  miniFixedReply(C,txt,mTok(txt),um);resume();
}
/* Entscheidet: Antwort auf die Aufgabe oder Frage an den Lehrer */
function tchHandle(txt,spoken){
  const C=V.chat,o=C.ot;txt=(txt||"").trim();if(!txt||!o)return;miniBuild();
  if(o.mode==="talk"){talkHandle(txt,spoken);return;}
  if(o.mode!=="teach")return;
  if(o.done){tchQuestion(txt,spoken);return;}
  if(o.paused){o.paused=false;}
  const q=o.cur;
  if(o.ask){tchQuestion(txt,spoken);return;}
  if(o.dlg){
    const ai=miniIntent(txt);
    const d=o.dlg,exp=d.L[d.p],ev=evaluate(exp[1],[txt]);
    if(ev.score<45&&!["target","unknown"].includes(ai.intent)&&ai.conf>=.6){tchQuestion(txt,spoken);return;}
    const um={role:"user",text:txt,spoken:!!spoken,cmp:{target:exp[1],score:ev.score,words:ev.words}};C.msgs.push(um);
    if(ev.score>=85)addXp(2);
    dlgAdvance(C,d,d.p+1);return;
  }
  if(!q)return;
  if(q.t==="info"){const ai=miniIntent(txt);if(/^(ok|okay|weiter|ja|verstanden|next|continue|yes)\b/i.test(txt)||["target","unknown"].includes(ai.intent)){tchAnswer(txt,spoken);}else tchQuestion(txt,spoken);return;}
  if(q.t==="mc"||q.t==="cl"){
    const opts=q.t==="mc"?q.opts0:q.o;
    if(opts.some(x=>norm(x)===norm(txt))){tchAnswer(txt,spoken);return;}
    tchQuestion(txt,spoken);return;
  }
  // rep / tr: Zielsprache = Antwort; klare Fragen auf Deutsch = Frage
  const target=stripG(q.it.idn),ev=evaluate(target,[txt]);
  if(ev.score<55){const ai=miniIntent(txt);if(!["target","unknown"].includes(ai.intent)&&ai.conf>=(ev.score<35?.4:.6)){tchQuestion(txt,spoken);return;}}
  tchAnswer(txt,spoken);
}
function tchPick(i){
  const C=V.chat,o=C.ot;if(!o)return;
  const last=C.msgs[C.msgs.length-1];if(!last||!last.opts)return;
  const val=last.opts[i];

    C.msgs.push({role:"user",text:val});
    const ok=norm(val)===norm(o.cur[1]);if(ok)o.right[o.li]++;
    o.k++;

      if(o.right[o.li]>=2){if(o.li>=3){otPlaceDone(3,true);return;}o.li++;o.k=0;o.qs=[];}
      else{otPlaceDone(o.li);return;}
    }
    otPlaceAsk();return;
  }
  if(val==="Zeig mir die Lösung"&&o.dlg){
    const e=o.dlg.L[o.dlg.p];last.opts=null;
    C.msgs.push({role:"assistant",text:"So könntest du antworten – sprich es nach:",goal:e[1],gl:e[2]});o.last={say:e[1],gl:e[2]};render();if(C.auto)speak(e[1],.9);return;

let chatSR=null,chatSRgen=0;
async function chatListen(retryIdx){
  if(!SRC){V.chat.err=LT.srUnsup;render();return;}
  if(chatSR&&Date.now()-(chatSR._t0||0)<15000){tlog("Tipp während Aufnahme → Stopp");try{chatSR.stop();}catch(e){}return;}   // zweiter Tipp = fertig, auswerten
  if(chatSR){try{chatSR.abort();}catch(e){}chatSR=null;micBusy=false;}
  const gen=++chatSRgen;
  micBusy=true;Rec.stop(true);V.chat.err="";
  await micReset();if(gen!==chatSRgen){return;}
  const st=()=>$("#cstat"),say=t=>{const e=st();if(e)e.textContent=t;};
  const alts=[];let interim="",srErr=null,tries=0,t0=Date.now(),finished=false;
  const finish=()=>{
    if(finished)return;finished=true;chatSR=null;micBusy=false;
    try{if(navigator.audioSession)navigator.audioSession.type="auto";}catch(e){}
    if(!alts.length&&interim)alts.push(interim);
    if(!alts.length){
      V.chat.err=((srErr&&SRERR[srErr])?SRERR[srErr]:"Nichts erkannt. Tippe auf 🎙, warte kurz, bis „Ich höre zu“ erscheint, und sprich dann deutlich. Du kannst auch tippen. (Die Spracherkennung braucht Internet.)")+" [Code: "+(srErr||"leer")+", Versuche: "+tries+"]";
      say("");render();return;
    }
    say("");
    if(retryIdx!=null){const m=V.chat.msgs[retryIdx];if(m&&m.cmp){const ev=evaluate(m.cmp.target,alts);m.cmp.retry={score:ev.score,words:ev.words};addXp(1);render();}}
    else chatSend(alts[0],true);
  };
  const run=()=>{
    tries++;
    let r;try{r=srGet(tries>1&&tries%2===0);}catch(e){srErr="aborted";finish();return;}
    chatSR=r;r._t0=Date.now();r.lang=CFG.sr;r.interimResults=true;r.maxAlternatives=5;r.continuous=tries>=3;
    let got=false;
    r.onstart=()=>{tlog("SR start (Versuch "+tries+")");say("🎙 Ich höre zu – sprich jetzt …");};
    r.onresult=e=>{
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal){got=true;for(let k=0;k<e.results[i].length;k++)alts.push(e.results[i][k].transcript);}
        else{interim=e.results[i][0].transcript;say("🎙 "+interim+" …");}
      }};
    r.onerror=e=>{srErr=e.error;tlog("SR Fehler: "+e.error);};
    r.onend=()=>{
      tlog("SR ende (Ergebnisse: "+alts.length+", Zwischen: "+(interim?1:0)+")");
      if(gen!==chatSRgen||finished)return;
      const soft=!srErr||srErr==="no-speech"||srErr==="aborted";
      if(!got&&!alts.length&&!interim&&soft&&tries<3&&Date.now()-t0<9000){srErr=null;setTimeout(()=>{if(gen===chatSRgen&&!finished)run();},tries>1?500:250);return;}
      finish();
    };
    try{r.start();}catch(e){srErr="aborted";tlog("SR start Ausnahme: "+(e&&e.name));finish();}
  };
  say("🎙 Mikrofon wird vorbereitet …");
  run();
  setTimeout(()=>{if(gen===chatSRgen&&!finished){if(chatSR){try{chatSR.stop();}catch(e){}}setTimeout(()=>{if(gen===chatSRgen&&!finished)finish();},1500);}},12000);   // Sicherheits-Stopp
}

/* ===================== MINI-KI (selbstgebaut, ohne Internet) ===================== */
/* Bestandteile: (1) trainiertes Absichtsmodell (mini/train.py, Gewichte in MINI_MODEL),
   (2) Sprachmodell: Wort-Unigramm/Bigramm aus den Lektionstexten + Editierdistanz = Fehlerkorrektur,
   (3) Retrieval über Dialogzeilen/Vokabeln/Sätze (Wortähnlichkeit + Zeichen-Trigramm-Kosinus). */
const MINI={built:false,lines:[],items:[],freq:{},bg:{},vocab:[],model:null};
const mTok=t=>norm(t).split(" ").filter(Boolean);
function fnv(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function ngVec(t){const w="  "+norm(t)+"  ",m={};for(let i=0;i<w.length-2;i++){const g=w.substr(i,3);m[g]=(m[g]||0)+1;}let n=0;for(const k in m)n+=m[k]*m[k];m._n=Math.sqrt(n)||1;return m;}
function ngCos(a,b){let d=0;for(const k in a){if(k==="_n")continue;if(b[k])d+=a[k]*b[k];}return d/(a._n*b._n);}
function miniBuild(){
  if(MINI.built)return;MINI.built=true;
  UNITS.forEach(u=>{
    const L=u.dlg.lines;
    L.forEach((l,i)=>MINI.lines.push({u:u.id,i,spk:l[0],tgt:l[1],gl:l[2],tk:mTok(l[1]),gk:mTok(l[2]),L,ng:ngVec(l[1])}));
  });
  ITEMS.forEach(x=>{const t=stripG(x.idn);MINI.items.push({u:x.u,k:x.k,tgt:t,gl:x.de,tk:mTok(t),gk:mTok(x.de),ng:ngVec(t),gg:ngVec(x.de)});});
  const feed=toks=>{toks.forEach((w,i)=>{MINI.freq[w]=(MINI.freq[w]||0)+1;if(i){const p=toks[i-1];(MINI.bg[p]=MINI.bg[p]||{})[w]=((MINI.bg[p]||{})[w]||0)+1;}});};
  MINI.lines.forEach(c=>feed(c.tk));MINI.items.forEach(c=>feed(c.tk));
  MINI.vocab=Object.keys(MINI.freq);
  if(typeof MINI_MODEL!=="undefined"){
    const m=MINI_MODEL,bin=atob(m.W),W=new Int8Array(bin.length);for(let i=0;i<bin.length;i++){const c=bin.charCodeAt(i);W[i]=c>127?c-256:c;}
    MINI.model={H:m.H,classes:m.classes,scale:m.scale,b:m.b,W,trig:new Set(m.trig),con:m.con};
  }
}
/* Absichtsmodell: gleiche Merkmale wie beim Training (Wörter, Zeichen-n-Gramme, Bigramme, Begriffe) */
function miniFeat(text){
  const M=MINI.model,toks=mTok(text),f={};
  const add=k=>{const i=fnv(k)%M.H;f[i]=(f[i]||0)+1;};
  toks.forEach(t=>{add("w:"+t);if(M.con[t])add("k:"+M.con[t]);const w="<"+t+">";for(let n=2;n<=4;n++)for(let i=0;i+n<=w.length;i++)add("c:"+w.substr(i,n));});
  for(let i=1;i<toks.length;i++)add("b:"+toks[i-1]+"_"+toks[i]);
  let nr=0;const out=[];for(const i in f){const v=1+Math.log(f[i]);out.push([+i,v]);nr+=v*v;}nr=Math.sqrt(nr)||1;
  return out.map(([i,v])=>[i,v/nr]);
}
function miniIntent(text){
  const M=MINI.model;if(!M)return {intent:"target",conf:0,top:[]};
  const x=miniFeat(text),C=M.classes.length,z=new Array(C);
  for(let c=0;c<C;c++){let s=M.b[c];const off=c*M.H;for(const [i,v] of x)s+=v*M.W[off+i]*M.scale;z[c]=s;}
  const mx=Math.max(...z);let sum=0;const p=z.map(v=>{const e=Math.exp(v-mx);sum+=e;return e;}).map(e=>e/sum);
  const idx=p.map((v,i)=>i).sort((a,b)=>p[b]-p[a]);
  return {intent:M.classes[idx[0]],conf:p[idx[0]],top:idx.slice(0,3).map(i=>[M.classes[i],p[i]])};
}
/* Sprachmodell: Tippfehler im Zieltext korrigieren (Editierdistanz + Unigramm + Bigramm-Kontext) */
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;const d=[];for(let i=0;i<=m;i++){d[i]=[i];}for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);}return d[m][n];}
function miniFix(toks){
  const out=[];
  toks.forEach((t,k)=>{
    if(MINI.freq[t]||t.length<3){out.push(t);return;}
    let best=t,bs=-1e9;const prev=out[k-1];
    for(const c of MINI.vocab){const d=lev(t,c);if(d>2||(d===2&&t.length<5))continue;

function qScore(qt,ct){
  if(!qt.length||!ct.length)return 0;
  let p=0,r=0;
  for(const a of qt){let b=0;for(const c of ct){const v=a===c?1:sim(a,c);if(v>b)b=v;}p+=b;}
  for(const c of ct){let b=0;for(const a of qt){const v=a===c?1:sim(a,c);if(v>b)b=v;}r+=b;}
  p/=qt.length;r/=ct.length;return p+r?2*p*r/(p+r):0;
}
function miniBest(qt,arr,key,qng,ngkey){let best=null,bs=0;
  for(const c of arr){let v=qScore(qt,c[key]);if(qng&&ngkey){const cs=ngCos(qng,c[ngkey]);if(cs>v)v=cs*.97;}
    if(v>bs){ /* mindestens ein Wort muss (fast) übereinstimmen, sonst Zufallstreffer */
      if(v<.9&&!qt.some(a=>c[key].some(b=>a===b||sim(a,b)>=.85)))continue;
      bs=v;best=c;}}
  return {c:best,s:bs};}

function miniSlot(q){

    const r1=lookupT(miniFix(slot));
    if(r1.s>=.7){miniSay(C,"„"+r1.c.tgt+"“ bedeutet: „"+r1.c.gl+"“",r1.c.tgt,r1.c.gl);return;}
    miniSay(C,"Dafür habe ich noch kein passendes Wort. "+(r.c&&r.s>=.4?"Ähnlich ist: „"+r.c.gl+"“.":""),r.c&&r.s>=.4?r.c.tgt:"",r.c&&r.s>=.4?r.c.gl:"");return;
   }
   case"example":{

    if(wt.length)MINI.items.filter(x=>x.k==="s").forEach(x=>{const sc=Math.max(...wt.map(a=>Math.max(...x.tk.map(c=>a===c?1:sim(a,c)))));if(sc>=.85)hits.push(x);});
    if(!hits.length){const g=wt.length?lookupN(slot):null;if(g&&g.s>=.55){const t=mTok(g.c.tgt);MINI.items.filter(x=>x.k==="s"&&t.some(w=>x.tk.includes(w))).forEach(x=>hits.push(x));}}

   }
   case"grammar":{

    const w=slot.filter(x=>!SW.has(x));let u=otUnit(),bs=0;

  }
  miniSay(C,"Das habe ich nicht verstanden. Du kannst zum Beispiel fragen: „Was heißt …?“, „Wie sagt man …?“, „Gib mir einen Satz mit …“, „Teste mich“ oder sag einen Satz aus der Lektion.");

function talkHandle(txt,spoken){
  const C=V.chat,o=C.ot;miniBuild();
  const um={role:"user",text:txt,spoken:!!spoken};C.msgs.push(um);
  const q=txt.trim(),qt=mTok(q);
  const ai=miniIntent(q);
  const wantsStop=RX.stop.test(q)||(ai.intent==="stop"&&ai.conf>=.7);
  // Steuerbefehle (Wiederholen, langsamer, Hilfe …) gelten auch mitten im Rollenspiel/Quiz
  if((o.dlg||o.quiz)&&!wantsStop){
    let ci=ai.intent,cc=ai.conf;
    if(RX.repeat.test(q)){ci="repeat";cc=1;}else if(RX.slow.test(q)){ci="slow";cc=1;}
    if(["repeat","slow","help","pronounce","whatmeant","nextlesson","dialog","quiz","level"].includes(ci)&&cc>=.75){
      if(ci==="nextlesson"||ci==="dialog"||ci==="quiz"){o.dlg=null;o.quiz=null;}
      if((ci==="repeat"||ci==="slow")&&o.quiz&&!o.last){miniSay(C,"Übersetze: „"+o.quiz.gl+"“");return;}
      miniDo(C,ci,q,[],um);
      if(o.dlg&&ci!=="dialog"){/* Rolle bleibt aktiv */}
      return;
    }
  }
  // laufendes Rollenspiel
  if(o.dlg){
    if(wantsStop){o.dlg=null;miniSay(C,"Dialog beendet. Frag mich etwas oder sag „Dialog“ für einen neuen.");return;}
    const d=o.dlg,exp=d.L[d.p];
    const ev=evaluate(exp[1],[q]);um.cmp={target:exp[1],score:ev.score,words:ev.words};
    if(ev.score>=85)addXp(2);
    dlgAdvance(C,d,d.p+1);return;
  }
  // laufendes Quiz
  if(o.quiz){
    if(wantsStop){o.quiz=null;miniSay(C,"Quiz beendet. Gut gemacht!");return;}
    const t=o.quiz.target,ev=evaluate(t,[q]);um.cmp={target:t,score:ev.score,words:ev.words};
    if(ev.score>=85){addXp(2);miniSay(C,"Richtig! ✅");}else miniSay(C,"Nicht ganz – so heißt es richtig:",t,o.quiz.gl);
    quizNext(C);return;
  }
  if(wantsStop){miniDo(C,"stop",q,[],um);return;}
  // Absicht: erst Modell, bei klaren Mustern zusätzlich Regeln
  let intent=ai.intent,conf=ai.conf;
  if(RX.repeat.test(q)&&intent!=="repeat"){intent="repeat";conf=.9;}
  if(RX.slow.test(q)&&intent!=="slow"){intent="slow";conf=.9;}
  const native=!["target","unknown"].includes(intent);
  if(native&&conf>=.5){miniDo(C,intent,q,miniSlot(q),um);return;}
  if(native&&conf>=.3&&ai.top.length>1){
    // unsicher: zwei Deutungen zur Auswahl anbieten
    const ch=ai.top.filter(t=>!["target","unknown"].includes(t[0])).slice(0,2).map(t=>[INTENT_LABEL[t[0]]||t[0],t[0]]);

  }
  // Zielsprache bzw. unklar: Eingabe korrigieren und gegen Dialogzeilen abgleichen
  miniFixedReply(C,q,qt,um);
}
function miniFixedReply(C,q,qt,um){
  const o=C.ot,fx=miniFix(qt),qn=ngVec(fx.join(" "));
  const bl=miniBest(fx,MINI.lines,"tk",qn,"ng"),bi=miniBest(fx,MINI.items,"tk",qn,"ng"),bn=miniBest(qt,MINI.items,"gk",ngVec(qt.join(" ")),"gg");
  const tgtScore=Math.max(bl.s,bi.s);
  if(bn.s>tgtScore+.1&&bn.s>=.65){miniSay(C,"So sagt man das:",bn.c.tgt,bn.c.gl);return;}
  if(bl.s>=.5&&bl.s>=bi.s-.05){
    const c=bl.c;
    if(norm(q)!==norm(c.tgt)){const ev=evaluate(c.tgt,[q]);um.cmp={target:c.tgt,score:ev.score,words:ev.words};}
    let reply=c.L[c.i+1]&&c.L[c.i+1][0]!==c.spk?c.L[c.i+1]:(c.L[c.i-1]&&c.L[c.i-1][0]!==c.spk?c.L[c.i-1]:null);

    if(reply){miniSay(C,bl.s<.85?"Meintest du: „"+c.tgt+"“? Dann würde ich so antworten:":"Meine Antwort:",reply[1],reply[2]);addXp(1);return;}
  }

    const c=bi.c;if(norm(q)!==norm(c.tgt)){const ev=evaluate(c.tgt,[q]);um.cmp={target:c.tgt,score:ev.score,words:ev.words};}
    miniSay(C,"„"+c.tgt+"“ bedeutet: „"+c.gl+"“",c.tgt,c.gl);return;
  }
  miniSay(C,"Das habe ich nicht verstanden. Du kannst zum Beispiel fragen: „Was heißt …?“, „Wie sagt man …?“, „Gib mir einen Satz mit …“, „Teste mich“ oder sag einen Satz aus der Lektion.");
}

   case"sayw":speak(dsx.w,.9);break;
   case"saySP":speak(SP.target,dsx.slow?.55:.9);break;
   case"sayLine":{const u=UNIT(dsx.u);speak(u.dlg.lines[+dsx.l][1],.9,u.dlg.lines[+dsx.l][0]==="A"?1:1.18);break;}
   case"sayAll":{const its=ITEMS.filter(x=>x.u===dsx.u&&x.k===dsx.k);const my=++playTok;(async()=>{for(const x of its){if(my!==playTok)return;await speak(x.idn,.9);await sleep(400);}})();break;}
   case"playDlg":{const u=UNIT(dsx.u);playDlg(u);break;}
   case"toggleDe":V.showDe=!V.showDe;render();break;
   case"toggleId":V.showId=!V.showId;render();break;
   case"startCards":V.scope=dsx.scope;V.cards=null;go("cards");break;
   case"startEx":V.scope=dsx.scope;if(dsx.type)V.exType=dsx.type;V.ex=null;go("ex");break;
   case"newCards":buildCards();render();break;
   case"freeCards":buildCards(true);render();break;
   case"flip":V.cards.flip=true;render();break;
   case"rate":rateCard(+dsx.r);break;
   case"goSpeakItem":{const it=IDX[dsx.i];const l=ITEMS.filter(x=>x.u===it.u&&x.k===it.k);V.sp={mode:"item",unit:it.u,kind:it.k,i:l.indexOf(it)};go("speak");break;}
   case"spMode":V.sp.mode=dsx.m;Rec.stop(true);stopAudio();render();break;
   case"spNext":case"spPrev":case"spRand":{const l=ITEMS.filter(x=>x.u===V.sp.unit&&x.k===V.sp.kind);const n=l.length;V.sp.i=a==="spRand"?Math.floor(Math.random()*n):(V.sp.i+(a==="spNext"?1:n-1))%n;Rec.stop(true);render();break;}
   case"toggleRec":Rec.active?Rec.stop():Rec.start(null,recMode()==="sr"?"rec":undefined);break;
   case"altRec":{
    let inp=document.getElementById("altrecinp");
    if(!inp){inp=document.createElement("input");inp.type="file";inp.accept="audio/*";inp.setAttribute("capture","microphone");inp.id="altrecinp";inp.style.display="none";document.body.appendChild(inp);
      inp.addEventListener("change",()=>{const f=inp.files&&inp.files[0];if(!f)return;
        if(SP.url){try{URL.revokeObjectURL(SP.url);}catch(e){}}
        SP.url=URL.createObjectURL(f);S.totalSpeak=(S.totalSpeak||0)+1;D().speak++;addXp(1);save();
        SP.status="Aufnahme übernommen. Tippe auf ⇄ Abgleich oder ▶ Meine Aufnahme.";inp.value="";render();});}
    inp.click();break;}
   case"scoreOnly":Rec.active?Rec.stop():Rec.start(null,"sr");break;
   case"playMine":playMine();break;
   case"compare":compareAudio();break;
   case"startRp":V.rp={u:dsx.u,role:dsx.role||"B",i:0,scores:[],played:{},done:false};V.sp.mode="role";go("rp");break;
   case"rpNext":{const r=V.rp;if(SP.res)r.scores[r.i]=SP.res.score;Rec.stop(true);stopAudio();r.i++;SP._rpIdx=-1;render();break;}
   case"rpRestart":V.rp={u:V.rp.u,role:V.rp.role,i:0,scores:[],played:{},done:false};SP._rpIdx=-1;render();break;
   case"rpSwap":V.rp={u:V.rp.u,role:V.rp.role==="A"?"B":"A",i:0,scores:[],played:{},done:false};SP._rpIdx=-1;render();break;
   case"hMode":V.hear.mode=dsx.m;stopAudio();render();break;
   case"newDict":buildDict();render();break;
   case"dPlay":{const q=V.hear.q;speak(IDX[q.qs[q.i]].idn,dsx.slow?.5:.85);break;}
   case"dHint":{const h=document.getElementById("dhint");if(h)h.style.display="block";break;}
   case"dCheck":dictCheck();break;
   case"dNext":{const q=V.hear.q;q.i++;q.res=null;q.typed="";q.played=false;render();break;}
   case"newEx":newEx();render();break;
   case"exPlay":{const q=V.ex.qs[V.ex.i];speak(q.it.idn,dsx.slow?.55:.9);break;}
   case"exPlayText":speak(dsx.x,.9);break;
   case"exOpt":{const q=V.ex.qs[V.ex.i];if(q.res!==undefined)break;const i=+dsx.i;q.pick=i;let ok=false;
     if(q.t==="cloze"||q.t==="gram")ok=q.o[i]===q.a;else ok=q.o[i].id===q.it.id;exFinish(q,ok);break;}
   case"exTake":{const q=V.ex.qs[V.ex.i];const c=q.pool.splice(+dsx.k,1)[0];q.ans.push(c);render();break;}
   case"exDrop":{const q=V.ex.qs[V.ex.i];if(q.res!==undefined)break;const c=q.ans.splice(+dsx.k,1)[0];q.pool.push(c);render();break;}
   case"exBuildCheck":{const q=V.ex.qs[V.ex.i];exFinish(q,norm(q.ans.map(c=>c.w).join(" "))===norm(q.it.idn));break;}
   case"exTransCheck":exTransCheck();break;
   case"exSkip":{const q=V.ex.qs[V.ex.i];q.typed="";exFinish(q,false);break;}
   case"exNext":V.ex.i++;render();break;
   case"diagSpeakOn":unlockAudio();speakOnline(LT.testSent,.95).then(ok=>{if(!ok)toast("Online-Stimme nicht erreichbar oder blockiert (siehe Protokoll).");});break;
   case"diagSpeakDef":unlockAudio();speak("Hello. This is a test of the speech output.",1,1,true);break;
   case"diagSpeak":unlockAudio();speak(LT.testSent,.9);break;
   case"diagMic":diagMic();break;
   case"diagPlay":if(DIAG.url)playAud(DIAG.url);break;
   case"hideIos":S.hideIos=true;save();render();break;
   case"bkCopy":{const txt=JSON.stringify(S),msg=document.getElementById("bkmsg");
     const ok=()=>{S.lastBackup=Date.now();save();msg.textContent="✅ Kopiert. Füge den Text z. B. in Notizen ein und bewahre ihn auf.";};
     const fallback=()=>{const b=document.getElementById("bk");try{b.value=txt;b.focus();b.select();b.setSelectionRange(0,txt.length);document.execCommand("copy")?ok():(msg.textContent="Bitte den markierten Text unter „Sicherungstext anzeigen“ manuell kopieren.");}catch(x){msg.textContent="Bitte den Text unter „Sicherungstext anzeigen“ manuell kopieren.";}};
     try{navigator.clipboard.writeText(txt).then(ok,fallback);}catch(x){fallback();}break;}
   case"bkFile":{try{const blob=new Blob([JSON.stringify(S)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");
     a.href=u;a.download="belajar-sicherung-"+today()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1500);
     S.lastBackup=Date.now();save();document.getElementById("bkmsg").textContent="✅ Datei wird gespeichert (auf dem iPhone: in „Dateien“ sichern).";}catch(x){document.getElementById("bkmsg").textContent="Download nicht möglich – nutze „In Zwischenablage kopieren“.";}break;}
   case"bkImport":{try{const o=JSON.parse(document.getElementById("bk").value);if(!o||typeof o!=="object"||!o.box)throw 0;S=Object.assign(S,o);save();document.getElementById("bkmsg").textContent="✅ Importiert.";render();}catch(x){document.getElementById("bkmsg").textContent="❌ Ungültige Sicherung.";}break;}
   case"reset":{if(dsx.sure){S={box:{},due:{},xp:0,last:"",streak:0,bestStreak:0,best:{},hist:{},day:null,goal:60,newPerDay:10,cmode:"id2de",ckinds:"vs",totalCards:0,totalSpeak:0};save();render();}else{t.dataset.sure="1";t.textContent="Wirklich löschen? (nochmal klicken)";}break;}
  }
});
function playDlg(u){
  playDialog(u,i=>{document.querySelectorAll(".bub").forEach((b,k)=>b.classList.toggle("on",k===i));});
}
document.addEventListener("change",e=>{
  const k=e.target.dataset.sel,c=e.target.dataset.chk,v=e.target.value;
  if(e.target.dataset.file==="bk"){
    const f=e.target.files&&e.target.files[0];if(!f)return;const fr=new FileReader();
    fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||typeof o!=="object"||!o.box)throw 0;S=Object.assign(S,o);save();render();const m=document.getElementById("bkmsg");if(m)m.textContent="✅ Sicherung geladen.";}catch(x){const m=document.getElementById("bkmsg");if(m)m.textContent="❌ Datei ist keine gültige Sicherung.";}};
    fr.readAsText(f);return;
  }
  if(c==="hideT"){V.hideT=e.target.checked;render();return;}
  if(!k)return;
  if(k==="scope"){V.scope=v;V.cards=null;V.ex=null;V.hear.q=null;render();}
  if(k==="cmode"){S.cmode=v;save();V.cards&&(V.cards.spoken=false,V.cards.flip=false);render();}
  if(k==="ckinds"){S.ckinds=v;save();V.cards=null;render();}
  if(k==="extype"){V.exType=v;V.ex=null;render();}
  if(k==="spunit"){V.sp.unit=v;V.sp.i=0;Rec.stop(true);render();}
  if(k==="spkind"){V.sp.kind=v;V.sp.i=0;Rec.stop(true);render();}
  if(k==="rpunit"){V.rp={u:v,role:V.rp.role,i:0,scores:[],played:{},done:false};stopAudio();SP._rpIdx=-1;render();}
  if(k==="rprole"){V.rp={u:V.rp.u,role:v,i:0,scores:[],played:{},done:false};stopAudio();SP._rpIdx=-1;render();}
  if(k==="hdlg"){V.hear.dlgU=v;stopAudio();render();}
  if(k==="ttsmode"){S.ttsMode=v;S.ttsAutoOnline=false;save();unlockAudio();speak(LT.testSent,.9);}
  if(k==="voice"){S.voiceURI=v||undefined;save();unlockAudio();speak(LT.testSent,.9);}
  if(k==="recmode"){Rec.stop(true);S.recMode=v;save();render();}
  if(k==="goal"){S.goal=+v;save();render();}
  if(k==="newpd"){S.newPerDay=+v;save();}
});
document.addEventListener("keydown",e=>{
  if(V.tab!=="cards"||!V.cards||V.cards.i>=V.cards.q.length)return;
  if(/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||""))return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();if(!V.cards.flip){V.cards.flip=true;render();}}
  else if(V.cards.flip&&["1","2","3"].includes(e.key))rateCard(+e.key-1);
});
document.addEventListener("pointerdown",()=>{if(!audUnlocked)unlockAudio();},{passive:true});
window.addEventListener("beforeunload",()=>{try{speechSynthesis.cancel();}catch(e){}});
header();render();
idbLoad().then(raw=>{if(!raw)return;try{const o=JSON.parse(raw);if((o.ts||0)>(S.ts||0)&&o.box){S=Object.assign(S,o);header();render();}}catch(e){}});

</script>
