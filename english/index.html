U({id:"a1-05",lvl:"A1",e:"⏰",t:"Tagesablauf (Present Simple)",
 intro:"Was du jeden Tag tust: Gewohnheiten, Zeiten und Häufigkeit mit dem Present Simple.",
 grammar:{t:"Present Simple",html:`
<p>Für Gewohnheiten und Tatsachen. Grundform des Verbs, bei <b>he/she/it</b> kommt <b>-s</b>: <i>I work</i> – <i>she works</i>.</p>
<ul><li>-s / -es: <i>watch → watches</i>, <i>go → goes</i>, <i>study → studies</i></li>

<li><b>Frage:</b> <i>Do you work?</i> / <i>Does she work?</i></li></ul>
<p><b>Häufigkeitsadverbien</b> stehen vor dem Verb (nach <i>be</i>): <i>always, usually, often, sometimes, never</i>: <i>I always get up at seven.</i> – <i>He is never late.</i></p>`},

function releaseAudio(){   // Audio-Element wirklich freigeben, damit das Mikrofon die Audio-Session bekommt

function speakOnline(text,rate){
  return new Promise(res=>{
    let done=false;const fin=ok=>{if(!done){done=true;if(!ok)try{AUD.pause();}catch(e){}res(ok);}};
    const url="https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl="+CFG.tl+"&q="+encodeURIComponent(text.slice(0,190))+((rate&&rate<.7)?"&ttsspeed=0.24":"");
    tlog("Online-Stimme: lade \""+text.slice(0,28)+"\"");
    try{
      AUD.pause();AUD.onended=()=>{tlog("→ Online beendet");try{AUD.onended=null;AUD.onerror=null;AUD.removeAttribute("src");AUD.load();}catch(e){}fin(true);};
      AUD.onerror=()=>{tlog("→ Online-Stimme: Ladefehler");fin(false);};
      AUD.src=url;AUD.load&&AUD.load();
      const p=AUD.play();
      if(p&&p.then)p.then(()=>tlog("→ Online gestartet")).catch(e=>{tlog("→ Online blockiert: "+((e&&e.name)||e));fin(false);});
    }catch(e){fin(false);}
    setTimeout(()=>fin(false),Math.max(9000,text.length*400));
  });
}
let ttsUnlocked=false;
function deviceSpeak(text,rate,pitch,forceDefault){
  return new Promise(res=>{
    if(!("speechSynthesis" in window)){tlog("keine speechSynthesis");res(false);return;}
    try{loadVoices();}catch(e){}
    let done=false,started=false,tries=0,retrying=false;
    const fin=ok=>{if(!done){done=true;res(!!ok);}};
    const say=()=>{
      tries++;
      const u=new SpeechSynthesisUtterance(text),v=forceDefault?null:idVoice();
      tlog("Gerätestimme: \""+text.slice(0,28)+"\" – "+(v?v.name+" ("+v.lang+")":"Standard")+" – Versuch "+tries+" (Stimmen: "+voices.length+")");
      if(v){u.voice=v;u.lang=v.lang;}
      u.rate=rate||.95;u.pitch=pitch||1;u.volume=1;
      u.onstart=()=>{started=true;ttsUnlocked=true;tlog("→ gestartet");};
      u.onend=()=>{started=true;tlog("→ beendet");fin(true);};
      u.onerror=ev=>{const c=ev&&ev.error;tlog("→ FEHLER: "+c);if(c==="canceled"||c==="interrupted"){if(!retrying)fin(started);return;}fin(false);};
      try{speechSynthesis.resume();}catch(e){}
      try{speechSynthesis.speak(u);}catch(e){fin(false);}
    };
    // Beim ersten Mal ohne Umweg direkt im Fingertipp sprechen; iOS verwirft sonst oft die Äußerung
    if(speechSynthesis.speaking||speechSynthesis.pending){
      try{speechSynthesis.cancel();}catch(e){}
      if(ttsUnlocked){retrying=true;setTimeout(()=>{retrying=false;say();},80);}else say();
    }else say();
    setTimeout(()=>{if(!done&&!started&&tries<2){tlog("nicht gestartet – neuer Versuch");retrying=true;try{speechSynthesis.cancel();}catch(e){}setTimeout(()=>{retrying=false;say();},80);}},700);
    setTimeout(()=>{if(!done&&!started){tlog("→ nie gestartet");fin(false);}},2000);
    setTimeout(()=>fin(started),Math.max(7000,text.length*320));
  });
}
async function speak(text,rate,pitch,forceDefault){
  if(S.ttsV!==2){S.ttsV=2;S.ttsMode="online";save();}   // einmalig: Online-Stimme als Standard für alle Lektionen
  const mode=S.ttsMode||"online";
  if(!forceDefault&&(mode==="online"||(mode==="auto"&&(S.ttsAutoOnline||!idVoice())))){
    if(await speakOnline(text,rate))return;
    tlog("Online-Stimme nicht möglich → Gerätestimme");
  }
  const ok=await deviceSpeak(text,rate,pitch,forceDefault);
  if(!ok&&!forceDefault&&mode==="auto"&&!S.ttsAutoOnline){
    tlog("Gerätestimme stumm → versuche Online-Stimme");
    if(await speakOnline(text,rate)){S.ttsAutoOnline=true;save();toast("Die Gerätestimme blieb stumm – ich nutze jetzt die Online-Stimme (Internet nötig).",6000);}
    else toast("Keine Sprachausgabe möglich: Gerätestimme stumm und Online-Stimme nicht erreichbar. Sieh im Tab „Laute“ ins Protokoll.",9000);
  }
}

const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
const SP={target:"",res:null,url:null,status:""};
function spReset(t){SP.target=t;SP.res=null;if(SP.url){try{URL.revokeObjectURL(SP.url);}catch(e){}}SP.url=null;SP.status="";}
function evaluate(target,alts){
  const tw=norm(target).split(" ").filter(Boolean);let best=null;
  for(const a of (alts.length?alts:[""])){
    const hw=heardNorm(a).split(" ").filter(Boolean);
    const words=tw.map(w=>({w,s:hw.length?Math.max(...hw.map(h=>sim(w,h))):0}));
    let sc=words.reduce((x,y)=>x+y.s,0)/Math.max(1,words.length);
    if(hw.length>tw.length)sc*=Math.max(.7,tw.length/hw.length);
    if(!best||sc>best.sc)best={sc,words,heard:a};
  }
  return {score:Math.round(best.sc*100),words:best.words,heard:best.heard};
}

function pickMime(){const c=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];for(const t of c){try{if(window.MediaRecorder&&MediaRecorder.isTypeSupported(t))return t;}catch(e){}}return "";}

async function getMic(opts){
  releaseAudio();
  const as=t=>{try{if(navigator.audioSession)navigator.audioSession.type=t;}catch(e){}};
  let last;
  for(const t of ["play-and-record","auto",null]){
    if(t)as(t);
    for(let k=0;k<2;k++){
      try{return await navigator.mediaDevices.getUserMedia(opts||{audio:true});}
      catch(e){last=e;if(e&&(e.name==="NotAllowedError"||e.name==="NotFoundError"||e.name==="SecurityError"))throw e;await sleep(250);}
    }
  }
  throw last;
}
const recMode=()=>S.recMode||(isIOS?"rec":"both");
const Rec={active:false,stream:null,mr:null,chunks:[],sr:null,ctx:null,raf:0,alts:[],timer:0,srDone:true,mrDone:true,srErr:null,gen:0,fin:false,cb:null,blob:null,wantSR:false,curMode:"",usedRec:false,
 async start(cb,forceMode){

  this.cb=cb;this.fin=false;this.alts=[];this.chunks=[];this.srErr=null;this.blob=null;this.mr=null;this.stream=null;
  playTok++;releaseAudio();   // laufende Wiedergabe beenden, Mikrofon braucht freie Audio-Session
  try{if(navigator.audioSession)navigator.audioSession.type="play-and-record";}catch(e){}

    if(!navigator.mediaDevices||!window.MediaRecorder){SP.status="Aufnahme wird von diesem Browser nicht unterstützt (Tab „Laute“ → Diagnose).";render();return;}
    try{this.stream=await getMic({audio:{echoCancellation:true,noiseSuppression:true}});}
    catch(e){SP.status="Mikrofon blockiert ("+((e&&e.name)||"Fehler")+"). Erlaube den Zugriff für diese Seite (iPhone: Einstellungen → Safari → Mikrofon, oder Hinweis in der Adressleiste). Lokale Dateien (file://) funktionieren oft nicht – nutze die https-Adresse.";render();return;}

      const data=new Uint8Array(an.fftSize);
      const draw=()=>{if(!this.active)return;const cv=document.getElementById("meter");
        if(cv){const g=cv.getContext("2d");an.getByteTimeDomainData(data);g.clearRect(0,0,cv.width,cv.height);g.strokeStyle="#c8102e";g.lineWidth=2;g.beginPath();
          for(let i=0;i<data.length;i++){const x=i/data.length*cv.width,y=data[i]/255*cv.height;i?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();}

 startSR(gen){

 stop(silent){

/* ===================== KARTEN (SRS) ===================== */
function buildCards(free){
  const kinds=S.ckinds.split(""),pool=itemsIn(V.scope,kinds),now=Date.now();
  let q=[],isFree=!!free;
  if(!free){
    const rev=pool.filter(x=>S.due[x.id]&&S.due[x.id]<=now);
    const left=Math.max(0,S.newPerDay-D().newc);
    const nw=pool.filter(x=>!S.due[x.id]&&!S.box[x.id]).slice(0,left);
    const uo={};UNITS.forEach((u,i)=>uo[u.id]=i);
    nw.sort((a,b)=>(uo[a.u]-uo[b.u])||((a.k==="v"?0:1)-(b.k==="v"?0:1)));   // Reihenfolge: Lektion → Vokabeln → Sätze
    q=shuffle(rev).sort((a,b)=>(a.k==="v"?0:1)-(b.k==="v"?0:1)).slice(0,30).map(x=>x.id).concat(nw.map(x=>x.id));
    if(!q.length)isFree=true;
  }
  if(isFree){q=shuffle(pool).sort((a,b)=>(S.box[a.id]||0)-(S.box[b.id]||0)).slice(0,15).map(x=>x.id);q=shuffle(q).sort((a,b)=>(IDX[a].k==="v"?0:1)-(IDX[b].k==="v"?0:1));}
  V.cards={q,i:0,flip:false,free:isFree,again:{},spoken:false,right:0};
}

  if(c.i>=c.q.length){
    $("#view").innerHTML=`<h2>Karteikarten</h2>${cfg}<div class="card">${c.q.length?`<p>🎉 Runde fertig! ${c.q.length} Karten geübt.</p>`:`<p>In diesem Bereich ist nichts zu üben.</p>`}
     <div class="row"><button class="btn pri" data-act="newCards">Neue Runde</button><button class="btn" data-act="freeCards">Freies Üben</button></div>
     <div class="small" style="margin-top:8px">${dueCount()} Karten insgesamt fällig · ${Math.max(0,S.newPerDay-D().newc)} neue Karten heute noch möglich.</div></div>`;
    return;
  }
  const it=IDX[c.q[c.i]],m=S.cmode;let front="",back="";
  const idBlock=`<div class="big">${esc(it.idn)}</div><div class="ph">${esc(it.ph)}</div>`;
  if(m==="id2de"){front=idBlock;back=`<div class="de" style="margin-top:14px;font-size:22px">${esc(it.de)}</div>`;}
  if(m==="de2id"){front=`<div class="small">${LT.howSay}</div><div class="big" style="font-size:26px">${esc(it.de)}</div>`;back=`<div style="margin-top:14px">${idBlock}</div>`;}
  if(m==="listen"){front=`<div class="small">Was hörst du?</div><div style="font-size:48px">🔊</div>`;back=`<div style="margin-top:12px">${idBlock}<div class="de" style="font-size:20px">${esc(it.de)}</div></div>`;}
  const u=UNIT(it.u);
  $("#view").innerHTML=`<h2>Karteikarten</h2>${voiceWarning()}${cfg}
   <div class="small" style="margin-bottom:6px">Karte ${c.i+1}/${c.q.length}${c.free?" · freies Üben":""} · ${it.k==="v"?"📘 Wort":"💬 Satz"} · ${u.lvl} ${u.n}. ${esc(u.t)}</div>
   <div class="card flip" data-act="flip">${front}${c.flip?`<div>${back}</div>`:`<div class="small" style="margin-top:14px">Tippen / Leertaste zum Umdrehen</div>`}</div>
   <div class="row" style="margin-bottom:12px"><button class="btn" data-act="say" data-i="${it.id}">🔊 Normal</button><button class="btn" data-act="say" data-i="${it.id}" data-slow="1">🐢 Langsam</button><button class="btn" data-act="goSpeakItem" data-i="${it.id}">🎙 Sprechen üben</button></div>
   ${c.flip?`<div class="row"><button class="btn" data-act="rate" data-r="0" style="border-color:var(--bad)">❌ Nicht gewusst (1)</button><button class="btn" data-act="rate" data-r="1" style="border-color:var(--mid)">😐 Schwer (2)</button><button class="btn pri" data-act="rate" data-r="2">✅ Gewusst (3)</button></div>`:""}`;
  if(!c.spoken&&(m==="id2de"||m==="listen")){c.spoken=true;speak(it.idn);}
  if(c.flip&&m==="de2id"&&!c.spoken2){c.spoken2=true;speak(it.idn);}
}
function rateCard(r){
  const c=V.cards,id=c.q[c.i],isNew=!S.box[id];let b=S.box[id]||0;const days=[0,1,2,4,8,16,32];
  if(isNew)D().newc++;
  if(r===0){b=1;S.due[id]=Date.now()+10*60000;if(!c.again[id]){c.again[id]=1;c.q.push(id);}}
  else if(r===1){b=Math.max(1,b);S.due[id]=Date.now()+864e5;}
  else{b=Math.min(6,b+1);S.due[id]=Date.now()+days[b]*864e5;c.right++;}
  S.box[id]=b;D().cards++;S.totalCards=(S.totalCards||0)+1;
  addXp(r===2?3:r===1?2:1);
  c.i++;c.flip=false;c.spoken=false;c.spoken2=false;render();
}

const EXT=[["mix","Gemischt"],["gram","Grammatik: Wörter einsetzen"],["cloze","Lückentext (Grammatik)"],["build","Satzbau"],["trans","Übersetzen"],["hear","Hörverstehen"],["vocab","Vokabel-Quiz"]];

const GCATS=CFG.gcats;
function gramPool(scope){
  const L=[];
  unitsIn(scope).forEach(u=>{
    (u.sent||[]).forEach(v=>L.push(v));
    ((u.dlg&&u.dlg.lines)||[]).forEach(l=>L.push([l[1],l[2]]));
  });
  const out=[];
  L.forEach(v=>{
    const toks=v[0].replace(/[.,!?]/g,"").split(" ");
    GCATS.forEach((c,ci)=>{
      toks.forEach((w,wi)=>{
        const lw=w.toLowerCase();
        const hit=c[1].find(x=>x.toLowerCase()===lw);
        if(hit&&!(c[0]==="Pronomen"&&wi>0&&false))out.push({idn:v[0],de:v[1],ci,wi,ans:hit,w});
      });
    });
  });
  return out;
}
function genEx(scope,type,n){
  const sents=itemsIn(scope,["s"]),words=itemsIn(scope,["v"]);
  const cl=[];unitsIn(scope).forEach(u=>(u.ex||[]).forEach(c=>cl.push(c)));
  const allS=ITEMS.filter(x=>x.k==="s"),allW=ITEMS.filter(x=>x.k==="v");
  const mk={
   cloze(){const c=pick(cl);return {key:"c"+c[0],t:"cloze",p:c[0],a:c[1],o:shuffle(c[2]),n:c[3]};},
   build(){const it=pick(sents);return {key:"b"+it.id,t:"build",it,pool:shuffle(it.idn.split(" ").map((w,i)=>({w,i}))),ans:[]};},
   trans(){const it=pick(sents.concat(words));return {key:"t"+it.id,t:"trans",it};},
   hear(){const it=pick(sents);const o=shuffle([it,...sample(allS.filter(x=>x.de!==it.de),3)]);return {key:"h"+it.id,t:"hear",it,o};},
   vocab(){const it=pick(words);const dir=Math.random()<.5?"id2de":"de2id";const o=shuffle([it,...sample(allW.filter(x=>x.de!==it.de&&x.idn!==it.idn),3)]);return {key:"v"+it.id+dir,t:"vocab",it,dir,o};}
  };
  const gp=gramPool(scope);
  mk.gram=function(){const g=pick(gp);const c=GCATS[g.ci];const toks=g.idn.replace(/[.,!?]/g,"").split(" ");const raw=g.idn.split(" ");
    const q=raw.map((t,i)=>i===g.wi?"_____":t).join(" ");
    const bl=new Set();(CFG.gsyn||[]).forEach(gr=>{if(gr.includes(g.ans))gr.forEach(x=>bl.add(x));});bl.delete(g.ans);
    let cand=c[1].filter(x=>x!==g.ans&&!bl.has(x));if(cand.length<3)cand=c[1].filter(x=>x!==g.ans);
    const o=shuffle([g.ans,...sample(cand,3)]);
    return {key:"g"+g.idn+g.wi+g.ci,t:"gram",p:q,a:g.ans,o,n:c[0]+": "+c[2],de:g.de,idn:g.idn};};
  const cnt={gram:gp.length,cloze:cl.length,build:sents.length,trans:sents.length+words.length,hear:sents.length,vocab:words.length};
  const avail=Object.keys(mk).filter(k=>cnt[k]>0);
  const types=type==="mix"?avail:avail.filter(k=>k===type);
  const qs=[],seen=new Set();
  for(let i=0;i<n&&types.length;i++){
    for(let tries=0;tries<6;tries++){const q=mk[types[i%types.length]]();if(!seen.has(q.key)){seen.add(q.key);qs.push(q);break;}}
  }
  return shuffle(qs);
}
function newEx(){V.ex={scope:V.scope,type:V.exType,qs:genEx(V.scope,V.exType,10),i:0,score:0};}

     ${q.res===undefined?`<div class="row" style="margin-top:8px"><button class="btn pri" data-act="exBuildCheck" ${q.pool.length?"disabled":""}>Prüfen</button></div>`:""}`;
    if(q.res!==undefined)q.fb=`<b>${esc(q.it.idn)}</b> <button class="btn sm" data-act="exPlay">🔊</button>`;
  }
  if(q.t==="trans"){

  $("#view").innerHTML=`<h2>Üben</h2>${voiceWarning()}${cfg}<div class="small" style="margin-bottom:6px">Aufgabe ${e.i+1}/${e.qs.length} · Punkte ${e.score}</div><div class="card">${body}</div>${fb()}`;

async function diagMic(){
  const m=document.getElementById("diagmsg");
  if(!navigator.mediaDevices||!window.MediaRecorder){m.textContent="❌ Aufnahme wird hier nicht unterstützt.";return;}
  try{
    const st=await getMic({audio:true}),mime=pickMime();

    const ch=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data);};

      if(DIAG.url){try{URL.revokeObjectURL(DIAG.url);}catch(e){}}DIAG.url=b.size?URL.createObjectURL(b):null;

      const bt=document.getElementById("diagplay");if(bt)bt.disabled=!DIAG.url;};

}

/* ===================== TUTOR (KI-Gespräch mit Abgleich) ===================== */
const AK_KEY=CFG.key+"_apikey";
function getAK(){try{return localStorage.getItem(AK_KEY)||"";}catch(e){return "";}}
function setAK(v){try{if(v)localStorage.setItem(AK_KEY,v);else localStorage.removeItem(AK_KEY);}catch(e){}}
const CHAT_TOPICS=[["tutor","Geführter Tutor (aktuelle Lektion)","a guided tutoring session"],["free","Freies Gespräch","a relaxed free conversation about everyday topics"],["cafe","Im Café bestellen","a role-play: you are a waiter in a café and the learner is the guest"],["intro","Sich vorstellen","a role-play: you meet the learner for the first time at a party and chat"],["travel","Reise & Wegbeschreibung","a role-play: the learner is travelling and asks you for directions and tips"],["work","Arbeit & Alltag","a conversation about work, daily routine and hobbies"],["opinion","Meinungen austauschen","a conversation where you and the learner exchange opinions on a simple topic"]];
V.chat={msgs:[],level:(S.level||"A2"),topic:"tutor",busy:false,err:"",auto:true,goal:null};
function chatUnit(){return UNIT(V.unit||nextUnit().id);}
function placeSystem(){
  const n=V.chat.msgs.filter(m=>m.role==="user").length;
  return "You are a friendly placement examiner for a learner of "+CFG.lname+" whose native language is "+CFG.nname+". Goal: find out the learner's CEFR level (A1, A2, B1 or B2) with about 7 short questions asked ONE at a time in a chat. Start with a very easy question in simple "+CFG.lname+" (A1: name, where from). Make each next question a little harder or easier depending on how well the learner answered (A2: yesterday, daily routine, shopping; B1: plans, experiences, a simple 'if' situation; B2: opinion with reasons, hypothetical situations, abstract topics). Do NOT correct mistakes during the test and give no teaching. Write only 1-2 short sentences per message. The learner has answered "+n+" question(s) so far. "+(n>=7?"Now stop asking: write in "+CFG.nname+" a short friendly verdict (2 sentences, mention strengths), and put on the very last line exactly 'LEVEL: X' where X is A1, A2, B1 or B2.":"Do not write 'LEVEL:' yet.")+" If the learner writes in "+CFG.nname+" or says they know nothing, treat it as A1 and give the verdict after at most 3 questions.";
}
function chatSystem(){
  if(needPlace())return placeSystem();
  const t=CHAT_TOPICS.find(x=>x[0]===V.chat.topic)||CHAT_TOPICS[0];
  let topic="Topic: "+t[2]+".";
  if(t[0]==="tutor"){
    const u=chatUnit();
    topic="Mode: GUIDED TUTOR. You guide the learner step by step through this lesson: \""+u.t+"\" (grammar: "+u.grammar.t+"). Key words: "+u.vocab.slice(0,14).map(v=>v[0]+" = "+v[1]).join("; ")+". Model sentences: "+u.sent.slice(0,6).map(v=>v[0]+" = "+v[1]).join("; ")+". Procedure: first greet briefly and say in "+CFG.nname+" what you will practise; then introduce ONE phrase at a time (give it on a 🎯 line), ask the learner to say it, react to what they said, correct it kindly, then move on to the next phrase or a small question that makes them build their own sentence from the lesson words. Praise progress. Keep every turn short.";
  }
  return "You are a friendly, patient "+(t[0]==="tutor"?"tutor and ":"")+"conversation partner for a learner of "+CFG.lname+". The learner's native language is "+CFG.nname+" and their level is "+V.chat.level+". "+topic+" Rules: Answer in "+CFG.lname+" with vocabulary and grammar suited to the level, 1-3 short sentences, ending with a short question or task so the conversation continues (explanations of the lesson in tutor mode may use "+CFG.nname+" in one short sentence). After your answer you may add extra lines, each on its own line at the very end and each starting with its symbol: '🎯 ' + one short phrase in "+CFG.lname+" that the learner should repeat or say next (always in tutor mode); '✏️ ' + the learner's last message corrected in "+CFG.lname+" (ONLY if it contained mistakes); '💡 ' + a brief tip in "+CFG.nname+" (max 2 sentences, only if useful). No markdown, no lists, no other emojis.";
}
function chatParse(raw){
  const out={text:[],goal:"",corr:"",tip:""};
  raw.split("\n").forEach(l=>{const t=l.trim();if(!t)return;
    if(t.startsWith("🎯"))out.goal=t.slice(2).trim();else if(t.startsWith("✏️"))out.corr=t.slice(2).trim();else if(t.startsWith("✏"))out.corr=t.slice(1).trim();else if(t.startsWith("💡"))out.tip=t.slice(2).trim();else out.text.push(t);});
  return {text:out.text.join(" "),goal:out.goal,corr:out.corr,tip:out.tip};
}
async function chatAsk(){
  const C=V.chat;C.busy=true;C.err="";render();
  const msgs=[{role:"user",content:"(Please start now.)"}].concat(C.msgs.map(m=>({role:m.role,content:m.raw||m.text})));
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":getAK(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-haiku-5-5",max_tokens:500,system:chatSystem(),messages:msgs})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){C.err=r.status===401?"Der API-Schlüssel wurde abgelehnt. Prüfe ihn.":"Fehler der KI ("+r.status+"): "+((j.error&&j.error.message)||"");}
    else{
      const raw=((j.content||[]).map(b=>b.text||"").join("")).trim();
      if(needPlace()){
        const mm=raw.match(/LEVEL:\s*(A1|A2|B1|B2)/);
        if(mm){S.level=mm[1];S.placed=Date.now();save();C.level=S.level;V.cards=null;V.ex=null;C.result={lvl:mm[1],text:raw.replace(/LEVEL:\s*(A1|A2|B1|B2)/,"").trim()};C.msgs=[];C.busy=false;render();return;}
        C.msgs.push({role:"assistant",text:raw,raw});C.speakIdx=C.msgs.length-1;C.busy=false;render();
        if(C.auto)speak(raw,.9);
        return;
      }
      const p=chatParse(raw);
      // Abgleich der letzten Nutzernachricht
      const lu=C.msgs.length?C.msgs[C.msgs.length-1]:null;
      if(lu&&lu.role==="user"){
        const target=C.goal||p.corr;
        if(lu.spoken){
          if(target){const ev=evaluate(target,[lu.text]);lu.cmp={target,score:ev.score,words:ev.words};}
          else lu.cmp={target:lu.text,score:100,words:null};
        }
        if(p.corr)lu.corr=p.corr;
      }
      C.goal=p.goal||null;
      C.msgs.push({role:"assistant",text:p.text,goal:p.goal,tip:p.tip,raw});C.speakIdx=C.msgs.length-1;addXp(2);
    }
  }catch(e){C.err="Keine Verbindung zur KI: "+((e&&e.message)||e);}
  C.busy=false;render();
  if(!C.err&&C.auto&&C.speakIdx!=null&&C.msgs[C.speakIdx])speak(C.msgs[C.speakIdx].text,.9);
}
function chatSend(txt,spoken){
  const C=V.chat;if(offline())return otHandle(txt,spoken);txt=(txt||"").trim();if(!txt||C.busy)return;
  C.msgs.push({role:"user",text:txt,spoken:!!spoken});chatAsk();
}
function chatListen(retryIdx){
  if(!SRC){V.chat.err=LT.srUnsup;render();return;}
  stopAudio();releaseAudio();
  const r=new SRC();r.lang=CFG.sr;r.interimResults=false;r.maxAlternatives=3;
  const st=$("#cstat");if(st)st.textContent="🎙 Ich höre zu …";
  let got=false;
  r.onresult=e=>{got=true;const alts=[];for(let k=0;k<e.results[0].length;k++)alts.push(e.results[0][k].transcript);
    if(retryIdx!=null){const m=V.chat.msgs[retryIdx];if(m&&m.cmp){const ev=evaluate(m.cmp.target,alts);m.cmp.retry={score:ev.score,words:ev.words};addXp(1);render();}}
    else chatSend(alts[0],true);};
  r.onerror=e=>{if(!got){V.chat.err="Spracherkennung: "+(e.error||"Fehler");render();}};
  r.onend=()=>{if(!got&&st)st.textContent="";};
  try{r.start();}catch(e){V.chat.err="Spracherkennung konnte nicht starten.";render();}
}

/* ===================== OFFLINE-TUTOR (ohne API) ===================== */
const stripG=t=>String(t).split(" – ")[0].trim();
const offline=()=>!(V.chat.useAI&&getAK());
function otUnit(){return UNIT(V.unit||nextUnit().id);}
function otStart(){
  const C=V.chat,u=otUnit();
  const vs=u.vocab.slice(0,6).map(v=>({t:"rep",goal:stripG(v[0]),gl:v[1]}));
  const ss=u.sent.slice(0,5).map(v=>({t:"rep",goal:v[0],gl:v[1]}));
  const tr=shuffle(u.sent.slice()).slice(0,3).map(v=>({t:"tr",goal:v[0],gl:v[1]}));
  const cl=shuffle((u.ex||[]).slice()).slice(0,3).map(c=>({t:"cl",p:c[0],a:c[1],o:shuffle(c[2].slice()),n:c[3]}));
  if(vs[0])vs[0].hdr="Beginnen wir mit den Wörtern.";if(ss[0])ss[0].hdr="Jetzt die ganzen Sätze – gebaut aus den Wörtern von eben.";if(tr[0])tr[0].hdr="Jetzt wird es aktiv: Übersetze in die Zielsprache.";if(cl[0])cl[0].hdr="Zum Schluss ein paar Lückensätze – wähle das passende Wort.";
  C.ot={mode:"tutor",q:vs.concat(ss,tr,cl),i:0,tries:0,right:0,n:0,done:false};C.msgs=[];C.err="";
  C.msgs.push({role:"assistant",text:"Willkommen! Heute üben wir: "+u.n+". "+u.t+". Ich führe dich Schritt für Schritt durch die Lektion – erst Wörter, dann Sätze, dann kleine Aufgaben. Sprich jede Vorgabe nach (Mikrofon oder tippen) – ich vergleiche sofort mit der richtigen Form."});
  otAsk();
}
function otAsk(){
  const C=V.chat,o=C.ot;
  if(o.i>=o.q.length){
    o.done=true;C.msgs.push({role:"assistant",text:"Geschafft! "+o.right+" von "+o.n+" Aufgaben richtig. Du kannst die Lektion jetzt vertiefen (Karten, Übungen) oder mit der nächsten weitermachen."});addXp(5);render();return;
  }
  const q=o.q[o.i];o.cur=q;o.tries=0;
  const pre=q.hdr?q.hdr+" ":"";
  if(q.t==="rep")C.msgs.push({role:"assistant",text:pre+"Sag nach: „"+q.gl+"“",goal:q.goal});
  if(q.t==="tr")C.msgs.push({role:"assistant",text:pre+"Übersetze: „"+q.gl+"“"});
  if(q.t==="cl")C.msgs.push({role:"assistant",text:pre+"Welches Wort passt? "+q.p,opts:q.o});
  render();
  if(q.t==="rep"&&C.auto)speak(q.goal,.9);
}
function otHandle(txt,spoken){
  const C=V.chat,o=C.ot;txt=(txt||"").trim();if(!txt||!o||o.done||o.mode==="place")return;
  if(o.mode==="talk"){talkHandle(txt,spoken);return;}
  const q=o.cur,um={role:"user",text:txt,spoken:!!spoken};C.msgs.push(um);
  const target=q.t==="cl"?q.a:q.goal;
  const ev=q.t==="cl"?{score:norm(txt)===norm(q.a)?100:0,words:null}:evaluate(target,[txt]);
  if(q.t!=="cl")um.cmp={target,score:ev.score,words:ev.words};
  if(q.t==="cl"&&o.opened)o.opened=false;
  if(ev.score>=85){o.n++;o.right++;addXp(2);C.msgs.push({role:"assistant",text:(q.t==="cl"?"Richtig! ✅ "+(q.n||""):"Sehr gut! ✅")});o.i++;otAsk();return;}
  if(o.tries<1&&q.t!=="cl"){
    o.tries++;const red=(ev.words||[]).filter(w=>w.s<.85).map(w=>w.w).join(", ");
    C.msgs.push({role:"assistant",text:"Fast – achte auf: "+(red||"…")+". Hör dir das Vorbild an und versuche es noch einmal.",goal:q.t==="rep"?q.goal:undefined});render();if(q.t==="rep"&&C.auto)speak(q.goal,.7);return;
  }
  o.n++;C.msgs.push({role:"assistant",text:(q.t==="cl"?"Nicht ganz – richtig ist: "+q.a+". "+(q.n||""):"Kein Problem – so heißt es richtig:"),goal:q.t==="cl"?undefined:target});o.i++;otAsk();
}

/* ===================== MINI-KI (selbstgebaut, ohne Internet) ===================== */
/* Lernt aus den App-Daten: Dialogzeilen (Frage -> Antwort), Vokabeln, Sätze, Grammatik. */
const MINI={built:false,lines:[],items:[]};
const mTok=t=>norm(t).split(" ").filter(Boolean);
function miniBuild(){
  if(MINI.built)return;MINI.built=true;
  UNITS.forEach(u=>{
    const L=u.dlg.lines;
    L.forEach((l,i)=>MINI.lines.push({u:u.id,i,spk:l[0],tgt:l[1],gl:l[2],tk:mTok(l[1]),gk:mTok(l[2]),L}));
  });
  ITEMS.forEach(x=>{const t=stripG(x.idn);MINI.items.push({u:x.u,k:x.k,tgt:t,gl:x.de,tk:mTok(t),gk:mTok(x.de)});});
}
function qScore(qt,ct){
  if(!qt.length||!ct.length)return 0;
  let p=0,r=0;
  for(const a of qt){let b=0;for(const c of ct){const v=a===c?1:sim(a,c);if(v>b)b=v;}p+=b;}
  for(const c of ct){let b=0;for(const a of qt){const v=a===c?1:sim(a,c);if(v>b)b=v;}r+=b;}
  p/=qt.length;r/=ct.length;return p+r?2*p*r/(p+r):0;
}
function miniBest(qt,arr,key){let best=null,bs=0;for(const c of arr){const v=qScore(qt,c[key]);if(v>bs){bs=v;best=c;}}return {c:best,s:bs};}
const RX={
 meaning:/^(?:was\s+(?:heißt|heisst|bedeutet|ist)|what\s+(?:does|is)|bedeutung\s+von|meaning\s+of)\s+(.+?)(?:\s+(?:heißt|heisst|bedeutet|mean|means))?\s*[?!.]*$/i,
 sayit:/^(?:wie\s+(?:sagt|sage|sag)\s+man|how\s+(?:do\s+(?:you|i)\s+say|to\s+say|can\s+i\s+say)|übersetze|uebersetze|translate)\s+(.+?)\s*[?!.]*$/i,
 example:/^(?:beispiel(?:e)?|satz|sätze|example(?:s)?|sentence(?:s)?)\s*(?:mit|für|with|for|using)?\s*(.*)$/i,
 grammar:/^(?:erkl[äa]r\w*|grammatik|regel|explain|grammar|rule|wie\s+funktioniert|how\s+does)\s*(.*)$/i,
 repeat:/^(?:nochmal|noch\s+einmal|wiederhol\w*|again|repeat|once\s+more)\b/i,
 slow:/^(?:langsam\w*|slow\w*)\b/i,
 whatmeant:/^(?:was\s+bedeutet\s+(?:das|dies)|übersetz\w*\s+das|what\s+does\s+(?:that|this)\s+mean|translate\s+(?:that|this)|und\s+auf\s+\w+|bedeutung|übersetzung|translation)\??$/i,
 dialog:/^(?:dialog\w*|rollenspiel\w*|role\s*-?\s*play\w*|let'?s\s+talk|sprechen\s+wir|gespr[äa]ch\s+(?:üben|starten))\b/i,
 stop:/^(?:stopp?|ende|beenden|exit|quit|abbrechen)\s*!?$/i,
 help:/^(?:hilfe|help|\?|was\s+kannst\s+du|what\s+can\s+you\s+do)\s*[?!]*$/i
};
function talkStart(){
  const C=V.chat;miniBuild();
  const u=otUnit();
  C.ot={mode:"talk",done:false,u:u.id,dlg:null,last:null};C.msgs=[];C.err="";
  C.msgs.push({role:"assistant",text:"Hallo! Ich bin dein Mini-Tutor – ein kleines Programm, das aus den Vokabeln, Sätzen und Dialogen dieser App gebaut ist. Frag mich zum Beispiel: „Was bedeutet …?“, „Wie sagt man …?“, „Erkläre die Grammatik“ oder „Beispiel mit …“. Sag einfach einen Satz in der Zielsprache – dann antworte ich. Mit „Dialog“ spielen wir ein Rollenspiel.",say:LT.greet().replace(/[!👋\s]+$/,"").trim(),gl:""});
  render();
}
function miniSay(C,text,say,gl,extra){
  const m=Object.assign({role:"assistant",text:text||"",say:say||"",gl:gl||""},extra||{});
  C.msgs.push(m);if(say)C.ot.last={say,gl:gl||""};
  render();
  if(say&&C.auto)speak(say,.9);
}
function stripHtml(h){return String(h).replace(/<br\s*\/?>/gi," ").replace(/<\/(tr|p|li)>/gi," · ").replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim();}
/* Bot spricht ab Zeile j alle Nicht-B-Zeilen, dann ist der Nutzer (B) dran */
function dlgAdvance(C,d,j){
  const o=C.ot,L=d.L;let say="",gl="";
  while(j<L.length&&L[j][0]!=="B"){say=L[j][1];gl=L[j][2];if(say){C.msgs.push({role:"assistant",text:"",say,gl});o.last={say,gl};}j++;}
  if(j>=L.length){o.dlg=null;C.msgs.push({role:"assistant",text:"Dialog geschafft! 🎉 Sag „Dialog“ für einen neuen."});addXp(5);render();if(say&&C.auto)speak(say,.9);return;}
  d.p=j;C.msgs.push({role:"assistant",text:"Du bist dran – antworte sinngemäß: „"+L[j][2]+"“"});render();if(say&&C.auto)speak(say,.9);
}
function talkHandle(txt,spoken){
  const C=V.chat,o=C.ot;miniBuild();
  const um={role:"user",text:txt,spoken:!!spoken};C.msgs.push(um);
  const q=txt.trim(),qt=mTok(q);let m;
  // laufendes Rollenspiel
  if(o.dlg){
    if(RX.stop.test(q)){o.dlg=null;miniSay(C,"Dialog beendet. Frag mich etwas oder sag „Dialog“ für einen neuen.");return;}
    const d=o.dlg,exp=d.L[d.p];
    const ev=evaluate(exp[1],[q]);um.cmp={target:exp[1],score:ev.score,words:ev.words};
    if(ev.score>=85)addXp(2);
    dlgAdvance(C,d,d.p+1);return;
  }
  if(RX.stop.test(q)){miniSay(C,"Okay. Frag mich etwas oder sag „Dialog“ für ein Rollenspiel.");return;}
  if(RX.help.test(q)){miniSay(C,"Ich kann: Bedeutungen („Was bedeutet …?“), Übersetzungen („Wie sagt man …?“), Beispiele („Beispiel mit …“), Grammatik („Erkläre die Grammatik“), Wiederholen („nochmal“, „langsam“), Rollenspiele („Dialog“) – und ich antworte auf Sätze, die du in der Zielsprache sagst.");return;}
  if(RX.dialog.test(q)){
    const u=otUnit(),L=u.dlg.lines,d={L,p:0};o.dlg=d;
    miniSay(C,"Gut, spielen wir: „"+u.dlg.t+"“. Du bist Person B.");
    dlgAdvance(C,d,0);return;
  }
  if(RX.repeat.test(q)||RX.slow.test(q)){
    if(!o.last){miniSay(C,"Ich habe noch nichts gesagt, das ich wiederholen könnte.");return;}
    const slow=RX.slow.test(q);miniSay(C,"Gerne – noch einmal"+(slow?" langsam":"")+":");
    speak(o.last.say,slow?.55:.9);C.msgs[C.msgs.length-1].say=o.last.say;C.msgs[C.msgs.length-1].gl=o.last.gl;render();return;
  }
  if(RX.whatmeant.test(q)){
    if(!o.last){miniSay(C,"Dazu habe ich noch nichts gesagt.");return;}
    miniSay(C,"Das bedeutet: „"+(o.last.gl||"–")+"“");return;
  }
  if((m=q.match(RX.example))){
    const w=m[1].trim()||(o.last?o.last.say:"");const wt=mTok(w);
    const hits=[];
    if(wt.length){MINI.items.filter(x=>x.k==="s").forEach(x=>{const tk=x.tk;const sc=Math.max(...wt.map(a=>Math.max(...tk.map(c=>a===c?1:sim(a,c)))));if(sc>=.85)hits.push(x);});}
    if(!hits.length){miniSay(C,"Dazu habe ich keinen Beispielsatz gefunden.");return;}
    const h=shuffle(hits).slice(0,3);
    miniSay(C,"Beispiele mit „"+w+"“:");
    h.forEach(x=>C.msgs.push({role:"assistant",text:"",say:x.tgt,gl:x.gl}));o.last={say:h[0].tgt,gl:h[0].gl};render();return;
  }
  if((m=q.match(RX.grammar))){
    const SW=new Set(["die","der","das","den","dem","zu","zum","zur","über","von","für","the","of","about","for","to","on","grammatik","grammar","regel","regeln","rule","rules","bitte","please","mir","me","an","in"]);const w=mTok(m[1]).filter(x=>!SW.has(x));let u=otUnit();
    if(w.length){let bs=0;UNITS.forEach(x=>{const sc=qScore(w,mTok(x.grammar.t+" "+x.t));if(sc>bs){bs=sc;u=x;}});if(bs<.3)u=otUnit();}
    const txtg=stripHtml(u.grammar.html);
    miniSay(C,"Grammatik – "+u.grammar.t+" (Lektion "+u.n+"): "+(txtg.length>700?txtg.slice(0,700)+" …":txtg));return;
  }
  if((m=q.match(RX.sayit))){
    const r=miniBest(mTok(m[1]),MINI.items,"gk");
    if(r.s>=.75){miniSay(C,"So sagt man „"+m[1]+"“:",r.c.tgt,r.c.gl);return;}
  }
  if((m=q.match(RX.meaning))){
    const r=miniBest(mTok(m[1]),MINI.items,"tk");
    if(r.s>=.6){miniSay(C,"„"+r.c.tgt+"“ bedeutet: „"+r.c.gl+"“",r.c.tgt,r.c.gl);return;}
    const r2=miniBest(mTok(m[1]),MINI.items,"gk");
    if(r2.s>=.7){miniSay(C,"Auf Deutsch: „"+m[1]+"“ – so sagt man es:",r2.c.tgt,r2.c.gl);return;}
  }
  // Gespräch: Eingabe gegen Dialogzeilen abgleichen und die Folgezeile als Antwort geben
  const bl=miniBest(qt,MINI.lines,"tk"),bi=miniBest(qt,MINI.items,"tk"),bn=miniBest(qt,MINI.items,"gk");
  const tgtScore=Math.max(bl.s,bi.s);
  if(bn.s>tgtScore+.1&&bn.s>=.65){miniSay(C,"So sagt man das:",bn.c.tgt,bn.c.gl);return;}
  if(bl.s>=.5&&bl.s>=bi.s-.05){
    const c=bl.c;
    if(bl.s<.999){const ev=evaluate(c.tgt,[q]);um.cmp={target:c.tgt,score:ev.score,words:ev.words};}
    let reply=c.L[c.i+1]&&c.L[c.i+1][0]!==c.spk?c.L[c.i+1]:(c.L[c.i-1]&&c.L[c.i-1][0]!==c.spk?c.L[c.i-1]:null);
    if(!reply)reply=c.L[c.i+1]||c.L[c.i-1];
    if(reply){miniSay(C,bl.s<.85?"Meintest du: „"+c.tgt+"“? Dann würde ich so antworten:":"Meine Antwort:",reply[1],reply[2]);addXp(1);return;}
  }
  if(bi.s>=.7){
    const c=bi.c;const ev=evaluate(c.tgt,[q]);um.cmp={target:c.tgt,score:ev.score,words:ev.words};
    miniSay(C,"„"+c.tgt+"“ bedeutet: „"+c.gl+"“",c.tgt,c.gl);return;
  }
  miniSay(C,"Das habe ich nicht verstanden. Probiere: „Was bedeutet …?“, „Wie sagt man …?“, „Beispiel mit …“, „Erkläre die Grammatik“ oder sag einen Satz aus der Lektion. Mit „Dialog“ starten wir ein Rollenspiel.");
}

/* Einstufung ohne KI: Auswahlaufgaben, vom Leichten zum Schweren */
function otPlaceStart(){
  const C=V.chat;C.err="";C.msgs=[];
  C.ot={mode:"place",li:0,k:0,right:[0,0,0,0],qs:[],cur:null,done:false};
  C.msgs.push({role:"assistant",text:"Los geht's: kurze Aufgaben, vom Leichten zum Schweren. Wähle jeweils die richtige Lösung. Bei Unsicherheit wähle „Ich weiß nicht“ – das ist völlig okay."});
  otPlaceAsk();
}
function otPlaceAsk(){
  const C=V.chat,o=C.ot;
  if(!o.qs.length||o.k===0){
    const pool=[];UNITS.filter(u=>u.lvl===LEVELS[o.li]).forEach(u=>(u.ex||[]).forEach(c=>pool.push(c)));
    o.qs=shuffle(pool).slice(0,3);
  }
  const c=o.qs[o.k];
  if(!c){otPlaceDone(o.li);return;}
  o.cur=c;
  C.msgs.push({role:"assistant",text:"Frage "+(o.li*3+o.k+1)+" · "+LEVELS[o.li]+": "+c[0],opts:shuffle(c[2].slice()).concat(["Ich weiß nicht"])});
  render();
}
function otPlaceDone(li,all){
  const C=V.chat;
  S.level=LEVELS[li];S.placed=Date.now();save();V.cards=null;V.ex=null;C.level=S.level;
  const txt=all?"Stark! Du hast alle Stufen sicher gelöst – du startest bei "+S.level+".":(li===0?"Du startest ganz von vorn bei A1 – perfekt für den Einstieg.":"Die Aufgaben der Stufe "+S.level+" waren noch nicht ganz sicher – dort beginnst du.");
  C.result={lvl:S.level,text:txt};C.msgs=[];C.ot=null;render();
}
function otPick(i){
  const C=V.chat,o=C.ot;if(!o)return;
  const last=C.msgs[C.msgs.length-1];if(!last||!last.opts)return;
  const val=last.opts[i];
  if(o.mode==="place"){
    C.msgs.push({role:"user",text:val});
    const ok=norm(val)===norm(o.cur[1]);if(ok)o.right[o.li]++;
    o.k++;
    if(o.k>=3){
      if(o.right[o.li]>=2){if(o.li>=3){otPlaceDone(3,true);return;}o.li++;o.k=0;o.qs=[];}
      else{otPlaceDone(o.li);return;}
    }
    otPlaceAsk();return;
  }
  last.opts=null;otHandle(val,false);
}

   case"exTake":{const q=V.ex.qs[V.ex.i];const c=q.pool.splice(+dsx.k,1)[0];q.ans.push(c);render();break;}
   case"exDrop":{const q=V.ex.qs[V.ex.i];if(q.res!==undefined)break;const c=q.ans.splice(+dsx.k,1)[0];q.pool.push(c);render();break;}
   case"exBuildCheck":{const q=V.ex.qs[V.ex.i];exFinish(q,norm(q.ans.map(c=>c.w).join(" "))===norm(q.it.idn));break;}
   case"exTransCheck":exTransCheck();break;
   case"exSkip":{const q=V.ex.qs[V.ex.i];q.typed="";exFinish(q,false);break;}
   case"exNext":V.ex.i++;render();break;
   case"diagSpeakOn":unlockAudio();speakOnline(LT.testSent,.95).then(ok=>{if(!ok)toast("Online-Stimme nicht erreichbar oder blockiert (siehe Protokoll).");});break;
   case"diagSpeakDef":unlockAudio();speak("Hello. This is a test of the speech output.",1,1,true);break;
   case"diagSpeak":unlockAudio();speak(LT.testSent,.9);break;
   case"diagMic":diagMic();break;
   case"diagPlay":if(DIAG.url)playAud(DIAG.url);break;
   case"hideIos":S.hideIos=true;save();render();break;
   case"bkCopy":{const txt=JSON.stringify(S),msg=document.getElementById("bkmsg");
     const ok=()=>{S.lastBackup=Date.now();save();msg.textContent="✅ Kopiert. Füge den Text z. B. in Notizen ein und bewahre ihn auf.";};
     const fallback=()=>{const b=document.getElementById("bk");try{b.value=txt;b.focus();b.select();b.setSelectionRange(0,txt.length);document.execCommand("copy")?ok():(msg.textContent="Bitte den markierten Text unter „Sicherungstext anzeigen“ manuell kopieren.");}catch(x){msg.textContent="Bitte den Text unter „Sicherungstext anzeigen“ manuell kopieren.";}};
     try{navigator.clipboard.writeText(txt).then(ok,fallback);}catch(x){fallback();}break;}
   case"bkFile":{try{const blob=new Blob([JSON.stringify(S)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");
     a.href=u;a.download="belajar-sicherung-"+today()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1500);
     S.lastBackup=Date.now();save();document.getElementById("bkmsg").textContent="✅ Datei wird gespeichert (auf dem iPhone: in „Dateien“ sichern).";}catch(x){document.getElementById("bkmsg").textContent="Download nicht möglich – nutze „In Zwischenablage kopieren“.";}break;}
   case"bkImport":{try{const o=JSON.parse(document.getElementById("bk").value);if(!o||typeof o!=="object"||!o.box)throw 0;S=Object.assign(S,o);save();document.getElementById("bkmsg").textContent="✅ Importiert.";render();}catch(x){document.getElementById("bkmsg").textContent="❌ Ungültige Sicherung.";}break;}
   case"reset":{if(dsx.sure){S={box:{},due:{},xp:0,last:"",streak:0,bestStreak:0,best:{},hist:{},day:null,goal:60,newPerDay:10,cmode:"id2de",ckinds:"vs",totalCards:0,totalSpeak:0};save();render();}else{t.dataset.sure="1";t.textContent="Wirklich löschen? (nochmal klicken)";}break;}
  }
});
function playDlg(u){
  playDialog(u,i=>{document.querySelectorAll(".bub").forEach((b,k)=>b.classList.toggle("on",k===i));});
}
document.addEventListener("change",e=>{
  const k=e.target.dataset.sel,c=e.target.dataset.chk,v=e.target.value;
  if(e.target.dataset.file==="bk"){
    const f=e.target.files&&e.target.files[0];if(!f)return;const fr=new FileReader();
    fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||typeof o!=="object"||!o.box)throw 0;S=Object.assign(S,o);save();render();const m=document.getElementById("bkmsg");if(m)m.textContent="✅ Sicherung geladen.";}catch(x){const m=document.getElementById("bkmsg");if(m)m.textContent="❌ Datei ist keine gültige Sicherung.";}};
    fr.readAsText(f);return;
  }
  if(c==="hideT"){V.hideT=e.target.checked;render();return;}
  if(!k)return;
  if(k==="scope"){V.scope=v;V.cards=null;V.ex=null;V.hear.q=null;render();}
  if(k==="cmode"){S.cmode=v;save();V.cards&&(V.cards.spoken=false,V.cards.flip=false);render();}
  if(k==="ckinds"){S.ckinds=v;save();V.cards=null;render();}
  if(k==="extype"){V.exType=v;V.ex=null;render();}
  if(k==="spunit"){V.sp.unit=v;V.sp.i=0;Rec.stop(true);render();}
  if(k==="spkind"){V.sp.kind=v;V.sp.i=0;Rec.stop(true);render();}
  if(k==="rpunit"){V.rp={u:v,role:V.rp.role,i:0,scores:[],played:{},done:false};stopAudio();SP._rpIdx=-1;render();}
  if(k==="rprole"){V.rp={u:V.rp.u,role:v,i:0,scores:[],played:{},done:false};stopAudio();SP._rpIdx=-1;render();}
  if(k==="hdlg"){V.hear.dlgU=v;stopAudio();render();}
  if(k==="ttsmode"){S.ttsMode=v;S.ttsAutoOnline=false;save();unlockAudio();speak(LT.testSent,.9);}
  if(k==="voice"){S.voiceURI=v||undefined;save();unlockAudio();speak(LT.testSent,.9);}
  if(k==="recmode"){Rec.stop(true);S.recMode=v;save();render();}
  if(k==="goal"){S.goal=+v;save();render();}
  if(k==="newpd"){S.newPerDay=+v;save();}
});
document.addEventListener("keydown",e=>{
  if(V.tab!=="cards"||!V.cards||V.cards.i>=V.cards.q.length)return;
  if(/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||""))return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();if(!V.cards.flip){V.cards.flip=true;render();}}
  else if(V.cards.flip&&["1","2","3"].includes(e.key))rateCard(+e.key-1);
});
document.addEventListener("pointerdown",()=>{if(!audUnlocked)unlockAudio();},{passive:true});
window.addEventListener("beforeunload",()=>{try{speechSynthesis.cancel();}catch(e){}});
header();render();
idbLoad().then(raw=>{if(!raw)return;try{const o=JSON.parse(raw);if((o.ts||0)>(S.ts||0)&&o.box){S=Object.assign(S,o);header();render();}}catch(e){}});

</script>
