.tabs2 button.on{background:var(--glass);box-shadow:0 1px 0 var(--edge) inset,0 3px 10px -5px rgba(0,0,0,.35);color:var(--ink);font-weight:650}
details{margin-bottom:10px}
summary{cursor:pointer;font-weight:600;padding:8px 2px}
.chart{display:flex;align-items:flex-end;gap:6px;height:90px}
.chart div{flex:1;background:linear-gradient(180deg,var(--red),color-mix(in srgb,var(--red) 55%,#ffb0a8));border-radius:8px 8px 3px 3px;min-height:3px}
.ring{display:flex;align-items:center;gap:12px}
.check{font-size:20px;margin-right:6px}
.tip li{margin:6px 0}
.toast{position:fixed;left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:rgba(30,30,36,.82);color:#fff;padding:14px 18px;border-radius:22px;z-index:50;font-size:14px;display:none;border:1px solid rgba(255,255,255,.18);box-shadow:0 14px 36px rgba(0,0,0,.4);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}

 .card,.btn,nav,header,.bub,select,input[type=text],input[type=password],.tabs2{background:var(--card)}
}

.chatbar .btn{flex:none}

U({id:"a1-01",lvl:"A1",e:"👋",t:"Greetings & Introductions",
 intro:"Your first sentences in German: greeting people, introducing yourself and being polite.",
 grammar:{t:"sein (to be) and the verb in position 2",html:`
<table class="g"><tr><th>Person</th><th>sein</th></tr>
<tr><td>ich</td><td><b>bin</b></td></tr><tr><td>du</td><td><b>bist</b></td></tr><tr><td>er / sie / es</td><td><b>ist</b></td></tr>
<tr><td>wir</td><td><b>sind</b></td></tr><tr><td>ihr</td><td><b>seid</b></td></tr><tr><td>sie / Sie</td><td><b>sind</b></td></tr></table>
<p><b>du</b> = informal (friends, family, children); <b>Sie</b> (capital S) = formal (strangers, work).</p>
<p><b>Word order:</b> In a statement the verb is always in <b>position 2</b>: <i>Ich komme aus Spanien.</i> / <i>Aus Spanien komme ich.</i> In a question with a question word it is also position 2: <i>Woher kommst du?</i> In a yes/no question the verb is first: <i>Bist du Lehrer?</i></p>
<p><b>Regular verbs:</b> ich komm<b>e</b>, du komm<b>st</b>, er komm<b>t</b>, wir komm<b>en</b>, ihr komm<b>t</b>, sie komm<b>en</b>.</p>`},

U({id:"a1-02",lvl:"A1",e:"🔢",t:"Numbers, Days & Time",
 intro:"Numbers, days of the week, months and telling the time are essential in everyday life.",
 grammar:{t:"Numbers and telling time",html:`
<p>1 <b>eins</b>, 2 <b>zwei</b>, 3 <b>drei</b>, 4 <b>vier</b>, 5 <b>fünf</b>, 6 <b>sechs</b>, 7 <b>sieben</b>, 8 <b>acht</b>, 9 <b>neun</b>, 10 <b>zehn</b>, 11 <b>elf</b>, 12 <b>zwölf</b>, 20 <b>zwanzig</b>, 100 <b>hundert</b>.</p>
<p><b>21–99:</b> units first, then tens: <i>einundzwanzig</i> (one-and-twenty), <i>dreiundvierzig</i>.</p>
<p><b>Time:</b> <i>Es ist drei Uhr.</i> / <i>halb vier</i> = 3:30 (half <b>to</b> four!) / <i>Viertel nach drei</i> / <i>Viertel vor vier</i> / <i>fünf nach drei</i>.</p>
<p><b>Prepositions:</b> <i>um</i> 8 Uhr (at), <i>am</i> Montag (on), <i>im</i> Mai (in).</p>`},

U({id:"a1-03",lvl:"A1",e:"👨‍👩‍👧",t:"Family & People",

<p>German nouns have three genders: <b>der</b> (masculine), <b>die</b> (feminine), <b>das</b> (neuter). Plural: <b>die</b>. Always learn a noun with its article!</p>
<table class="g"><tr><th>Person</th><th>my / your …</th></tr>
<tr><td>ich</td><td><b>mein</b></td></tr><tr><td>du</td><td><b>dein</b></td></tr><tr><td>er / es</td><td><b>sein</b></td></tr><tr><td>sie</td><td><b>ihr</b></td></tr><tr><td>wir</td><td><b>unser</b></td></tr><tr><td>ihr</td><td><b>euer</b></td></tr><tr><td>sie / Sie</td><td><b>ihr / Ihr</b></td></tr></table>
<p>Possessives take the same endings as <b>ein</b>: <i>mein Bruder</i> (masc.), <i>meine Schwester</i> (fem.), <i>mein Kind</i> (neut.), <i>meine Eltern</i> (pl.).</p>

U({id:"a1-04",lvl:"A1",e:"🍎",t:"Food & Drink, the Accusative",
 intro:"Ordering food, talking about what you like and the first important case: the accusative.",
 grammar:{t:"The accusative case (direct object)",html:`
<p>The direct object (what is eaten, bought, seen …) is in the <b>accusative</b>. Only the <b>masculine</b> changes:</p>

<tr><td>feminine</td><td>die / eine Banane</td><td>die / eine Banane</td></tr>
<tr><td>neuter</td><td>das / ein Brot</td><td>das / ein Brot</td></tr>
<tr><td>plural</td><td>die Äpfel</td><td>die Äpfel</td></tr></table>
<p><i>Ich esse einen Apfel.</i> – <i>Ich möchte ein Brot.</i> <b>kein</b> = not a / no: <i>Ich habe keinen Hunger.</i></p>

U({id:"a1-05",lvl:"A1",e:"⏰",t:"Daily Routine & Separable Verbs",

 grammar:{t:"Separable verbs",html:`
<p>Many verbs have a prefix that jumps to the <b>end of the sentence</b>: <i>aufstehen</i> → <i>Ich stehe um sieben <b>auf</b>.</i></p>
<table class="g"><tr><th>Infinitive</th><th>Sentence</th></tr>
<tr><td>aufstehen</td><td>Ich <b>stehe</b> um 7 Uhr <b>auf</b>.</td></tr>
<tr><td>einkaufen</td><td>Wir <b>kaufen</b> im Supermarkt <b>ein</b>.</td></tr>
<tr><td>fernsehen</td><td>Er <b>sieht</b> abends <b>fern</b>.</td></tr>
<tr><td>anrufen</td><td>Sie <b>ruft</b> mich <b>an</b>.</td></tr></table>
<p><b>Stem-changing verbs:</b> <i>schlafen → er schläft</i>, <i>essen → er isst</i>, <i>fahren → er fährt</i>, <i>sehen → er sieht</i>.</p>

<p>For <b>location</b> (<i>Wo?</i>) prepositions like <b>in, auf, neben, unter, über, vor, hinter, zwischen, an</b> take the <b>dative</b>:</p>

U({id:"a1-07",lvl:"A1",e:"🛍️",t:"Shopping & Prices",
 intro:"In shops: asking prices, sizes, colours and paying.",

U({id:"a1-09",lvl:"A1",e:"🧭",t:"Directions & the Dative",
 intro:"Asking the way, understanding directions and the prepositions that always take the dative.",
 grammar:{t:"Imperative and fixed dative prepositions",html:`
<p><b>Imperative (formal Sie):</b> verb first + Sie: <i>Gehen Sie geradeaus.</i> <i>Biegen Sie links ab.</i> <i>Entschuldigen Sie, …</i> Informal: <i>Geh geradeaus!</i></p>
<p><b>Always dative:</b> <b>aus, bei, mit, nach, seit, von, zu</b> (also <i>gegenüber</i>):</p>
<ul><li><i>Ich fahre mit dem Bus.</i> (der Bus → dem)</li><li><i>Wie komme ich zum Bahnhof?</i> (zu dem = zum)</li><li><i>Gehen Sie nach links / nach rechts.</i></li><li><i>Das Café ist gegenüber der Bank.</i></li></ul>

U({id:"a1-10",lvl:"A1",e:"🌦️",t:"Weather, Seasons & Word Order",
 intro:"Talking about the weather and getting the basic sentence structure right: main clauses with und, aber, oder, denn.",
 grammar:{t:"Conjunctions that don't change word order",html:`
<p><b>und, aber, oder, denn, sondern</b> connect two main clauses without changing the word order (position 0):</p>
<ul><li><i>Es regnet, <b>aber</b> ich gehe spazieren.</i></li><li><i>Ich bleibe zu Hause, <b>denn</b> es ist kalt.</i></li><li><i>Es ist nicht warm, <b>sondern</b> kalt.</i></li></ul>
<p><b>Weather:</b> <i>Es regnet. Es schneit. Die Sonne scheint. Es ist windig / kalt / heiß.</i></p>
<p><b>Seasons:</b> <i>der Frühling, der Sommer, der Herbst, der Winter</i> – <i>im Winter</i> (in winter).</p>
<p><b>Inverted order:</b> If something other than the subject starts the sentence, the verb stays in position 2: <i>Heute regnet es.</i> / <i>Im Sommer ist es heiß.</i></p>`},

U({id:"a2-11",lvl:"A2",e:"⏪",t:"Perfect Tense with haben",
 intro:"Talking about the past in everyday German: the Perfekt is the spoken past tense.",
 grammar:{t:"Perfekt = haben + past participle",html:`
<p>The <b>Perfekt</b> is used in conversation. <b>haben</b> (conjugated, position 2) + <b>past participle</b> (at the end): <i>Ich <b>habe</b> Fußball <b>gespielt</b>.</i></p>
<table class="g"><tr><th>Type</th><th>Participle</th><th>Example</th></tr>

U({id:"a2-16",lvl:"A2",e:"🔮",t:"Future, Plans & Subordinate Clauses",
 intro:"Talking about plans and reasons: the future with werden and the first subordinate clauses (weil, dass, wenn).",
 grammar:{t:"werden, weil / dass / wenn",html:`
<p><b>Future:</b> often just present + time word: <i>Morgen fahre ich nach Berlin.</i> With <b>werden</b> (for predictions/promises): <i>Ich werde dir helfen.</i> – <i>Es wird morgen regnen.</i></p>
<table class="g"><tr><th>werden</th></tr><tr><td>ich werde, du wirst, er wird, wir werden, ihr werdet, sie werden</td></tr></table>
<p><b>Subordinate clauses</b> send the <b>conjugated verb to the end</b>:</p>
<ul><li><b>weil</b> (because): <i>Ich bleibe zu Hause, weil ich krank <b>bin</b>.</i></li><li><b>dass</b> (that): <i>Ich glaube, dass er <b>kommt</b>.</i></li><li><b>wenn</b> (if/when): <i>Wenn es regnet, <b>bleibe</b> ich zu Hause.</i> (verb right after the comma in the main clause!)</li></ul>`},

U({id:"b1-21",lvl:"B1",e:"🔗",t:"Relative Clauses",
 intro:"Adding information with der / die / das and other relative pronouns.",
 grammar:{t:"Relative pronouns and verb at the end",html:`
<table class="g"><tr><th>Case</th><th>masc.</th><th>fem.</th><th>neut.</th><th>plural</th></tr>
<tr><td>Nom.</td><td>der</td><td>die</td><td>das</td><td>die</td></tr>
<tr><td>Acc.</td><td>den</td><td>die</td><td>das</td><td>die</td></tr>
<tr><td>Dat.</td><td>dem</td><td>der</td><td>dem</td><td>denen</td></tr>
<tr><td>Gen.</td><td>dessen</td><td>deren</td><td>dessen</td><td>deren</td></tr></table>
<p>The pronoun matches the <b>gender and number of the noun</b>, its <b>case</b> depends on the role in the relative clause. The verb goes <b>to the end</b>; set it off with commas:</p>
<ul><li><i>Der Mann, <b>der</b> neben uns wohnt, ist Arzt.</i> (subject → nom.)</li><li><i>Das Buch, <b>das</b> ich lese, ist spannend.</i> (object → acc.)</li><li><i>Die Frau, <b>der</b> ich geholfen habe, ist nett.</i> (dative: helfen)</li><li><i>Der Junge, <b>dessen</b> Fahrrad gestohlen wurde, ist traurig.</i> (genitive)</li><li><i>Die Stadt, <b>in der</b> ich wohne, ist klein.</i> (with preposition)</li></ul>`},

U({id:"b1-23",lvl:"B1",e:"✂️",t:"Infinitive with zu & um … zu",
 intro:"Infinitive clauses: when to use zu, and how to express purpose with um … zu.",
 grammar:{t:"zu + infinitive",html:`
<p>Many verbs/adjectives are followed by an <b>infinitive with zu</b> (at the end, separated by a comma when it has additions):</p>
<ul><li><i>Ich habe vergessen, dich <b>anzurufen</b>.</i> (separable verbs: <i>an<b>zu</b>rufen</i>)</li><li><i>Es ist schwer, Deutsch <b>zu lernen</b>.</i></li><li><i>Ich habe keine Lust, heute <b>zu arbeiten</b>.</i></li><li><i>Er hat angefangen, <b>zu kochen</b>.</i></li></ul>
<p><b>um … zu</b> (in order to) – same subject in both clauses: <i>Ich lerne Deutsch, <b>um</b> in Deutschland <b>zu</b> arbeiten.</i> If the subjects differ: <b>damit</b> + full clause.</p>
<p><b>(an)statt … zu</b> (instead of), <b>ohne … zu</b> (without): <i>Er ging, ohne ein Wort zu sagen.</i></p>
<p><b>No zu</b> after modals (<i>können, müssen</i>), <i>werden</i>, <i>lassen</i>, <i>gehen</i>.</p>`},

U({id:"b1-25",lvl:"B1",e:"🏠",t:"Everyday Life & Colloquial German",
 intro:"How people really talk: particles, contractions and everyday expressions.",
 grammar:{t:"Modal particles & colloquial speech",html:`
<p><b>Particles</b> add attitude: <i>doch, mal, ja, eigentlich, halt, eben, schon</i>.</p>
<ul><li><i>Komm <b>doch</b> mit!</i> – softens an invitation.</li><li><i>Schau <b>mal</b>!</i> – casual request.</li><li><i>Das ist <b>ja</b> toll!</i> – surprise.</li><li><i>Wie spät ist es <b>eigentlich</b>?</i> – by the way.</li><li><i>Das ist <b>halt</b> so.</i> – that's just how it is.</li></ul>

U({id:"b2-26",lvl:"B2",e:"📑",t:"Nominalization & Formal Written Style",

 grammar:{t:"Verb → noun",html:`
<table class="g"><tr><th>Verbal</th><th>Nominal</th></tr>
<tr><td>Weil er krank war, …</td><td><b>Wegen seiner Krankheit</b>, …</td></tr>
<tr><td>Obwohl es regnete, …</td><td><b>Trotz des Regens</b>, …</td></tr>

<tr><td>Man verbessert die Qualität.</td><td><b>Die Verbesserung der Qualität</b> …</td></tr></table>
<p><b>Common suffixes:</b> <b>-ung</b> (die Entwicklung), <b>-heit / -keit</b> (die Gesundheit, die Möglichkeit), <b>-ion</b> (die Information), <b>-tion</b>; the infinitive as noun (<i>das Lesen</i>, <i>beim Essen</i>).</p>
<p><b>Genitive prepositions:</b> <i>wegen, trotz, während, aufgrund, innerhalb, außerhalb, anstelle</i> + genitive: <i>aufgrund des schlechten Wetters</i>.</p>
<p><b>Rule of thumb:</b> nominal style is dense and impersonal – good for writing, too heavy for talking.</p>`},

U({id:"b2-27",lvl:"B2",e:"🗞️",t:"Indirect Speech (Konjunktiv I)",
 intro:"Reporting what others said, the formal way: Konjunktiv I in newspapers and reports.",
 grammar:{t:"Konjunktiv I",html:`
<p>Direct: <i>Er sagt: „Ich bin müde.“</i> Indirect (formal): <i>Er sagt, er <b>sei</b> müde.</i></p>
<table class="g"><tr><th>Person</th><th>sein</th><th>haben</th><th>kommen</th><th>können</th></tr>
<tr><td>ich</td><td>sei</td><td>habe</td><td>komme</td><td>könne</td></tr>
<tr><td>er/sie/es</td><td><b>sei</b></td><td><b>habe</b></td><td><b>komme</b></td><td><b>könne</b></td></tr>
<tr><td>wir</td><td>seien</td><td>haben</td><td>kommen</td><td>können</td></tr>
<tr><td>sie (pl.)</td><td><b>seien</b></td><td>haben</td><td>kommen</td><td>können</td></tr></table>
<p><b>Rule:</b> use the 3rd person Konjunktiv I (<i>er sei, habe, komme, könne</i>). If it looks identical to the indicative (<i>wir kommen</i>), use <b>Konjunktiv II</b> instead: <i>Sie sagten, sie <b>kämen</b> morgen.</i> or <i>würden … kommen</i>.</p>
<p><b>Past:</b> <i>Er sagte, er <b>sei</b> krank <b>gewesen</b> / <b>habe</b> viel gearbeitet.</i> <b>Questions:</b> <i>Sie fragte, ob er Zeit <b>habe</b>.</i></p>
<p>In everyday speech Germans often use the normal indicative or Konjunktiv II instead.</p>`},

U({id:"b2-28",lvl:"B2",e:"🧱",t:"Participle Constructions & Passive Alternatives",
 intro:"Compact written German: extended participial attributes and ways to avoid the passive.",
 grammar:{t:"Partizip I / II as adjectives, lassen, sein … zu",html:`
<p><b>Partizip I</b> (infinitive + d) = ongoing: <i>der <b>schlafende</b> Hund</i> (the sleeping dog), <i>die <b>kommende</b> Woche</i>.</p>
<p><b>Partizip II</b> = completed/passive: <i>das <b>geschlossene</b> Fenster</i> (the closed window), <i>die <b>verlorene</b> Zeit</i>.</p>
<p><b>Extended attribute:</b> <i>Das von Studenten <b>geschriebene</b> Buch</i> = <i>Das Buch, das von Studenten geschrieben wurde.</i></p>
<table class="g"><tr><th>Passive alternative</th><th>Example</th></tr>
<tr><td><b>man</b></td><td><i>Man spricht hier Deutsch.</i></td></tr>
<tr><td><b>sich lassen + inf.</b> (can be done)</td><td><i>Das lässt sich leicht erklären.</i></td></tr>
<tr><td><b>sein + zu + inf.</b> (must/can be done)</td><td><i>Das Problem ist leicht zu lösen.</i></td></tr>
<tr><td><b>-bar / -lich</b> adjectives</td><td><i>machbar, lesbar, verständlich</i></td></tr></table>`},

  ["r","Back-of-the-throat „r“ (gargle-like), or after vowels almost like „a“","rot, Regen, Bruder, Vater"],
  ["ei / ie / eu","ei = „eye“, ie = long „ee“, eu/äu = „oy“","Eis, Liebe, neu, Häuser"],
  ["Final devoicing","b, d, g at the end sound like p, t, k","Hand, Tag, gelb, Weg"],
  ["Long / short vowels","Doubled letters or a vowel before two consonants = short; vowel + h or single consonant often long","Bett (short), Beet (long), Stadt, Staat"],
  ["Word stress","Usually on the first syllable; separable prefixes are stressed: AUF-stehen","Arbeit, aufstehen, Wohnung, verstehen"]

 gcats:[
  ["Articles",["der","die","das","den","dem","des","ein","eine","einen","einem","einer"],"Three genders: <b>der</b> (m), <b>die</b> (f / plural), <b>das</b> (n). The <b>accusative</b> changes only masculine: der → <b>den</b>, ein → <b>einen</b>; the <b>dative</b>: dem / der / dem / den."],
  ["Personal pronouns",["ich","du","er","sie","es","wir","ihr","Sie"],"<b>du</b> = informal, <b>Sie</b> = formal (capital S, always plural verb). <b>ihr</b> = you (plural informal)."],
  ["Prepositions",["in","auf","an","mit","für","von","zu","nach","bei","aus","um","über","unter","vor"],"<b>mit, von, zu, nach, bei, aus</b> always take the dative; <b>für, um, durch, ohne</b> the accusative; <b>in, auf, an, über, unter, vor</b> are two-way (acc. = motion, dat. = location)."],
  ["Auxiliary verbs",["bin","bist","ist","sind","seid","habe","hast","hat","haben","habt","war","hatte","wird","werden"],"<b>sein</b> and <b>haben</b> form the Perfekt; <b>werden</b> forms the future and the passive."],
  ["Modal verbs",["kann","muss","will","soll","darf","möchte","können","müssen","wollen","sollen","dürfen","möchten"],"Modal verbs stand in position 2; the infinitive goes to the end of the sentence."],
  ["Conjunctions",["und","aber","oder","denn","weil","dass","wenn","obwohl","damit","sondern","als","ob"],"<b>und, aber, oder, denn, sondern</b> do not change the word order; <b>weil, dass, wenn, obwohl, damit, als, ob</b> send the verb to the end."],
  ["Question words",["was","wo","wann","wer","warum","wie","woher","wohin","welche","wie viel"],"<b>wo</b> (where), <b>woher</b> (where from), <b>wohin</b> (where to), <b>wann</b> (when), <b>warum</b> (why), <b>wer</b> (who), <b>was</b> (what)."],
  ["Negation",["nicht","kein","keine","keinen","nie","niemand","nichts"],"<b>kein</b> negates nouns (<i>Ich habe kein Auto</i>), <b>nicht</b> negates verbs/adjectives/whole sentences."]

  quick:`<details class="card tip" open><summary>⚡ The 10 most important rules at a glance</summary><ol>
   <li><b>The verb is in position 2</b> in main clauses: <i>Heute gehe ich ins Kino.</i></li>
   <li><b>Every noun is capitalised</b> and has a gender: <i>der Mann, die Frau, das Kind</i>. Learn the article with the noun!</li>
   <li><b>Four cases:</b> nominative (subject), accusative (direct object), dative (indirect object), genitive (possession). Articles and adjectives change.</li>
   <li><b>Subordinate clauses</b> (weil, dass, wenn, obwohl …) send the conjugated verb <b>to the end</b>.</li>
   <li><b>Separable verbs</b> split: <i>Ich stehe um 7 Uhr auf.</i></li>
   <li><b>Perfekt</b> (haben/sein + participle) is the spoken past: <i>Ich habe gegessen. Ich bin gegangen.</i></li>
   <li><b>Modal verbs</b> + infinitive at the end: <i>Ich kann gut schwimmen.</i></li>
   <li><b>du / Sie:</b> du for friends and family, Sie for strangers and at work.</li>
   <li><b>Plurals are irregular</b> – learn them with the noun: <i>das Buch – die Bücher</i>.</li>
   <li><b>Compound words:</b> German builds long words from short ones: <i>Handschuh</i> = hand + shoe = glove. The last part decides the gender.</li></ol></details>`

 },

function buildCards(free){
  const kinds=S.ckinds.split(""),pool=itemsIn(V.scope,kinds),now=Date.now();
  let q=[],isFree=!!free;
  if(!free){
    const rev=pool.filter(x=>S.due[x.id]&&S.due[x.id]<=now);
    const left=Math.max(0,S.newPerDay-D().newc);
    const nw=pool.filter(x=>!S.due[x.id]&&!S.box[x.id]).slice(0,left);
    const uo={};UNITS.forEach((u,i)=>uo[u.id]=i);
    nw.sort((a,b)=>(uo[a.u]-uo[b.u])||((a.k==="v"?0:1)-(b.k==="v"?0:1)));   // Reihenfolge: Lektion → Vokabeln → Sätze
    q=shuffle(rev).sort((a,b)=>(a.k==="v"?0:1)-(b.k==="v"?0:1)).slice(0,30).map(x=>x.id).concat(nw.map(x=>x.id));
    if(!q.length)isFree=true;
  }
  if(isFree){q=shuffle(pool).sort((a,b)=>(S.box[a.id]||0)-(S.box[b.id]||0)).slice(0,15).map(x=>x.id);q=shuffle(q).sort((a,b)=>(IDX[a].k==="v"?0:1)-(IDX[b].k==="v"?0:1));}
  V.cards={q,i:0,flip:false,free:isFree,again:{},spoken:false,right:0};
}

const EXT=[["mix","Mixed"],["gram","Grammar: fill in the words"],["cloze","Gap fill (grammar)"],["build","Word order"],["trans","Translate"],["hear","Listening"],["vocab","Vocabulary quiz"]];

const GCATS=CFG.gcats;
function gramPool(scope){
  const L=[];
  unitsIn(scope).forEach(u=>{
    (u.sent||[]).forEach(v=>L.push(v));
    ((u.dlg&&u.dlg.lines)||[]).forEach(l=>L.push([l[1],l[2]]));
  });
  const out=[];
  L.forEach(v=>{
    const toks=v[0].replace(/[.,!?]/g,"").split(" ");
    GCATS.forEach((c,ci)=>{
      toks.forEach((w,wi)=>{
        const lw=w.toLowerCase();
        const hit=c[1].find(x=>x.toLowerCase()===lw);
        if(hit&&!(c[0]==="Pronouns"&&wi>0&&false))out.push({idn:v[0],de:v[1],ci,wi,ans:hit,w});
      });
    });
  });
  return out;
}
function genEx(scope,type,n){
  const sents=itemsIn(scope,["s"]),words=itemsIn(scope,["v"]);
  const cl=[];unitsIn(scope).forEach(u=>(u.ex||[]).forEach(c=>cl.push(c)));
  const allS=ITEMS.filter(x=>x.k==="s"),allW=ITEMS.filter(x=>x.k==="v");
  const mk={
   cloze(){const c=pick(cl);return {key:"c"+c[0],t:"cloze",p:c[0],a:c[1],o:shuffle(c[2]),n:c[3]};},
   build(){const it=pick(sents);return {key:"b"+it.id,t:"build",it,pool:shuffle(it.idn.split(" ").map((w,i)=>({w,i}))),ans:[]};},
   trans(){const it=pick(sents.concat(words));return {key:"t"+it.id,t:"trans",it};},
   hear(){const it=pick(sents);const o=shuffle([it,...sample(allS.filter(x=>x.de!==it.de),3)]);return {key:"h"+it.id,t:"hear",it,o};},
   vocab(){const it=pick(words);const dir=Math.random()<.5?"id2de":"de2id";const o=shuffle([it,...sample(allW.filter(x=>x.de!==it.de&&x.idn!==it.idn),3)]);return {key:"v"+it.id+dir,t:"vocab",it,dir,o};}
  };
  const gp=gramPool(scope);
  mk.gram=function(){const g=pick(gp);const c=GCATS[g.ci];const toks=g.idn.replace(/[.,!?]/g,"").split(" ");const raw=g.idn.split(" ");
    const q=raw.map((t,i)=>i===g.wi?"_____":t).join(" ");
    const bl=new Set();(CFG.gsyn||[]).forEach(gr=>{if(gr.includes(g.ans))gr.forEach(x=>bl.add(x));});bl.delete(g.ans);
    let cand=c[1].filter(x=>x!==g.ans&&!bl.has(x));if(cand.length<3)cand=c[1].filter(x=>x!==g.ans);
    const o=shuffle([g.ans,...sample(cand,3)]);
    return {key:"g"+g.idn+g.wi+g.ci,t:"gram",p:q,a:g.ans,o,n:c[0]+": "+c[2],de:g.de,idn:g.idn};};
  const cnt={gram:gp.length,cloze:cl.length,build:sents.length,trans:sents.length+words.length,hear:sents.length,vocab:words.length};
  const avail=Object.keys(mk).filter(k=>cnt[k]>0);
  const types=type==="mix"?avail:avail.filter(k=>k===type);
  const qs=[],seen=new Set();
  for(let i=0;i<n&&types.length;i++){
    for(let tries=0;tries<6;tries++){const q=mk[types[i%types.length]]();if(!seen.has(q.key)){seen.add(q.key);qs.push(q);break;}}
  }
  return shuffle(qs);
}

/* ===================== TUTOR = LEHRER (ohne KI, ohne Internet) ===================== */
/* Der Lehrer führt durch eine Lesson: Basics → Wörter → Sätze → Grammatik → Dialog → Abfrage.
   Er erklärt, spricht vor, lässt nachsprechen (Abgleich), fragt ab, wiederholt Schwaches und beantwortet Fragen. */
V.chat={msgs:[],level:(S.level||"A2"),topic:"tutor",busy:false,err:"",auto:true,goal:null};
const stripG=t=>String(t).split(" – ")[0].trim();
function otUnit(){return UNIT(V.unit||nextUnit().id);}
const TCH_PH=["Basics","Words","Sentences","Grammar","Dialogue","Quiz"];
function tchMark(id,ok){
  if(!id)return;const days=[0,1,2,4,8,16,32];let b=S.box[id]||0;
  if(ok){b=Math.min(6,Math.max(1,b+1));S.due[id]=Date.now()+days[b]*864e5;}
  else{b=1;S.due[id]=Date.now()+10*60000;}
  S.box[id]=b;save();
}
function tchDistract(it,n,field){
  const pool=ITEMS.filter(x=>x.k===it.k&&x.id!==it.id&&x[field]!==it[field]);
  const same=pool.filter(x=>x.u===it.u),rest=pool.filter(x=>x.u!==it.u);
  const out=[];const seen=new Set([norm(it[field])]);
  for(const x of shuffle(same).concat(shuffle(rest))){const k=norm(x[field]);if(!k||seen.has(k))continue;seen.add(k);out.push(x[field]);if(out.length>=n)break;}
  return out;
}
function tchBuild(u){
  const vit=ITEMS.filter(x=>x.u===u.id&&x.k==="v").slice(0,12),sit=ITEMS.filter(x=>x.u===u.id&&x.k==="s").slice(0,6);
  const st=[];
  let g=stripHtml(u.grammar.html);if(g.length>650)g=g.slice(0,650).replace(/\s\S*$/,"")+" …";
  st.push({ph:0,t:"info",text:LT.greet().replace(/[!👋\s]+$/,"").trim()+"! "+LT.tp.start+"\n\nToday we learn lesson "+u.n+": „"+u.t+"”. I will guide you step by step: first the basics, then the words, then sentences made from them, a short exercise, a dialogue and finally a quiz. You can ask me anything at any time.\n\n"+u.intro});
  st.push({ph:0,t:"info",text:"The basics – "+u.grammar.t+":\n"+g});
  for(let i=0;i<vit.length;i+=3){
    const blk=vit.slice(i,i+3);
    blk.forEach((it,k)=>st.push({ph:1,t:"rep",it,new:true,hdr:(i===0&&k===0?"Now the words. ":"")+"New word:"}));
    shuffle(blk).forEach(it=>st.push({ph:1,t:"mc",it,dir:"toNative",mark:true}));
    st.push({ph:1,t:"tr",it:pick(blk),mark:true});
  }
  for(let i=0;i<sit.length;i+=3){
    const blk=sit.slice(i,i+3);
    blk.forEach((it,k)=>st.push({ph:2,t:"rep",it,new:true,hdr:(i===0&&k===0?"Now we build sentences from the words we just learned. ":"")+"New sentence:"}));
    st.push({ph:2,t:"mc",it:pick(blk),dir:"toNative",mark:true});
    st.push({ph:2,t:"tr",it:pick(blk),mark:true});
  }
  shuffle((u.ex||[]).slice()).slice(0,4).forEach((c,k)=>st.push({ph:3,t:"cl",p:c[0],a:c[1],o:shuffle(c[2].slice()),n:c[3],hdr:k===0?"Now the rule in practice – choose the matching word.":""}));
  st.push({ph:4,t:"dlg"});
  st.push({ph:5,t:"final"});
  return st;
}
function otStart(){
  const C=V.chat,u=otUnit();
  C.ot={mode:"teach",u:u.id,steps:tchBuild(u),i:0,tries:0,right:0,n:0,fr:0,fn:0,wrong:{},done:false,dlg:null,quiz:null,last:null,ask:false};
  C.msgs=[];C.err="";tchRun();
}
function tchPrompt(q){
  const o=V.chat.ot;
  if(q.t==="info")return {text:q.text,opts:["Got it – continue ▶"]};
  if(q.t==="rep"){
    const t=stripG(q.it.idn);
    return {text:(q.hdr?q.hdr+" ":"")+(q.new?"Listen and repeat.":"Say it once more.")+" – "+LT.tp.cmd,goal:t,gl:q.it.de,ph:q.it.ph||"",say:t};
  }
  if(q.t==="mc"){
    if(q.opts0===undefined){q.opts0=shuffle([q.it.de].concat(tchDistract(q.it,2,"de")));}
    return {text:"What does this mean: “"+stripG(q.it.idn)+"“?",opts:q.opts0,say:stripG(q.it.idn)};
  }
  if(q.t==="tr")return {text:(q.hdr?q.hdr+" ":"")+"How do you say in "+LT.lname+": „"+q.it.de+"”? (speak or write)"};
  if(q.t==="cl")return {text:(q.hdr?q.hdr+" ":"")+"Which word fits? "+q.p,opts:q.o};
  return {text:""};
}
function tchRun(){
  const C=V.chat,o=C.ot;
  if(o.i>=o.steps.length){tchFinish();return;}
  const q=o.steps[o.i];o.cur=q;o.tries=0;
  if(q.t==="final"){tchFinal();return;}
  if(q.t==="dlg"){
    const u=otUnit(),d={L:u.dlg.lines,p:0};o.dlg=d;
    C.msgs.push({role:"assistant",text:"Now everything together – a dialogue: “"+u.dlg.t+"”. I play the first role, you are person B. Answer in your own words; I compare with the model."});
    dlgAdvance(C,d,0);return;
  }
  const p=tchPrompt(q);
  C.msgs.push(Object.assign({role:"assistant",ph:q.ph},p,{ph:p.ph||""}));
  if(p.say)o.last={say:p.say,gl:p.gl||""};
  render();
  if(p.say&&C.auto)speak(p.say,.9);
}
function tchNext(){V.chat.ot.i++;tchRun();}
function tchFinal(){
  const C=V.chat,o=C.ot,u=otUnit();
  const weak=Object.keys(o.wrong).map(id=>IDX[id]).filter(Boolean);
  const unitIts=ITEMS.filter(x=>x.u===u.id);
  let pool=weak.slice(0,5);
  shuffle(unitIts.filter(x=>!pool.includes(x))).slice(0,Math.max(0,8-pool.length-2)).forEach(x=>pool.push(x));
  const old=ITEMS.filter(x=>x.u!==u.id&&(S.box[x.id]||0)>0&&(S.box[x.id]||0)<4);
  shuffle(old).slice(0,2).forEach(x=>pool.push(x));
  const qs=shuffle(pool).map((it,k)=>k%2===0?{ph:5,t:"mc",it,dir:"toNative",mark:true,fin:true}:{ph:5,t:"tr",it,mark:true,fin:true});
  o.steps.splice(o.i,1,...qs);
  C.msgs.push({role:"assistant",text:"Finally the quiz: "+qs.length+" questions on what we did – plus a few words from earlier. Here we go!"});
  tchRun();
}
function tchFinish(){
  const C=V.chat,o=C.ot,u=otUnit();o.done=true;
  const weak=Object.keys(o.wrong).map(id=>IDX[id]).filter(Boolean);
  const pct=o.fn?Math.round(100*o.fr/o.fn):100;
  C.msgs.push({role:"assistant",text:LT.tp.end+" 🎉 Quiz: "+o.fr+" / "+o.fn+" correct ("+pct+" %). "+(weak.length?"You should still practise: "+weak.slice(0,8).map(x=>stripG(x.idn)).join(", ")+". I can go over these words with you once more.":"Everything sticks – very good!")+" Your words are now in the cards (scheduled review)."});
  addXp(5+(pct>=80?5:0));save();render();
}
function tchDrill(){
  const C=V.chat,o=C.ot;const weak=Object.keys(o.wrong).map(id=>IDX[id]).filter(Boolean);if(!weak.length)return;
  o.wrong={};o.done=false;
  const st=[];weak.forEach(it=>st.push({ph:5,t:"rep",it,hdr:"Review:"}));weak.forEach(it=>st.push({ph:5,t:"mc",it,dir:"toNative",mark:true}));
  o.steps=o.steps.slice(0,o.i).concat(st);o.i=o.steps.length-st.length;
  C.msgs.push({role:"assistant",text:"Okay, we review the weak spots."});tchRun();
}
function tchWrong(q){const o=V.chat.ot;if(q.it)o.wrong[q.it.id]=1;}
function tchAnswer(txt,spoken){
  const C=V.chat,o=C.ot,q=o.cur;
  const um={role:"user",text:txt,spoken:!!spoken};C.msgs.push(um);
  if(q.t==="info"){tchNext();return;}
  const isCl=q.t==="cl",isMc=q.t==="mc";
  const target=isCl?q.a:stripG(q.it.idn);
  let ok,ev=null;
  if(isCl)ok=norm(txt)===norm(q.a);
  else if(isMc)ok=norm(txt)===norm(q.it.de);
  else{ev=evaluate(target,[txt]);um.cmp={target,score:ev.score,words:ev.words};ok=ev.score>=85;}
  if(q.fin){}
  if(ok){
    o.n++;o.right++;if(q.fin){o.fn++;o.fr++;}addXp(q.t==="rep"?1:2);
    if(q.it&&(q.mark||q.t==="rep")){if(q.t==="rep"&&!q.new&&false){}tchMark(q.it.id,true);}
    C.msgs.push({role:"assistant",text:pick(LT.tp.ok)+" ✅"+(isCl&&q.n?" "+q.n:"")+(isMc?" „"+stripG(q.it.idn)+"“ = „"+q.it.de+"”":"")});
    o.i++;tchRun();return;
  }
  if(!isCl&&!isMc&&o.tries<1){
    o.tries++;const red=(ev.words||[]).filter(w=>w.s<.85).map(w=>w.w).join(", ");
    const far=(ev.score||0)<35&&q.t!=="rep";
    C.msgs.push({role:"assistant",text:(far?"That was a different word. The answer is: „"+target+"“. Listen to it and try again. – ":"Almost – watch: "+(red||"…")+". Listen to the model and try once more. – ")+LT.tp.again,goal:target});
    render();if(C.auto)speak(target,.7);o.last={say:target,gl:q.it?q.it.de:""};return;
  }
  o.n++;if(q.fin){o.fn++;}tchWrong(q);if(q.it)tchMark(q.it.id,false);
  if(isCl)C.msgs.push({role:"assistant",text:"Not quite – the correct form is: “"+q.a+"“. "+(q.n||"")});
  else if(isMc)C.msgs.push({role:"assistant",text:"Not quite – “"+stripG(q.it.idn)+"” means “"+q.it.de+"“.",say:stripG(q.it.idn),gl:q.it.de});
  else C.msgs.push({role:"assistant",text:"No problem – this is how it is said correctly:",goal:target});
  o.last={say:target,gl:q.it?q.it.de:""};
  o.i++;tchRun();
}
/* Fragen an den Lehrer mitten in der Lektion */
function tchQuestion(txt,spoken){
  const C=V.chat,o=C.ot;miniBuild();
  const um={role:"user",text:txt,spoken:!!spoken};C.msgs.push(um);
  const ai=miniIntent(txt);let intent=ai.intent;
  if(RX.repeat.test(txt)){intent="repeat";}else if(RX.slow.test(txt)){intent="slow";}
  const resume=()=>{o.ask=false;if(o.done){render();return;}
    if(o.dlg){render();return;}
    const q=o.cur;if(!q)return;const p=tchPrompt(q);
    C.msgs.push(Object.assign({role:"assistant",text:"Back to the task: "+p.text},p,{text:"Back to the task: "+p.text,say:undefined}));render();};
  if(intent==="dialog"){o.ask=false;if(o.done||o.dlg){}else{const k=o.steps.findIndex((s,j)=>j>=o.i&&s.t==="dlg");if(k>=0){o.i=k;tchRun();return;}}}
  if(intent==="quiz"){const k=o.steps.findIndex((s,j)=>j>=o.i&&s.t==="final");if(k>=0){o.i=k;o.dlg=null;tchRun();return;}}
  if(intent==="nextlesson"){C.msgs.push({role:"assistant",text:"Gladly – we can switch to the next lesson any time. Tap “Next lesson” below."});o.skip=true;render();return;}
  if(intent==="stop"){C.msgs.push({role:"assistant",text:"No problem, let's take a break. Tell me or tap “Continue” and we pick up at the same spot.",opts:["Continue ▶"]});o.paused=true;render();return;}
  if(!["target","unknown"].includes(intent)&&(ai.conf>=.3||intent==="repeat"||intent==="slow")){
    const dlgSave=o.dlg;o.dlg=null;
    miniDo(C,intent,txt,miniSlot(txt),um);o.dlg=dlgSave;resume();return;
  }
  miniFixedReply(C,txt,mTok(txt),um);resume();
}
/* Entscheidet: Antwort auf die Aufgabe oder Question an den Lehrer */
function tchHandle(txt,spoken){
  const C=V.chat,o=C.ot;txt=(txt||"").trim();if(!txt||!o)return;miniBuild();
  if(o.mode==="talk"){talkHandle(txt,spoken);return;}
  if(o.mode!=="teach")return;
  if(o.done){tchQuestion(txt,spoken);return;}
  if(o.paused){o.paused=false;}
  const q=o.cur;
  if(o.ask){tchQuestion(txt,spoken);return;}
  if(o.dlg){
    const ai=miniIntent(txt);
    const d=o.dlg,exp=d.L[d.p],ev=evaluate(exp[1],[txt]);
    if(ev.score<45&&!["target","unknown"].includes(ai.intent)&&ai.conf>=.6){tchQuestion(txt,spoken);return;}
    const um={role:"user",text:txt,spoken:!!spoken,cmp:{target:exp[1],score:ev.score,words:ev.words}};C.msgs.push(um);
    if(ev.score>=85)addXp(2);
    dlgAdvance(C,d,d.p+1);return;
  }
  if(!q)return;
  if(q.t==="info"){const ai=miniIntent(txt);if(/^(ok|okay|weiter|ja|verstanden|next|continue|yes)\b/i.test(txt)||["target","unknown"].includes(ai.intent)){tchAnswer(txt,spoken);}else tchQuestion(txt,spoken);return;}
  if(q.t==="mc"||q.t==="cl"){
    const opts=q.t==="mc"?q.opts0:q.o;
    if(opts.some(x=>norm(x)===norm(txt))){tchAnswer(txt,spoken);return;}
    tchQuestion(txt,spoken);return;
  }
  // rep / tr: Zielsprache = Antwort; klare Fragen auf Deutsch = Frage
  const target=stripG(q.it.idn),ev=evaluate(target,[txt]);
  if(ev.score<55){const ai=miniIntent(txt);if(!["target","unknown"].includes(ai.intent)&&ai.conf>=(ev.score<35?.4:.6)){tchQuestion(txt,spoken);return;}}
  tchAnswer(txt,spoken);
}
function tchPick(i){
  const C=V.chat,o=C.ot;if(!o)return;
  const last=C.msgs[C.msgs.length-1];if(!last||!last.opts)return;
  const val=last.opts[i];
  if(o.mode==="place"){
    C.msgs.push({role:"user",text:val});
    const ok=norm(val)===norm(o.cur[1]);if(ok)o.right[o.li]++;
    o.k++;
    if(o.k>=3){
      if(o.right[o.li]>=2){if(o.li>=3){otPlaceDone(3,true);return;}o.li++;o.k=0;o.qs=[];}
      else{otPlaceDone(o.li);return;}
    }
    otPlaceAsk();return;
  }

/* ===================== MINI-KI (selbstgebaut, ohne Internet) ===================== */
/* Bestandteile: (1) trainiertes Absichtsmodell (mini/train.py, Gewichte in MINI_MODEL),
   (2) Sprachmodell: Wort-Unigramm/Bigramm aus den Lektionstexten + Editierdistanz = Fehlerkorrektur,
   (3) Retrieval über Dialogzeilen/Vokabeln/Sätze (Wortähnlichkeit + Zeichen-Trigramm-Kosinus). */
const MINI={built:false,lines:[],items:[],freq:{},bg:{},vocab:[],model:null};
const mTok=t=>norm(t).split(" ").filter(Boolean);
function fnv(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function ngVec(t){const w="  "+norm(t)+"  ",m={};for(let i=0;i<w.length-2;i++){const g=w.substr(i,3);m[g]=(m[g]||0)+1;}let n=0;for(const k in m)n+=m[k]*m[k];m._n=Math.sqrt(n)||1;return m;}
function ngCos(a,b){let d=0;for(const k in a){if(k==="_n")continue;if(b[k])d+=a[k]*b[k];}return d/(a._n*b._n);}
function miniBuild(){
  if(MINI.built)return;MINI.built=true;
  UNITS.forEach(u=>{
    const L=u.dlg.lines;
    L.forEach((l,i)=>MINI.lines.push({u:u.id,i,spk:l[0],tgt:l[1],gl:l[2],tk:mTok(l[1]),gk:mTok(l[2]),L,ng:ngVec(l[1])}));
  });
  ITEMS.forEach(x=>{const t=stripG(x.idn);MINI.items.push({u:x.u,k:x.k,tgt:t,gl:x.de,tk:mTok(t),gk:mTok(x.de),ng:ngVec(t),gg:ngVec(x.de)});});
  const feed=toks=>{toks.forEach((w,i)=>{MINI.freq[w]=(MINI.freq[w]||0)+1;if(i){const p=toks[i-1];(MINI.bg[p]=MINI.bg[p]||{})[w]=((MINI.bg[p]||{})[w]||0)+1;}});};
  MINI.lines.forEach(c=>feed(c.tk));MINI.items.forEach(c=>feed(c.tk));
  MINI.vocab=Object.keys(MINI.freq);
  if(typeof MINI_MODEL!=="undefined"){
    const m=MINI_MODEL,bin=atob(m.W),W=new Int8Array(bin.length);for(let i=0;i<bin.length;i++){const c=bin.charCodeAt(i);W[i]=c>127?c-256:c;}
    MINI.model={H:m.H,classes:m.classes,scale:m.scale,b:m.b,W,trig:new Set(m.trig),con:m.con};
  }
}
/* Absichtsmodell: gleiche Merkmale wie beim Training (Wörter, Zeichen-n-Gramme, Bigramme, Begriffe) */
function miniFeat(text){
  const M=MINI.model,toks=mTok(text),f={};
  const add=k=>{const i=fnv(k)%M.H;f[i]=(f[i]||0)+1;};
  toks.forEach(t=>{add("w:"+t);if(M.con[t])add("k:"+M.con[t]);const w="<"+t+">";for(let n=2;n<=4;n++)for(let i=0;i+n<=w.length;i++)add("c:"+w.substr(i,n));});
  for(let i=1;i<toks.length;i++)add("b:"+toks[i-1]+"_"+toks[i]);
  let nr=0;const out=[];for(const i in f){const v=1+Math.log(f[i]);out.push([+i,v]);nr+=v*v;}nr=Math.sqrt(nr)||1;
  return out.map(([i,v])=>[i,v/nr]);
}
function miniIntent(text){
  const M=MINI.model;if(!M)return {intent:"target",conf:0,top:[]};
  const x=miniFeat(text),C=M.classes.length,z=new Array(C);
  for(let c=0;c<C;c++){let s=M.b[c];const off=c*M.H;for(const [i,v] of x)s+=v*M.W[off+i]*M.scale;z[c]=s;}
  const mx=Math.max(...z);let sum=0;const p=z.map(v=>{const e=Math.exp(v-mx);sum+=e;return e;}).map(e=>e/sum);
  const idx=p.map((v,i)=>i).sort((a,b)=>p[b]-p[a]);
  return {intent:M.classes[idx[0]],conf:p[idx[0]],top:idx.slice(0,3).map(i=>[M.classes[i],p[i]])};
}
/* Sprachmodell: Tippfehler im Zieltext korrigieren (Editierdistanz + Unigramm + Bigramm-Kontext) */
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;const d=[];for(let i=0;i<=m;i++){d[i]=[i];}for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);}return d[m][n];}
function miniFix(toks){
  const out=[];
  toks.forEach((t,k)=>{
    if(MINI.freq[t]||t.length<3){out.push(t);return;}
    let best=t,bs=-1e9;const prev=out[k-1];
    for(const c of MINI.vocab){const d=lev(t,c);if(d>2||(d===2&&t.length<5))continue;
      const sc=-3*d+Math.log(1+MINI.freq[c])+(prev&&MINI.bg[prev]&&MINI.bg[prev][c]?1.5*Math.log(1+MINI.bg[prev][c]):0);
      if(sc>bs){bs=sc;best=c;}}
    out.push(best);
  });
  return out;
}
function qScore(qt,ct){
  if(!qt.length||!ct.length)return 0;
  let p=0,r=0;
  for(const a of qt){let b=0;for(const c of ct){const v=a===c?1:sim(a,c);if(v>b)b=v;}p+=b;}
  for(const c of ct){let b=0;for(const a of qt){const v=a===c?1:sim(a,c);if(v>b)b=v;}r+=b;}
  p/=qt.length;r/=ct.length;return p+r?2*p*r/(p+r):0;
}
function miniBest(qt,arr,key,qng,ngkey){let best=null,bs=0;
  for(const c of arr){let v=qScore(qt,c[key]);if(qng&&ngkey){const cs=ngCos(qng,c[ngkey]);if(cs>v)v=cs*.97;}
    if(v>bs){ /* mindestens ein Wort muss (fast) übereinstimmen, sonst Zufallstreffer */
      if(v<.9&&!qt.some(a=>c[key].some(b=>a===b||sim(a,b)>=.85)))continue;
      bs=v;best=c;}}
  return {c:best,s:bs};}
const RX={
 repeat:/^(?:nochmal|noch\s+einmal|wiederhol\w*|again|repeat|once\s+more)\b/i,
 slow:/^(?:langsam\w*|slow\w*)\b/i,
 stop:/^(?:stopp?|ende|beenden|exit|quit|abbrechen)\s*!?$/i
};
const CORE=new Set("was wie wo wer wann warum bedeutet bedeutung heisst heist heissen mean means meaning what does how do you say sagt sage sag man ich du mir mal bitte auf in und der die das ein eine kannst koennen the a an of to is for word wort beispiel satz example sentence aussprache pronounce".split(" "));
const INTENT_LABEL={meaning:"Explain meaning",translate:"Translate",example:"Example sentences",grammar:"Explain grammar",repeat:"Repeat",slow:"Speak slowly",whatmeant:"Translation of the last answer",dialog:"Start role-play",stop:"End",help:"Help",whoareyou:"Who are you?",thanks:"Thanks",quiz:"Start quiz",pronounce:"Pronunciation",nextlesson:"Next lesson",level:"My level"};
function miniSlot(q){
  const M=MINI.model,toks=mTok(q);if(!M)return toks;
  const trigs=[...M.trig];
  const isTrig=t=>{
    if(CORE.has(t))return true;
    if(M.trig.has(t))return !(t.length>2&&!/^(und|oder|mit|bitte|mal|auf|ein|eine|der|die|das|mir|dir|ich|du|is|it|am|are|my|me|you)$/.test(t)&&MINI.items.some(x=>(x.tk.includes(t)||x.gk.includes(t))&&x.tk.length<=2));
    if(t.length>=4)return trigs.some(c=>c.length>=4&&lev(t,c)<=1&&!MINI.freq[t]);
    return false;
  };
  let s=toks.filter(t=>!isTrig(t));
  if(!s.length)s=toks.filter(t=>!CORE.has(t));
  return s;
}
function talkStart(){
  const C=V.chat;miniBuild();
  const u=otUnit();
  C.ot={mode:"talk",done:false,u:u.id,dlg:null,quiz:null,last:null};C.msgs=[];C.err="";
  C.msgs.push({role:"assistant",text:"Hello! I'm your mini tutor – a small language model trained on the vocabulary, sentences and dialogues of this app. You can ask freely, even sloppily, e.g. “What does … mean?”, “How do you say …?”, “Give me a sentence with …”, “I don't understand the tenses”, “Test me” or “Let's do a role-play”. Or just say something in the target language – and I'll answer.",say:LT.greet().replace(/[!👋\s]+$/,"").trim(),gl:""});
  render();
}
function miniSay(C,text,say,gl,extra){
  const m=Object.assign({role:"assistant",text:text||"",say:say||"",gl:gl||""},extra||{});
  C.msgs.push(m);if(say)C.ot.last={say,gl:gl||""};
  render();

}
function stripHtml(h){return String(h).replace(/<br\s*\/?>/gi," ").replace(/<\/(tr|p|li)>/gi," · ").replace(/<[^>]*>/g," ").replace(/&nbsp;/g," ").replace(/\s+/g," ").trim();}
/* Bot spricht ab Zeile j alle Nicht-B-Zeilen, dann ist der Nutzer (B) dran */
function dlgAdvance(C,d,j){
  const o=C.ot,L=d.L;let say="",gl="";
  while(j<L.length&&L[j][0]!=="B"){say=L[j][1];gl=L[j][2];if(say){C.msgs.push({role:"assistant",text:"",say,gl});o.last={say,gl};}j++;}
  if(j>=L.length){o.dlg=null;if(o.mode==="teach"){C.msgs.push({role:"assistant",text:"Dialogue done! 🎉 Well done."});addXp(5);render();if(say&&C.auto)speak(say,.9);tchNext();return;}
    C.msgs.push({role:"assistant",text:"Dialogue completed! 🎉 Say “dialogue” for a new one."});addXp(5);render();if(say&&C.auto)speak(say,.9);return;}
  d.p=j;C.msgs.push({role:"assistant",text:"Your turn – answer in your own words: “"+L[j][2]+"”",opts:o.mode==="teach"?["Show me the answer"]:undefined});render();if(say&&C.auto)speak(say,.9);
}
function quizNext(C){
  const o=C.ot,u=otUnit(),pool=u.sent.length?u.sent:MINI.items.filter(x=>x.k==="s").map(x=>[x.tgt,x.gl]);
  const it=pick(pool);o.quiz={target:it[0],gl:it[1]};
  miniSay(C,"Translate: “"+it[1]+"”");
}
/* Führt eine erkannte Absicht aus. slot = Inhaltswörter der Question */
function miniDo(C,intent,q,slot,um){
  const o=C.ot,sq=slot.join(" ");let m;
  const last=o.last;
  const th=slot.length>1?0:.12;
  const lookupT=(tk)=>{const r=miniBest(tk,MINI.items,"tk",ngVec(tk.join(" ")),"ng");r.s-=th;return r;};
  const lookupN=(tk)=>{const r=miniBest(tk,MINI.items,"gk",ngVec(tk.join(" ")),"gg");r.s-=th;return r;};
  switch(intent){
   case"meaning":case"whatmeant":{
    if(!slot.length){if(!last){miniSay(C,"Which word should I explain? Ask e.g. “What does … mean?”");return;}miniSay(C,"That means: “"+(last.gl||"–")+"”");return;}
    const fx=miniFix(slot);const r=lookupT(fx),r2=lookupN(slot);if(fx.join(" ")!==slot.join(" "))r.s-=.1;
    if(r2.s>=.6&&r2.s>r.s+.05){miniSay(C,"„"+sq+"” is said like this:",r2.c.tgt,r2.c.gl);return;}
    if(r.s>=.6){miniSay(C,"„"+r.c.tgt+"” means: “"+r.c.gl+"”",r.c.tgt,r.c.gl);return;}
    if(r2.s>=.6){miniSay(C,"„"+sq+"” is said like this:",r2.c.tgt,r2.c.gl);return;}
    miniSay(C,"I don't know the word “"+sq+"”. "+(r.c&&r.s>=.4?"Did you mean “"+r.c.tgt+"“ ("+r.c.gl+")?":"Try a word from the lessons."));return;
   }
   case"translate":{
    if(!slot.length){miniSay(C,"What would you like to say? For example: “How do you say thank you?”");return;}
    const r=lookupN(slot);
    if(r.s>=.55){miniSay(C,"You say “"+sq+"”:",r.c.tgt,r.c.gl);return;}
    const r1=lookupT(miniFix(slot));
    if(r1.s>=.7){miniSay(C,"„"+r1.c.tgt+"” means: “"+r1.c.gl+"”",r1.c.tgt,r1.c.gl);return;}
    miniSay(C,"I don't have a matching word for that yet. "+(r.c&&r.s>=.4?"Similar: “"+r.c.gl+"“.":""),r.c&&r.s>=.4?r.c.tgt:"",r.c&&r.s>=.4?r.c.gl:"");return;
   }
   case"example":{
    let wt=slot.length?miniFix(slot):(last?mTok(last.say):[]);
    const hits=[];
    if(wt.length)MINI.items.filter(x=>x.k==="s").forEach(x=>{const sc=Math.max(...wt.map(a=>Math.max(...x.tk.map(c=>a===c?1:sim(a,c)))));if(sc>=.85)hits.push(x);});
    if(!hits.length){const g=wt.length?lookupN(slot):null;if(g&&g.s>=.55){const t=mTok(g.c.tgt);MINI.items.filter(x=>x.k==="s"&&t.some(w=>x.tk.includes(w))).forEach(x=>hits.push(x));}}
    if(!hits.length){miniSay(C,"I found no example sentence for that.");return;}
    const h=shuffle(hits).slice(0,3);
    miniSay(C,"Beispiele"+(sq?" with “"+sq+"”":"")+":");
    h.forEach(x=>C.msgs.push({role:"assistant",text:"",say:x.tgt,gl:x.gl}));o.last={say:h[0].tgt,gl:h[0].gl};render();return;
   }
   case"grammar":{
    const SW=new Set(["die","der","das","den","dem","zu","zum","zur","über","von","für","the","of","about","for","to","on","grammatik","grammar","regel","regeln","rule","rules","mir","me","an","in","das","dem","nicht","not"]);
    const w=slot.filter(x=>!SW.has(x));let u=otUnit(),bs=0;
    if(w.length){UNITS.forEach(x=>{const sc=Math.max(qScore(w,mTok(x.grammar.t+" "+x.t)),ngCos(ngVec(w.join(" ")),ngVec(x.grammar.t)));if(sc>bs){bs=sc;u=x;}});if(bs<.3)u=otUnit();}
    const t=stripHtml(u.grammar.html);
    miniSay(C,"Grammar – "+u.grammar.t+" (lesson "+u.n+"): "+(t.length>700?t.slice(0,700)+" …":t));return;
   }
   case"repeat":case"slow":{
    if(!last){miniSay(C,"I have not said anything yet that I could repeat.");return;}
    const slow=intent==="slow";miniSay(C,"Gladly – once more"+(slow?" slowly":"")+":",last.say,last.gl);
    speak(last.say,slow?.55:.9);return;
   }
   case"dialog":{
    const u=otUnit(),L=u.dlg.lines,d={L,p:0};o.dlg=d;o.quiz=null;

   }
   case"stop":o.dlg=null;o.quiz=null;miniSay(C,"Okay. Ask me something or say “dialogue” for a role-play.");return;
   case"help":miniSay(C,"I can: explain words (“What does … mean?”), translate (“How do you say …?”), give example sentences, explain the grammar of the lessons, model pronunciation, quiz you (“Test me”), play role-plays (“Dialogue”) and answer sentences in the target language. I usually understand vague questions and typos too.");return;
   case"whoareyou":miniSay(C,"I'm a small language model trained only on this app's data (vocabulary, sentences, dialogues, grammar). Not ChatGPT – but everything runs offline on your device.");return;
   case"thanks":miniSay(C,"You're welcome! Keep it up. 🙂");return;
   case"quiz":o.dlg=null;miniSay(C,"Here we go – I'll quiz you. Say “Stop” to end the quiz.");quizNext(C);return;
   case"pronounce":{

    if(last){miniSay(C,"Once more, slowly:",last.say,last.gl);speak(last.say,.55);return;}
    miniSay(C,"Which word should I say?");return;
   }
   case"nextlesson":{const u=nextUnit();miniSay(C,"Moving on with lesson "+u.n+": „"+u.t+"“.");setTimeout(()=>openUnit(u.id),700);return;}
   case"level":{const known=ITEMS.filter(x=>S.box[x.id]>=3).length;miniSay(C,(S.level?"Your level: "+S.level+". ":"")+"You have "+known+" / "+ITEMS.length+" entries mastered, "+(S.streak||0)+" days in a row practised and "+S.xp+" XP gesammelt.");return;}
  }
  miniSay(C,"I didn't understand that. You can ask for example: “What does … mean?”, “How do you say …?”, “Give me a sentence with …”, “Test me” or say a sentence from the lesson.");
}
function talkHandle(txt,spoken){
  const C=V.chat,o=C.ot;miniBuild();
  const um={role:"user",text:txt,spoken:!!spoken};C.msgs.push(um);
  const q=txt.trim(),qt=mTok(q);
  const ai=miniIntent(q);
  const wantsStop=RX.stop.test(q)||(ai.intent==="stop"&&ai.conf>=.7);
  // Steuerbefehle (Repeat, langsamer, Help …) gelten auch mitten im Rollenspiel/Quiz
  if((o.dlg||o.quiz)&&!wantsStop){
    let ci=ai.intent,cc=ai.conf;
    if(RX.repeat.test(q)){ci="repeat";cc=1;}else if(RX.slow.test(q)){ci="slow";cc=1;}
    if(["repeat","slow","help","pronounce","whatmeant","nextlesson","dialog","quiz","level"].includes(ci)&&cc>=.75){
      if(ci==="nextlesson"||ci==="dialog"||ci==="quiz"){o.dlg=null;o.quiz=null;}
      if((ci==="repeat"||ci==="slow")&&o.quiz&&!o.last){miniSay(C,"Translate: “"+o.quiz.gl+"”");return;}
      miniDo(C,ci,q,[],um);

      return;
    }
  }
  // laufendes Rollenspiel
  if(o.dlg){
    if(wantsStop){o.dlg=null;miniSay(C,"Dialogue ended. Ask me something or say “dialogue” for a new one.");return;}
    const d=o.dlg,exp=d.L[d.p];
    const ev=evaluate(exp[1],[q]);um.cmp={target:exp[1],score:ev.score,words:ev.words};
    if(ev.score>=85)addXp(2);
    dlgAdvance(C,d,d.p+1);return;
  }
  // laufendes Quiz
  if(o.quiz){
    if(wantsStop){o.quiz=null;miniSay(C,"Quiz finished. Well done!");return;}
    const t=o.quiz.target,ev=evaluate(t,[q]);um.cmp={target:t,score:ev.score,words:ev.words};
    if(ev.score>=85){addXp(2);miniSay(C,"Correct! ✅");}else miniSay(C,"Not quite – the correct version is:",t,o.quiz.gl);
    quizNext(C);return;
  }
  if(wantsStop){miniDo(C,"stop",q,[],um);return;}
  // Absicht: erst Modell, bei klaren Mustern zusätzlich Regeln
  let intent=ai.intent,conf=ai.conf;
  if(RX.repeat.test(q)&&intent!=="repeat"){intent="repeat";conf=.9;}
  if(RX.slow.test(q)&&intent!=="slow"){intent="slow";conf=.9;}
  const native=!["target","unknown"].includes(intent);
  if(native&&conf>=.5){miniDo(C,intent,q,miniSlot(q),um);return;}
  if(native&&conf>=.3&&ai.top.length>1){
    // unsicher: zwei Deutungen zur Auswahl anbieten
    const ch=ai.top.filter(t=>!["target","unknown"].includes(t[0])).slice(0,2).map(t=>[INTENT_LABEL[t[0]]||t[0],t[0]]);
    if(ch.length){C.msgs.push({role:"assistant",text:"Meinst du …?",chips:ch,q,slot:miniSlot(q)});render();return;}
  }
  // Zielsprache bzw. unklar: Eingabe korrigieren und gegen Dialogzeilen abgleichen
  miniFixedReply(C,q,qt,um);
}
function miniFixedReply(C,q,qt,um){
  const o=C.ot,fx=miniFix(qt),qn=ngVec(fx.join(" "));
  const bl=miniBest(fx,MINI.lines,"tk",qn,"ng"),bi=miniBest(fx,MINI.items,"tk",qn,"ng"),bn=miniBest(qt,MINI.items,"gk",ngVec(qt.join(" ")),"gg");
  const tgtScore=Math.max(bl.s,bi.s);
  if(bn.s>tgtScore+.1&&bn.s>=.65){miniSay(C,"This is how you say it:",bn.c.tgt,bn.c.gl);return;}
  if(bl.s>=.5&&bl.s>=bi.s-.05){
    const c=bl.c;
    if(norm(q)!==norm(c.tgt)){const ev=evaluate(c.tgt,[q]);um.cmp={target:c.tgt,score:ev.score,words:ev.words};}
    let reply=c.L[c.i+1]&&c.L[c.i+1][0]!==c.spk?c.L[c.i+1]:(c.L[c.i-1]&&c.L[c.i-1][0]!==c.spk?c.L[c.i-1]:null);
    if(!reply)reply=c.L[c.i+1]||c.L[c.i-1];
    if(reply){miniSay(C,bl.s<.85?"Did you mean: “"+c.tgt+"”? Then I would answer like this:":"My answer:",reply[1],reply[2]);addXp(1);return;}
  }
  if(bi.s>=.7){
    const c=bi.c;if(norm(q)!==norm(c.tgt)){const ev=evaluate(c.tgt,[q]);um.cmp={target:c.tgt,score:ev.score,words:ev.words};}
    miniSay(C,"„"+c.tgt+"” means: “"+c.gl+"”",c.tgt,c.gl);return;
  }
  miniSay(C,"I didn't understand that. You can ask for example: “What does … mean?”, “How do you say …?”, “Give me a sentence with …”, “Test me” or say a sentence from the lesson.");
}

/* Placement ohne KI: Auswahlaufgaben, vom Leichten zum Schweren */
function otPlaceStart(){
  const C=V.chat;C.err="";C.msgs=[];
  C.ot={mode:"place",li:0,k:0,right:[0,0,0,0],qs:[],cur:null,done:false};
  C.msgs.push({role:"assistant",text:"Here we go: short tasks, from easy to hard. Choose the correct answer each time. If unsure, choose “I don't know” – that is perfectly fine."});
  otPlaceAsk();
}
function otPlaceAsk(){
  const C=V.chat,o=C.ot;
  if(!o.qs.length||o.k===0){
    const pool=[];UNITS.filter(u=>u.lvl===LEVELS[o.li]).forEach(u=>(u.ex||[]).forEach(c=>pool.push(c)));
    o.qs=shuffle(pool).slice(0,3);
  }
  const c=o.qs[o.k];
  if(!c){otPlaceDone(o.li);return;}
  o.cur=c;
  C.msgs.push({role:"assistant",text:"Question "+(o.li*3+o.k+1)+" · "+LEVELS[o.li]+": "+c[0],opts:shuffle(c[2].slice()).concat(["I don't know"])});
  render();
}
function otPlaceDone(li,all){
  const C=V.chat;
  S.level=LEVELS[li];S.placed=Date.now();save();V.cards=null;V.ex=null;C.level=S.level;
  const txt=all?"Great! You solved all levels confidently – you start at "+S.level+".":(li===0?"You start from the beginning at A1 – perfect for getting started.":"The tasks of level "+S.level+" were not yet quite secure – that is where you begin.");
  C.result={lvl:S.level,text:txt};C.msgs=[];C.ot=null;render();
}

   case"go":go(dsx.tab);break;

   case"toLesson":openUnit(nextUnit().id);break;

   case"vmToggle":vmToggle();break;

   case"chatKbd":{const i=$("#cin");if(i)i.focus();toast("Tap the microphone icon on your iPhone keyboard (bottom right), speak, then tap “Send”.",6000);break;}
   case"kbScore":scoreText(($("#kbin")||{}).value);break;
   case"chatAuto":V.chat.auto=!V.chat.auto;render();break;
   case"chatSayT":speak(V.chat.msgs[+dsx.i].cmp.target,.9);break;
   case"chatSayG":speak(V.chat.msgs[+dsx.i].goal,.9);break;
   case"chatSay":speak(V.chat.msgs[+dsx.i].text,.9);break;
   case"chatRead":speakNative(V.chat.msgs[+dsx.i].text);break;
   case"openUnit":openUnit(dsx.u);break;
   case"back":V.unit=null;render();break;
   case"utab":V.utab=dsx.t;stopAudio();render();break;
   case"say":speak(IDX[dsx.i].idn,dsx.slow?.55:.95);break;
   case"sayw":speak(dsx.w,.9);break;
   case"saySP":speak(SP.target,dsx.slow?.55:.9);break;
   case"sayLine":{const u=UNIT(dsx.u);speak(u.dlg.lines[+dsx.l][1],.9,u.dlg.lines[+dsx.l][0]==="A"?1:1.18);break;}
   case"sayAll":{const its=ITEMS.filter(x=>x.u===dsx.u&&x.k===dsx.k);const my=++playTok;(async()=>{for(const x of its){if(my!==playTok)return;await speak(x.idn,.9);await sleep(400);}})();break;}
   case"playDlg":{const u=UNIT(dsx.u);playDlg(u);break;}
   case"toggleDe":V.showDe=!V.showDe;render();break;
   case"toggleId":V.showId=!V.showId;render();break;
   case"startCards":V.scope=dsx.scope;V.cards=null;go("cards");break;
   case"startEx":V.scope=dsx.scope;if(dsx.type)V.exType=dsx.type;V.ex=null;go("ex");break;
   case"newCards":buildCards();render();break;
   case"freeCards":buildCards(true);render();break;
   case"flip":V.cards.flip=true;render();break;
   case"rate":rateCard(+dsx.r);break;
   case"goSpeakItem":{const it=IDX[dsx.i];const l=ITEMS.filter(x=>x.u===it.u&&x.k===it.k);V.sp={mode:"item",unit:it.u,kind:it.k,i:l.indexOf(it)};go("speak");break;}
   case"spMode":V.sp.mode=dsx.m;Rec.stop(true);stopAudio();render();break;
   case"spNext":case"spPrev":case"spRand":{const l=ITEMS.filter(x=>x.u===V.sp.unit&&x.k===V.sp.kind);const n=l.length;V.sp.i=a==="spRand"?Math.floor(Math.random()*n):(V.sp.i+(a==="spNext"?1:n-1))%n;Rec.stop(true);render();break;}
   case"toggleRec":Rec.active?Rec.stop():Rec.start(null,recMode()==="sr"?"rec":undefined);break;
   case"altRec":{
    let inp=document.getElementById("altrecinp");
    if(!inp){inp=document.createElement("input");inp.type="file";inp.accept="audio/*";inp.setAttribute("capture","microphone");inp.id="altrecinp";inp.style.display="none";document.body.appendChild(inp);
      inp.addEventListener("change",()=>{const f=inp.files&&inp.files[0];if(!f)return;
        if(SP.url){try{URL.revokeObjectURL(SP.url);}catch(e){}}
        SP.url=URL.createObjectURL(f);S.totalSpeak=(S.totalSpeak||0)+1;D().speak++;addXp(1);save();
        SP.status="Recording accepted. Tap ⇄ Compare or ▶ My recording.";inp.value="";render();});}
    inp.click();break;}
   case"scoreOnly":Rec.active?Rec.stop():Rec.start(null,"sr");break;
   case"playMine":playMine();break;
   case"compare":compareAudio();break;
   case"startRp":V.rp={u:dsx.u,role:dsx.role||"B",i:0,scores:[],played:{},done:false};V.sp.mode="role";go("rp");break;
   case"rpNext":{const r=V.rp;if(SP.res)r.scores[r.i]=SP.res.score;Rec.stop(true);stopAudio();r.i++;SP._rpIdx=-1;render();break;}
   case"rpRestart":V.rp={u:V.rp.u,role:V.rp.role,i:0,scores:[],played:{},done:false};SP._rpIdx=-1;render();break;
   case"rpSwap":V.rp={u:V.rp.u,role:V.rp.role==="A"?"B":"A",i:0,scores:[],played:{},done:false};SP._rpIdx=-1;render();break;
   case"hMode":V.hear.mode=dsx.m;stopAudio();render();break;
   case"newDict":buildDict();render();break;
   case"dPlay":{const q=V.hear.q;speak(IDX[q.qs[q.i]].idn,dsx.slow?.5:.85);break;}
   case"dHint":{const h=document.getElementById("dhint");if(h)h.style.display="block";break;}
   case"dCheck":dictCheck();break;
   case"dNext":{const q=V.hear.q;q.i++;q.res=null;q.typed="";q.played=false;render();break;}
   case"newEx":newEx();render();break;
   case"exPlay":{const q=V.ex.qs[V.ex.i];speak(q.it.idn,dsx.slow?.55:.9);break;}
   case"exPlayText":speak(dsx.x,.9);break;
   case"exOpt":{const q=V.ex.qs[V.ex.i];if(q.res!==undefined)break;const i=+dsx.i;q.pick=i;let ok=false;
     if(q.t==="cloze"||q.t==="gram")ok=q.o[i]===q.a;else ok=q.o[i].id===q.it.id;exFinish(q,ok);break;}
   case"exTake":{const q=V.ex.qs[V.ex.i];const c=q.pool.splice(+dsx.k,1)[0];q.ans.push(c);render();break;}
   case"exDrop":{const q=V.ex.qs[V.ex.i];if(q.res!==undefined)break;const c=q.ans.splice(+dsx.k,1)[0];q.pool.push(c);render();break;}
   case"exBuildCheck":{const q=V.ex.qs[V.ex.i];exFinish(q,norm(q.ans.map(c=>c.w).join(" "))===norm(q.it.idn));break;}
   case"exTransCheck":exTransCheck();break;

   case"exNext":V.ex.i++;render();break;
   case"diagSpeakOn":unlockAudio();speakOnline(LT.testSent,.95).then(ok=>{if(!ok)toast("Online voice unreachable or blocked (see log).");});break;
   case"diagSpeakDef":unlockAudio();speak("Hello. This is a test of the speech output.",1,1,true);break;
   case"diagSpeak":unlockAudio();speak(LT.testSent,.9);break;

   case"bkCopy":{const txt=JSON.stringify(S),msg=document.getElementById("bkmsg");
     const ok=()=>{S.lastBackup=Date.now();save();msg.textContent="✅ Copied. Paste the text e.g. into Notes and keep it safe.";};
     const fallback=()=>{const b=document.getElementById("bk");try{b.value=txt;b.focus();b.select();b.setSelectionRange(0,txt.length);document.execCommand("copy")?ok():(msg.textContent="Please copy the selected text under “Show backup text” manually.");}catch(x){msg.textContent="Please copy the text under “Show backup text” manually.";}};
     try{navigator.clipboard.writeText(txt).then(ok,fallback);}catch(x){fallback();}break;}
   case"bkFile":{try{const blob=new Blob([JSON.stringify(S)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");
     a.href=u;a.download="belajar-sicherung-"+today()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1500);
     S.lastBackup=Date.now();save();document.getElementById("bkmsg").textContent="✅ Saving file (on iPhone: save to “Files”).";}catch(x){document.getElementById("bkmsg").textContent="Download not possible – use “Copy to clipboard”.";}break;}
   case"bkImport":{try{const o=JSON.parse(document.getElementById("bk").value);if(!o||typeof o!=="object"||!o.box)throw 0;S=Object.assign(S,o);save();document.getElementById("bkmsg").textContent="✅ Imported.";render();}catch(x){document.getElementById("bkmsg").textContent="❌ Invalid backup.";}break;}

  }
});

document.addEventListener("change",e=>{
  const k=e.target.dataset.sel,c=e.target.dataset.chk,v=e.target.value;
  if(e.target.dataset.file==="bk"){
    const f=e.target.files&&e.target.files[0];if(!f)return;const fr=new FileReader();
    fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||typeof o!=="object"||!o.box)throw 0;S=Object.assign(S,o);save();render();const m=document.getElementById("bkmsg");if(m)m.textContent="✅ Backup loaded.";}catch(x){const m=document.getElementById("bkmsg");if(m)m.textContent="❌ File is not a valid backup.";}};
    fr.readAsText(f);return;

  if(c==="hideT"){V.hideT=e.target.checked;render();return;}
